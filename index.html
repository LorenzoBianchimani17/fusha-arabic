      phrases: [
        { ar: "Sabùn", en: "Soap", note: "The chemist is <b>as-saydalìyya</b>, which you already have from Feeling ill. Up to now you could find the shop and not name a single thing in it." },
        { ar: "Shàmbu", en: "Shampoo", note: "Straight out of English, and pronounced the way it looks. A good number of the things in this lesson are borrowed words, so you can guess more of the shelf than you expect." },
        { ar: "Furshàt asnàn", en: "A toothbrush", note: "Two nouns stuck together: <b>fùrsha</b>, a brush, then <b>asnàn</b>, teeth. Arabic builds compounds like this and never needs a word for <i>of</i>. You already have the singular in <b>ʿÌndi àlam fi sìnni</b>." },
        { ar: "Maʿjùn asnàn", en: "Toothpaste", note: "The same shape again, with <b>maʿjùn</b>, paste, on the front. Learn the pair together: they sit side by side on the shelf and differ by one word." },
        { ar: "ʿÌtr", en: "Perfume", note: "One short word, and it covers the bottle and the smell coming off it." },
        { ar: "Shàfrat hilàqa", en: "A razor", note: "<b>Hilàqa</b> is shaving and <b>shàfra</b> is the blade. In the Levant the blade on its own does the whole job: ask for a <b>shàfra</b> and you get handed the right thing." },
        { ar: "Manadìl", en: "Tissues", note: "Already a plural: one of them is a <b>mandìl</b>, which is also the cloth handkerchief. The Levantine word is a different word altogether, <b>mahàrem</b>, and it is the one you will hear." },
        { ar: "Wàraq tuwalèt", en: "Toilet paper", note: "<b>Wàraq</b> is paper. You will also hear <b>wàraq hammàm</b>, built on the <b>hammàm</b> from <b>Àina al-hammàm?</b>, and either is understood." },
        { ar: "Hal ʿìndakum sabùn?", en: "Do you have soap?", core: true, note: "Swap the last word for anything else in this lesson." },
        { ar: "Ahtàj shàmbu", en: "I need shampoo", core: true, note: "<b>Ahtàj</b> from Common verbs, finally doing the job it was built for. In the Levant it becomes <b>làzemni</b>, literally <i>it is necessary to me</i>, and across a counter that is what you will hear." },
        { ar: "ʿÌqd", en: "A necklace", note: "The jeweller's half of the lesson. Once there are two of them on the cloth in front of you, the comparatives do the rest: <b>Ày wàhid àrkhas?</b>" },
        { ar: "Siwàr", en: "A bracelet" },
        { ar: "Aqràt", en: "Earrings", note: "A plural, like <b>manadìl</b>: a single earring is a <b>qùrt</b> and you will almost never want it. The Levantine <b>halaʾ</b> is a different word rather than a worn-down version of this one." },
        { ar: "Khàtim", en: "A ring", note: "The same word as a seal or a stamp: a ring was once the thing you pressed into the wax." },
        { ar: "Hàdhihi hadìyya", en: "This is a present", core: true, note: "The line that changes the conversation in a jeweller's. It says why you are looking, it invites help, and it makes asking the price polite rather than blunt. <b>Hadìyya</b> is feminine, which is why it takes <b>hàdhihi</b> and not <b>hàdha</b>." }
      ],
      dialogue: [
        { ask: "Hal ʿìndakum sabùn?", askEn: "Do you have soap?", reply: "Naʿam, tafàddal", en: "Yes, here you are" },
        { ask: "Màdha turìd?", askEn: "What would you like?", reply: "Ahtàj shàmbu", en: "I need shampoo" },
        { ask: "Mà hàdha?", askEn: "What is this?", reply: "Hàdhihi hadìyya", en: "This is a present" },
        { ask: "Kam hàdha?", askEn: "How much is this?", reply: "Hàdha ghàli àkthar min al-làzim", en: "This is too expensive" }
      ]
    },
    {
      id: 54,
      title: "A night out",
      intro: "The four places an evening actually happens in, and the questions that get you invited to one.",
      phrases: [
        { ar: "Al-màqha", en: "The cafe", note: "Not a coffee shop with a laptop in it. <b>Al-màqha</b> is the old kind: tea, coffee, backgammon, a television nobody is watching. Same root as <b>qàhwa</b>, the coffee you already order - and in Levantine the two come out the same, <b>al-àhwe</b>." },
        { ar: "Al-bàr", en: "The bar", note: "Borrowed straight from English and it means what you think: a place that serves alcohol. Say <b>al-màqha</b> if that is not what you meant, because the two are not interchangeable and the difference is noticed." },
        { ar: "As-sìnama", en: "The cinema", note: "Another borrowing, and the same word in every Arab country. Films are usually subtitled rather than dubbed, so an evening here is less of a language problem than you would expect." },
        { ar: "Al-màlha al-làili", en: "The nightclub", note: "Literally <b>the night place of amusement</b>. This is the newspaper word; on the street people say <b>klub</b> or the name of the place. Worth recognising more than saying." },
        { ar: "Màdha tàfʿal al-làila?", en: "What are you doing tonight?", f: "Màdha tafʿalìn al-làila?", fLabel: "Speaking to a woman", core: true, how: "safe", note: "You already have <b>Màdha tàfʿal hùna?</b>, what are you doing here. Swap the place for the time and it stops being suspicious and becomes an opening." },
        { ar: "Hal turìd mashrùb?", en: "Do you fancy a drink?", f: "Hal turìdìn mashrùb?", fLabel: "Speaking to a woman", core: true, how: "safe", note: "Built exactly like <b>Hal turìd shày?</b>, which you already say. <b>Mashrùb</b> is anything you drink, juice and coffee included, so it commits nobody to anything." },
        { ar: "Màdha tùhib an tà'kul?", en: "What do you feel like eating?", f: "Màdha tuhibbìn an ta'kulì?", fLabel: "Speaking to a woman", how: "safe", note: "<b>An</b> is the little word that joins the two verbs, and it is the same <b>an</b> as in <b>Hal àstatìʿ an àmshi?</b>" },
        { ar: "Àina yà'kul an-nàs jàyyidan hùna?", en: "Where do people eat well here?", note: "Better than asking for a good restaurant, because it asks where <i>they</i> go rather than where they think you want to go. <b>An-nàs</b>, the people, is the word doing the work." },
        { ar: "Hal hùnaka màkan shàʿbi qarìb min hùna?", en: "Is there somewhere local near here?", note: "The frame from Places in town with the noun swapped again. <b>Shàʿbi</b> comes from <b>shaʿb</b>, a people, and means <i>of the people</i>: plain, cheap, packed, and not aimed at you. It is a compliment when you say it and a compliment when they answer." },
        { ar: "Ày màkan tànsah bìhi?", en: "Which place do you recommend?", f: "Ày màkan tànsahìn bìhi?", fLabel: "Speaking to a woman", core: true, how: "safe", note: "You already have the bare <b>Màdha tànsah?</b> Naming the thing and adding <b>bìhi</b>, <i>of it</i>, turns a question about the menu into a question about the evening." },
        { ar: "Urìd an ujàrrib shày' mahàlli", en: "I would like to try something local", note: "Hear the catch at the end or you will order tea. <b>Shày</b> is tea; <b>shày'</b> is <i>a thing</i>. Said in a restaurant it hands the choice back to the person who knows." },
        { ar: "Hal nàdhhab màʿan?", en: "Shall we go together?", how: "direct", note: "<b>Hayyà bina màʿan</b> tells someone the plan; this asks them. The <b>na-</b> on the front is the <i>we</i> you already have in <b>nàshrab</b>." },
        { ar: "Hal tà'ti maʿì?", en: "Do you want to come?", f: "Hal ta'tìn maʿì?", fLabel: "Speaking to a woman", how: "direct", note: "The lighter of the two invitations: you are going anyway, and there is room. Said in passing it costs the other person nothing to refuse, which is exactly why it gets accepted." },
        { ar: "Nàltaqi amàm as-sìnama", en: "Let us meet in front of the cinema", note: "Two things you already have welded together: <b>Nàltaqi hunàk</b> from Asking someone out, and the <b>amàm</b> of <b>Intàdhirni amàm al-bàb</b>. Naming the landmark is what stops the evening falling apart over the phone." }
      ],
      dialogue: [
        { ask: "Màdha tàfʿal al-làila?", askEn: "What are you doing tonight?", reply: "Anà hùrr al-làila", en: "I am free tonight" },
        { ask: "Hal turìd mashrùb?", askEn: "Do you fancy a drink?", reply: "Bikùll surùr", en: "With pleasure" },
        { ask: "Ày màkan tànsah bìhi?", askEn: "Which place do you recommend?", reply: "As-sàmak ladhìdh hùna", en: "The fish is good here" },
        { ask: "Hal nàdhhab màʿan?", askEn: "Shall we go together?", reply: "Nàltaqi amàm as-sìnama", en: "Let us meet in front of the cinema" }
      ]
    },
    {
      id: 55,
      title: "The way they put it",
      intro: "Things that mean nothing if you take them apart. A price is a last word, a favour is a clean job, patience is something the problem wants from you, and the day it all happens is the day the apricots come in.",
      phrases: [
        { ar: "Àkhir sìʿr?", en: "What is your best price?", how: "safe", core: true, note: "Literally <b>last price?</b> - two words, no verb, no <i>what is</i>. It moves a haggle from the opening number to the real one, and it is not rude: the seller is waiting for it. Say it once, then stop talking." },
        { ar: "Là ghàla ʿalàik", en: "For you, nothing is too dear", f: "Là ghàla ʿalàiki", fLabel: "Speaking to a woman", note: "Literally <i>there is no expensiveness upon you</i>. The seller says it while not moving the price, and it means <b>you are worth it</b> rather than <b>I have come down</b>. Say it back when you are the one giving something away." },
        { ar: "Hàdha bi rà's màli", en: "I am giving it to you at cost", note: "Literally <i>this is at the head of my money</i> - <b>rà's al-màl</b> is capital, the money you started with. Nobody believes it and everybody says it: it is a move in the game, and hearing it means you are close to the end." },
        { ar: "Hàdhihi àkhir kàlima", en: "That is my final word", how: "direct", note: "The same <b>àkhir</b> you have from <b>Àkhir màrra</b>, the last time. It closes the haggle from your side. Say it and then be willing to walk, because saying it and then paying more is the one thing that costs you the room." },
        { ar: "Basìta", en: "It is nothing, forget it", core: true, note: "Literally <i>a simple one</i>, feminine, agreeing with a word nobody says out loud: <b>the matter</b>. It does three jobs - <i>that was easy</i>, <i>no trouble at all</i>, and <i>never mind</i> after somebody apologises." },
        { ar: "Tàhtaj sàbran", en: "This is going to take some doing", note: "Literally <i>it needs patience</i>. The street is better: <b>bìddha sàber</b>, <i>it wants patience</i> - the same <b>bìddi</b> you know for <i>I want</i>, with the problem doing the wanting. It says a thing is hard without calling it hard." },
        { ar: "ʿAlà màhlak", en: "Take your time, no rush", f: "ʿAlà màhlik", fLabel: "Speaking to a woman", note: "Literally <i>at your slowness</i>. Said to a driver going too fast, to somebody apologising for keeping you, to anyone rushing. Never a rebuke: you are handing them permission to be slow." },
        { ar: "Mùndhu sàʿa wa anà antàdhir", en: "I have been waiting an hour", how: "direct", note: "Literally <i>since an hour, and I am waiting</i> - Arabic keeps the verb in the present, because the waiting is still going on. The street version is stranger and far commoner: <b>sàrli sàʿa ʿam ìstanna</b>, <i>it has become to me an hour</i>." },
        { ar: "Kamà tashà'", en: "As you like, it is up to you", f: "Kamà tashaìn", fLabel: "Speaking to a woman", note: "The street says <b>ʿalà kèifak</b>, literally <i>upon your mood</i> - the same <b>kèif</b> that asks how you are in <b>kìfak?</b> Generous when you mean it, and <i>do what you like then</i> when you do not, with the words identical either way." },
        { ar: "Là yuhìmmuk", en: "Never mind, do not give it a thought", f: "Là yuhìmmuki", fLabel: "Speaking to a woman", how: "safe", core: true, note: "Literally <i>let it not concern you</i>. In the street the <b>wàla</b> on the front is no longer <i>and</i> - it is pure emphasis, <i>not for one second</i>. It answers an apology, a worry, and a request, and in the third case it also means <b>consider it done</b>." },
        { ar: "Salàmatuk", en: "Never mind, I am glad you are all right", f: "Salàmatuki", fLabel: "Speaking to a woman", note: "Literally <i>your safety</i>. Said to somebody who has tripped, dropped something, missed a train or been ill. It is not <i>sorry</i>: it hands them wellbeing instead of an apology. The answer is <b>Allàh yusàllimuk</b>, which you have from Answering a blessing." },
        { ar: "Ghàdan fi al-mìshmish", en: "That will be the day", note: "Literally <i>tomorrow, in the apricots</i>. The usual explanation is that apricot season in the Levant runs about two weeks, so a promise timed to it is timed to almost nothing. Said about a payment, a repair, a wedding, a government." },
        { ar: "ʿÀmaluk nadìf", en: "That is a clean job", f: "ʿÀmaluki nadìf", fLabel: "Speaking to a woman", note: "Clean means finished properly, nothing left showing, no loose ends - about the object, not about hygiene. Said to a barber, a mechanic, a tailor, a colleague who sent the thing on time. It praises what somebody made rather than how they look." }
      ],
      dialogue: [
        { ask: "Kam hàdha?", askEn: "How much is this?", reply: "Àkhir sìʿr?", en: "What is your best price?" },
        { ask: "Hàdha kathìr", askEn: "That is too much", reply: "Hàdha bi rà's màli", en: "I am giving it to you at cost" },
        { ask: "Àsif", askEn: "Sorry", reply: "Là yuhìmmuk", en: "Never mind, do not give it a thought" },
        { ask: "Mà rà'yuk?", askEn: "What do you think?", reply: "Kamà tashà'", en: "As you like, it is up to you" }
      ]
    },
    {
      id: 56,
      title: "What a price is actually in",
      intro: "The numbers stopped at a hundred, which is less than a coffee costs. Here are the hundreds and the thousands, and the words for the money that comes back.",
      phrases: [
        { ar: "Mi'atàn", en: "Two hundred", note: "Not <b>two hundreds</b>: Arabic has a form for exactly two, and this is it. <b>Mi'a</b> plus the <b>-tàn</b> ending, and the same ending gives you <b>alfàn</b>, two thousand, below." },
        { ar: "Thalathumì'a", en: "Three hundred", core: true, note: "From three to nine the number and the hundred fuse into one word: <b>thalàtha</b> plus <b>mi'a</b> becomes <b>thalathumì'a</b>. In the street they come apart again into two words, <b>tlàt mìyye</b>, which is easier to say and easier to hear." },
        { ar: "Khamsumì'a", en: "Five hundred" },
        { ar: "Alf", en: "One thousand", core: true },
        { ar: "Alfàn", en: "Two thousand" },
        { ar: "Khàmsat alàf", en: "Five thousand", note: "<b>Alàf</b> is the plural of <b>alf</b>, and from three to ten the number stands in front of it as a separate word. In the street the plural is <b>talàf</b>: <b>khams talàf</b>." },
        { ar: "ʿÀsharat alàf", en: "Ten thousand" },
        { ar: "Alfàn wa khamsumì'a", en: "Two thousand five hundred", core: true, note: "Big first, small second, joined with <b>wa</b>. That is the opposite of what the twenties do, where <b>wàhid wa ʿishrùn</b> puts the small number first. Above a hundred, Arabic reads left to right the way you do." },
        { ar: "Al-fàkka", en: "The change", note: "The money that comes back, and the coins in your pocket. A shopkeeper who asks <b>fi fàkke?</b> is asking whether you have anything smaller, and the honest answer is usually no." },
        { ar: "Khudh al-fàkka", en: "Keep the change", note: "Literally <b>take the change</b>, and it is what people say. The same <b>khudh</b> as <b>Khudh wàqtak</b>." },
        { ar: "Àʿtini al-fàkka, min fàdlik", en: "Give me the change, please" },
        { ar: "Làisa ʿìndi fàkka", en: "I do not have change" },
        { ar: "ʿÌndi wàraqa kabìra fàqat", en: "I only have a large note", note: "<b>Wàraqa</b> is a sheet of paper and a banknote both. Say this before he starts counting, not after." },
        { ar: "Hal tàqbal al-bitàqa?", en: "Do you take card?", core: true, note: "In the street the card is the <b>kàrt</b>, straight from English. Outside the cities the answer is no more often than yes." },
        { ar: "Sa'àdfaʿ nàqdan", en: "I will pay cash", note: "<b>Sa-</b> on the front of a verb is the future, the same <b>sa-</b> as in <b>sa'àkhudh</b>, I will take. In the street it becomes a separate word, <b>rah</b>." }
      ],
      dialogue: [
        { ask: "Kam as-sìʿr?", askEn: "How much is it?", reply: "Alfàn wa khamsumì'a", en: "Two thousand five hundred" },
        { ask: "Hal tàqbal al-bitàqa?", askEn: "Do you take card?", reply: "Sa'àdfaʿ nàqdan", en: "I will pay cash" },
        { ask: "Àʿtini al-fàkka, min fàdlik", askEn: "Give me the change, please", reply: "Tafàddal", en: "Here you are" },
        { ask: "Hal ʿìndak fàkka?", askEn: "Do you have change?", reply: "Làisa ʿìndi fàkka", en: "I do not have change" }
      ]
    },
    {
      id: 57,
      title: "When it goes wrong",
      intro: "You could already say you had lost your bag and your passport. You could not say you had lost yourself. And every no in the course so far was built for a shopkeeper.",
      phrases: [
        { ar: "Anà tà'ih", en: "I am lost", f: "Anà tà'iha", fLabel: "Said by a woman", core: true, note: "The course had <b>Fàqadtu haqìbati</b>, I have lost my bag, and nothing for losing yourself. This is the sentence that starts the whole recovery, and without it somebody else has to guess." },
        { ar: "Là àʿrif àina anà", en: "I do not know where I am" },
        { ar: "Hàdha al-ʿunwàn", en: "This is the address", core: true, note: "Said while holding out the phone. It is the move that always works, and until now there was no word for the thing on the screen." },
        { ar: "Hal tàʿrif hàdha ash-shàriʿ?", en: "Do you know this street?", f: "Hal tàʿrifìn hàdha ash-shàriʿ?", fLabel: "Speaking to a woman" },
        { ar: "Hàdha al-ʿunwàn khàta'", en: "This is the wrong address", note: "<b>Khàta'</b> is a mistake, and it goes after the thing rather than in front of it: literally <i>this address is a mistake</i>." },
        { ar: "Àrini ʿalà al-khàrita", en: "Show me on the map", note: "The <b>Àrini</b> from Learning from the person in front of you, pointed at a screen." },
        { ar: "Làisa hùnaka irsàl", en: "There is no signal", note: "Built exactly like <b>Làisa hùnaka mushkìla</b>. In the street it collapses to two words, <b>mà fi irsàl</b>." },
        { ar: "Làisa ʿìndi intèrnet", en: "I have no internet" },
        { ar: "Battàriyati fàrigha", en: "My battery is dead", note: "Literally <i>my battery is empty</i>. The street says it finished rather than emptied: <b>battarìti khìlsit</b>." },
        { ar: "Hal yùmkin ash-shàhn hùna?", en: "Can I charge it here?", note: "The same <b>hal yùmkin</b> that asks to come in and to sit down. Add the thing you want to do and it covers most of what you will ever need to ask permission for." },
        { ar: "Urìd sharìhat hàtif", en: "I want a SIM card", note: "In the shop it is not a card at all: a Levantine seller calls it a <b>khatt</b>, a line." },
        { ar: "Sàraqu mahfàdhati", en: "Someone stole my wallet", note: "Literally <i>they stole my wallet</i>. Arabic reaches for a vague <i>they</i> where English reaches for <i>someone</i>, and nobody hears an accusation in it." },
        { ar: "Ùtrukni, min fàdlik", en: "Leave me alone", how: "direct", note: "The first rung of a ladder the course did not have. Everything you knew until now - <b>Là, shùkran</b>, <b>Shùkran, hàdha kàfi</b>, <b>Là ùrid an ùzʿijak</b> - is built for somebody selling you something. This is for somebody who will not stop, and the <b>min fàdlik</b> is what keeps it a request." },
        { ar: "Là tàtbaʿni", en: "Do not follow me", how: "direct", note: "The second rung. Flat, no softener, and said loudly enough for other people to hear. In the Levant that last part does most of the work." },
        { ar: "Sa'àttasil bish-shùrta", en: "I will call the police", how: "direct", core: true, note: "The last rung. You already know <b>Àina ash-shùrta?</b>, where the police are; this says you intend to involve them. Said once, clearly, and then you walk towards people." }
      ],
      dialogue: [
        { ask: "Hùnaka mushkìla", askEn: "There is a problem", reply: "Anà tà'ih", en: "I am lost" },
        { ask: "Ilà àina?", askEn: "Where to?", reply: "Hàdha al-ʿunwàn", en: "This is the address" },
        { ask: "Hal yùmkin ash-shàhn hùna?", askEn: "Can I charge it here?", reply: "Tafàddal", en: "Here you are" },
        { ask: "Là tàtbaʿni", askEn: "Do not follow me", reply: "Àsif", en: "Sorry" }
      ]

    {
      id: 58,
      title: "At the chemist, and what is wrong",
      intro: "The chemist lesson sold you soap and shampoo and never taught you to ask for medicine. And in seven hundred phrases there was no way to say you were allergic to anything.",
      phrases: [
        { ar: "ʿÌndi hasasìyya min al-mukassaràt", en: "I am allergic to nuts", core: true, note: "The one sentence here that is not optional. Learn the shape and not the nut: <b>ʿìndi hasasìyya min</b> plus anything at all, and you have said it. Literally <i>I have an allergy from</i>." },
        { ar: "ʿÌndi hasasìyya min al-binisilìn", en: "I am allergic to penicillin", note: "The same shape with the word that matters in a pharmacy. Say it before you are handed anything, not after." },
        { ar: "Là àkul al-mukassaràt", en: "I do not eat nuts", note: "The same shape as <b>Là àkul làhm</b> from the food lesson. Softer than the allergy sentence and understood at a table, where the allergy sentence can sound like a fuss." },
        { ar: "Hal ʿìndakum dawà' li as-sudàʿ?", en: "Do you have something for a headache?", core: true, note: "<b>Dawà'</b>, medicine, has been in the course since Feeling ill with nothing to do. This is what it was for: <b>dawà' li</b> plus whatever hurts." },
        { ar: "Hal ʿìndakum dawà' li àlam al-bàtn?", en: "Do you have something for a stomach ache?" },
        { ar: "ʿÌndi ishàl", en: "I have diarrhoea", note: "Not a word anyone enjoys learning, and the one most likely to be needed in the first fortnight." },
        { ar: "ʿÌndi suʿàl", en: "I have a cough", note: "In the street it is a different word altogether, <b>kàhha</b>, and a chemist will use that one." },
        { ar: "ʿÌndi zukàm", en: "I have a cold", note: "The Levantine is <b>rashh</b>, which is what runs rather than what you have." },
        { ar: "Kam màrra fi al-yàum?", en: "How many times a day?", note: "Ask it while the box is still in his hand. <b>Kam</b> plus a singular noun, the same way <b>Kam daqìqa?</b> works." },

  var GLOSS_BY_VARIETY = { lev: GLOSS_LEV };

  // Levantine glues b-, w-, l- and ʿa- straight onto the article, so the
  // article has to come off before anything can be looked up.
  function bareWord(w) {
    return w.replace(/^[bwlʿ](?=(a|i)(l|sh|s|t|th|r|n|z|d)-)/, "")
      .replace(/^(a|i)(l|sh|s|t|th|r|n|z|d)-/, "");
  }

  function glossFor(word) {
    var w = String(word).toLowerCase().replace(/[?!.,;:]/g, "").trim();
    if (!w) return null;
    var dia = GLOSS_BY_VARIETY[variety()];
    var bare = bareWord(w);
    if (dia) {
      if (dia[w]) return dia[w];
      if (dia[bare]) return dia[bare];
      if (dia["al-" + bare]) return dia["al-" + bare];
    }
    if (GLOSS[w]) return GLOSS[w];
    if (GLOSS[bare]) return GLOSS[bare];
    if (GLOSS["al-" + bare]) return GLOSS["al-" + bare];
    return null;
  }

  // Only worth showing when it explains more than the translation does.
  function glossesFor(ar) {
    var words = String(ar).split(/\s+/).filter(Boolean);
    if (words.length < 2) return [];
    var out = [];
    words.forEach(function (w) {
      var g = glossFor(w);
      if (g) out.push({ word: w.replace(/[?!.,;:]/g, ""), gloss: g });
    });
    return out.length >= 2 ? out : [];
  }

  var PASS = 70;
  var ROUNDS = 10;
  var REVIEW_ROUNDS = 12;

  // Three minutes in a queue and twenty on the sofa are not the same
  // session, and there was only ever one length.
  var PACES = [
    { key: "short", label: "3 minutes", rounds: 5 },
    { key: "normal", label: "10 minutes", rounds: 12 },
    { key: "long", label: "As long as it takes", rounds: 30 }
  ];

  function pace() {
    var p = store.pace;
    for (var i = 0; i < PACES.length; i++) if (PACES[i].key === p) return PACES[i];
    return PACES[1];
  }

  // The three lengths are round counts wearing minutes. Once there is
  // evidence, say what they really take you.
  function paceReally() {
    var runs = diary().filter(function (d) {
      return d.secs && (d.kind === "review" || d.kind === "today" || d.kind === "back");
    }).slice(-8);
    if (runs.length < 3) return null;
    var total = 0;
    runs.forEach(function (d) { total += d.secs; });
    return Math.round(total / runs.length / 60);
  }

  function reviewRounds() { return pace().rounds; }

  // How many phrases a day the pool needs if nothing is to decay, against
  // how many the session you chose actually asks. When the first is
  // bigger than the second, some of the course is going to slip however
  // diligent you are, and no amount of scheduling can fix it: the only
  // levers are a longer session or a smaller pool.
  function poolFits() {
    var pool = 0;
    finishedLessons().forEach(function (l) {
      visiblePhrases(l).forEach(function (p) {
        if (!knownRec(l.id, p.ar)) pool++;
      });
    });
    if (!pool) return null;
    var need = Math.ceil(pool / holdFor(MASTERED));
    var have = reviewRounds();
    var longest = PACES[PACES.length - 1].rounds;
    return { pool: pool, need: need, have: have, ok: need <= have, longestOk: need <= longest };
  }
  var MATCH_PAIRS = 5;
  var RETRY_MAX = 4;

  /* ============================================================
     DATA CHECK - runs once at load, so a broken lesson surfaces
     on the home screen instead of halfway through a game.
     ============================================================ */

  function tokens(ar) {
    return String(ar).replace(/[?!.,،]/g, " ").split(/\s+/).filter(Boolean);
  }

  function visiblePhrases(lesson) {
    var out = lesson.phrases.filter(function (p) { return !isHidden(lesson.id, p.ar); });
    // A lesson still needs enough material to build a round from.
    return out.length >= 5 ? out : lesson.phrases;
  }

  function buildable(lesson) {
    return visiblePhrases(lesson).filter(function (p) {
      // Count the words you will actually be dealt, which in a dialect
      // is not the same phrase.
      var n = tokens(disp(p.ar)).length;
      return n >= 2 && n <= 6;
    });
  }

  function checkData() {
    var problems = [];
    var ids = {};

    LESSONS.forEach(function (l) {
      if (ids[l.id]) problems.push("Duplicate lesson id " + l.id);
      ids[l.id] = true;
      if (!l.title || !l.phrases || !l.phrases.length) {
        problems.push("Lesson " + l.id + " has no title or no phrases");
        return;
      }
      if (l.phrases.length < 5) problems.push("Lesson " + l.id + " has fewer than 5 phrases");
      if (buildable(l).length < 2) problems.push("Lesson " + l.id + " has fewer than 2 phrases long enough to build");

      var seenAr = {}, seenEn = {};
      l.phrases.forEach(function (p, i) {
        var where = "Lesson " + l.id + ", phrase " + (i + 1);
        if (!p.ar || !p.en) problems.push(where + " is missing ar or en");
        if (p.ar && !SCRIPT[p.ar]) problems.push(where + ' has no Arabic script for "' + p.ar + '"');
        if (p.f && !SCRIPT[p.f]) problems.push(where + ' has no Arabic script for "' + p.f + '"');
        // Two phrases sharing a side would make the match grid unanswerable.
        if (seenAr[p.ar]) problems.push(where + ' repeats the Arabic "' + p.ar + '"');
        if (seenEn[p.en]) problems.push(where + ' repeats the English "' + p.en + '"');
        seenAr[p.ar] = true;
        seenEn[p.en] = true;
      });

      (l.dialogue || []).forEach(function (d, i) {
        var where = "Lesson " + l.id + ", exchange " + (i + 1);
        if (!d.ask || !d.reply || !d.en || !d.askEn) { problems.push(where + " is incomplete"); return; }
        if (!SCRIPT[d.ask]) problems.push(where + ' has no Arabic script for "' + d.ask + '"');
        if (!SCRIPT[d.reply]) problems.push(where + ' has no Arabic script for "' + d.reply + '"');
      });
    });

    // A phrase can be taught in more than one lesson; collect them all.
    var taught = {};
    function teaches(ar, id) {
      if (!taught[ar]) taught[ar] = [];
      if (taught[ar].indexOf(id) === -1) taught[ar].push(id);
    }
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) {
        teaches(p.ar, l.id);
        // The other gender's form is on the card, spoken, and labelled:
        // a conversation is allowed to put it in someone's mouth.
        if (p.f) teaches(p.f, l.id);
      });
      (l.dialogue || []).forEach(function (d) { teaches(d.ask, l.id); teaches(d.reply, l.id); });
    });

    // The phrasebook is a shortcut into the lessons, never new material.
    var seenLine = {};
    PHRASEBOOK.forEach(function (group) {
      if (!group.lines || !group.lines.length) problems.push('Phrasebook group "' + group.title + '" is empty');
      (group.lines || []).forEach(function (line) {
        var at = 'Phrasebook "' + group.title + '"';
        if (seenLine[line]) problems.push(at + ' repeats "' + line + '"');
        seenLine[line] = true;
        if (!SCRIPT[line]) problems.push(at + ' has no Arabic script for "' + line + '"');
        if (!taught[line]) problems.push(at + ' uses "' + line + '", which no lesson teaches');
      });
    });

    // A spoken form must belong to a phrase the course teaches, or it
    // would sit in the file doing nothing while looking correct.
    var keys = {};
    Object.keys(SCRIPT).forEach(function (k) { keys[k] = true; });
    Object.keys(DIALECT).forEach(function (k) {
      if (!keys[k]) problems.push('Spoken forms are listed for "' + k + '", which no lesson teaches');
      var row = DIALECT[k];
      Object.keys(row).forEach(function (v) {

    "\u0642": "q", "\u0643": "k", "\u0644": "l", "\u0645": "m", "\u0646": "n",
    "\u0647": "h", "\u0648": "u", "\u064A": "i", "\u0621": "'",
    "\u0629": "a", "\u0649": "a", "\u0623": "a", "\u0625": "i", "\u0622": "a",
    "\u0624": "u", "\u0626": "i", "\u0671": "a"
  };

  // Written Arabic leaves the short vowels out, so letter-by-letter gives
  // a consonant skeleton nobody can read: marhaban comes back "mrhba".
  // Far better to find the nearest phrase the course teaches and show it
  // the way you learned it. The skeleton is only the last resort.
  var NEAREST = {};

  function nearestTranslit(heardAr) {
    var memo = NEAREST[heardAr];
    if (memo) return memo;
    var found = nearestTranslitNow(heardAr);
    NEAREST[heardAr] = found;
    return found;
  }

  function nearestTranslitNow(heardAr) {
    var best = null, bestScore = 0;
    for (var k in SCRIPT) {
      if (!Object.prototype.hasOwnProperty.call(SCRIPT, k)) continue;
      var sc = heardScore(heardAr, SCRIPT[k]);
      if (sc > bestScore) { bestScore = sc; best = k; }
    }
    if (best && bestScore >= 0.34) return { text: best, sure: true };
    return { text: romanise(heardAr), sure: false };
  }

  function romanise(ar) {
    var flat = flattenArabic(ar);
    var out = "";
    for (var i = 0; i < flat.length; i++) {
      var c = flat.charAt(i);
      out += (c === " ") ? " " : (ROMAN[c] !== undefined ? ROMAN[c] : "");
    }
    return out.replace(/\s+/g, " ").trim();
  }

  /* ============================================================
     PROGRESS
     ============================================================ */

  var KEY = "fusha-msa-v1";          // the original single-user store
  var BOOK = "fusha-people-v1";      // who exists, and who is current
  var store = { lessons: {} };
  var storageOff = false;
  var people = { list: [], current: null };

  function readRaw(key) {
    try { return window.localStorage.getItem(key); }
    catch (e) { storageOff = true; return null; }
  }

  function writeRaw(key, value) {
    if (storageOff) return;
    try { window.localStorage.setItem(key, value); }
    catch (e) { storageOff = true; }
  }

  function storeKeyFor(id) { return KEY + ":" + id; }

  function savePeople() { writeRaw(BOOK, JSON.stringify(people)); }

  function currentPerson() {
    for (var i = 0; i < people.list.length; i++) {
      if (people.list[i].id === people.current) return people.list[i];
    }
    return people.list[0] || null;
  }

  function loadStoreFor(id) {
    var raw = readRaw(storeKeyFor(id));
    var out = { lessons: {} };
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.lessons) out = parsed;
      } catch (e) { /* a corrupt profile starts clean rather than crashing */ }
    }
    return out;
  }

  function newPersonId() {
    var n = 1;
    var taken = {};
    people.list.forEach(function (p) { taken[p.id] = true; });
    while (taken["p" + n]) n++;
    return "p" + n;
  }

  function load() {
    var book = readRaw(BOOK);
    if (book) {
      try {
        var parsed = JSON.parse(book);
        if (parsed && parsed.list && parsed.list.length) people = parsed;
      } catch (e) { /* fall through to setting one up */ }
    }

    if (!people.list.length) {
      // Anyone already using the app keeps everything: their progress
      // simply becomes the first profile.
      var legacy = readRaw(KEY);
      var first = { id: "p1", name: "Me" };
      people = { list: [first], current: first.id };
      if (legacy) writeRaw(storeKeyFor(first.id), legacy);
      savePeople();
    }

    if (!currentPerson()) people.current = people.list[0].id;
    store = loadStoreFor(people.current);
  }

  function save() {
    bumpTick();
    WRITES++;
    if (storageOff) return;
    writeRaw(storeKeyFor(people.current), JSON.stringify(store));
  }

  function switchTo(id) {
    save();
    people.current = id;
    savePeople();
    store = loadStoreFor(id);
    TALK = null; TALK_KEY = null; ENGLISH = null;
    restoreNote = null;
  }

  function addPerson(name) {
    var id = newPersonId();
    people.list.push({ id: id, name: name || "Someone" });
    savePeople();
    switchTo(id);
    return id;
  }

  function renamePerson(id, name) {
    people.list.forEach(function (p) { if (p.id === id) p.name = name; });
    savePeople();
  }

  function removePerson(id) {
    if (people.list.length < 2) return false;
    var wasCurrent = people.current === id;
    people.list = people.list.filter(function (p) { return p.id !== id; });

    // Deliberately not switchTo: that saves the outgoing store first,
    // which would write the departing profile's data straight back.
    if (wasCurrent) {
      people.current = people.list[0].id;
      store = loadStoreFor(people.current);
      TALK = null; TALK_KEY = null; ENGLISH = null;
      restoreNote = null;
    }
    savePeople();
    try { window.localStorage.removeItem(storeKeyFor(id)); } catch (e) { /* best effort */ }
    return true;
  }

  function personSummary(id) {
    var s = id === people.current ? store : loadStoreFor(id);
    var done = 0;
    Object.keys(s.lessons || {}).forEach(function (k) { if (s.lessons[k].done) done++; });
    return done;
  }

  function recordOf(id) { return store.lessons[id] || null; }

  /* ---------- which Arabic you are learning ---------- */

  function variety() {
    var v = store.variety;
    for (var i = 0; i < VARIETIES.length; i++) if (VARIETIES[i].key === v) return v;
    return "msa";
  }

  function varietyInfo() {
    var v = variety();
    for (var i = 0; i < VARIETIES.length; i++) if (VARIETIES[i].key === v) return VARIETIES[i];
    return VARIETIES[0];
  }

  function setVariety(v) {
    store.variety = v;
    save();
    TALK = null; TALK_KEY = null;
  }

  // The spoken form, if this phrase has one in the chosen variety.
  function dialectOf(ar) {
    var v = variety();
    if (v === "msa") return null;
    var row = DIALECT[ar];
    return (row && row[v]) || null;
  }

  // What to show on screen for a phrase whose key is `ar`.
  // You may have a word you prefer. Aywa instead of èh, or a form you
  // grew up hearing. The course has an opinion; you get the last word.
  function myForm(ar) {
    return (store.myform || {})[ar] || null;
  }

  // If what you asked for is a form the app already knows from another
  // variety, it can still say it out loud. If it is not, it is yours in
  // writing only, and the card says so rather than mispronouncing it.
  function myFormScript(ar) {
    var want = myForm(ar);
    if (!want) return null;
    var found = null;
    var row = DIALECT[ar] || {};
    Object.keys(row).forEach(function (v) {
      if (!found && row[v] && normalise(row[v][0]) === normalise(want)) found = row[v][1];
    });
    if (!found && normalise(ar) === normalise(want)) found = SCRIPT[ar] || null;
    return found;
  }

  function setMyForm(ar, text) {
    if (!store.myform) store.myform = {};
    var clean = String(text || "").trim().slice(0, 40);
    if (clean && normalise(clean) !== normalise(disp(ar))) store.myform[ar] = clean;
    else delete store.myform[ar];
    save();
  }

  function disp(ar) {
    var mine = myForm(ar);
    if (mine) return mine;
    var p = personalOf(ar);
    if (p) return p[0];
    var d = dialectOf(ar);
    return d ? d[0] : ar;
  }

  // Sentences you compose on the Make screen are not in the course, so
  // their script is assembled from the parts and kept here.
  var MADE = {};

  // What to hand the speech engine for it.
  function spk(ar) {
    if (myForm(ar)) return myFormScript(ar) || "";
    var p = personalOf(ar);
    if (p) return p[1];
    var d = dialectOf(ar);
    return d ? d[1] : (SCRIPT[ar] || MADE[ar] || "");
  }

  function isDialectForm(ar) { return !!dialectOf(ar); }

  function varietyCoverage() {
    var v = variety();
    if (v === "msa") return null;
    var have = 0, total = 0, same = 0, coreHave = 0, coreTotal = 0;
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) {
        var differs = !!(DIALECT[p.ar] && DIALECT[p.ar][v]);
        total++;
        if (differs) have++;
        else if ((SAME[v] || {})[p.ar]) same++;
        if (p.core) { coreTotal++; if (differs) coreHave++; }
      });
    });
    return {
      have: have, total: total, same: same, open: total - have - same,
      coreHave: coreHave, coreTotal: coreTotal
    };
  }

  function unlocked(lesson) {
    var idx = LESSONS.indexOf(lesson);
    if (idx <= 0) return true;
    var prev = recordOf(LESSONS[idx - 1].id);
    return !!(prev && prev.done);
  }

  function record(id, score) {
    var r = store.lessons[id] || { best: 0, done: false };
    if (score > r.best) r.best = score;
    if (score >= PASS) r.done = true;
    store.lessons[id] = r;
    save();
  }

  /* ---------- which games are switched on ---------- */

  var GAMES = [
    { key: "quiz", label: "Quiz", hint: "Pick the right meaning" },
    { key: "build", label: "Build", hint: "Put the words in order" },
    { key: "match", label: "Match", hint: "Pair phrase to meaning" },
    { key: "dialog", label: "Reply", hint: "Answer what is said to you" },
    { key: "say", label: "Say it", hint: "Say it aloud, then mark yourself" },
    { key: "listen", label: "Listen", hint: "Hear it, no text", needsVoice: true },
    { key: "write", label: "Write", hint: "Type the transliteration from memory" },
    { key: "dictate", label: "Dictation", hint: "Hear a whole phrase, write it down", needsVoice: true },
    // Not in ASKING: it drills the difference between two spellings of
    // the same phrase, which is a different skill from knowing the
    // phrase, and it has no business taking slots in a lesson.
    { key: "swap", label: "Street or television", hint: "Which is the dialect and which is the fus·ha",
      needsDialect: true, drillOnly: true }
  ];

  var ASKING = ["quiz", "build", "dialog", "say", "listen", "write", "dictate"];

  // Conversation and comprehension lead, because that is the goal:
  // holding a conversation and following one, not spelling.
  // Typing a transliteration is the least conversational thing here and
  // it was taking a third of every session.
  var TYPE_WEIGHT = { dialog: 3, listen: 3, say: 2, quiz: 2, dictate: 2, write: 1, build: 1 };

  function gameByKey(k) {
    for (var i = 0; i < GAMES.length; i++) if (GAMES[i].key === k) return GAMES[i];
    return null;
  }

  function playable(k) {
    var g = gameByKey(k);
    if (g && g.needsVoice && !canSpeak()) return false;
    if (g && g.needsDialect && variety() === "msa") return false;
    return true;
  }

  function games() {
    var stored = store.games || {};
    var out = {}, any = false;
    GAMES.forEach(function (g) {
      var on = stored[g.key] === undefined ? !g.offByDefault : stored[g.key] !== false;
      out[g.key] = on && playable(g.key);
      if (out[g.key]) any = true;
    });
    if (!any) GAMES.forEach(function (g) { out[g.key] = !g.offByDefault && playable(g.key); });
    return out;
  }

  function askingGames() {
    var g = games();
    return ASKING.filter(function (k) { return g[k]; });
  }

  /* ---------- per-phrase strength ---------- */

  /* ---------- the clock ---------- */

  // Everything below counts days, not sessions. Counting sessions meant
  // eight rounds in one evening satisfied a check meant to land a week
  // later, and a phrase mastered once stayed mastered for ever.
  var DAY = 86400000;

  function today() {
    try { return Math.floor(Date.now() / DAY); } catch (e) { return 0; }
  }

  function daysSince(day) {
    if (typeof day !== "number") return null;
    return Math.max(0, today() - day);
  }

  // How long a phrase should hold at each strength, roughly the usual
  // expanding schedule: a day, then three, a week, a fortnight, a month.
  // How long a phrase is left alone at each strength. Measured against
  // the whole course rather than guessed: with the old [0,1,3,7,16,35]
  // and 345 phrases in the pool, a daily session could not come back to
  // anything in time and mastery went backwards from about day 75.
  var HOLDS = [0, 2, 5, 12, 30, 75];

  function holdFor(s) { return HOLDS[Math.max(0, Math.min(HOLDS.length - 1, s))]; }

  var MAX_STRENGTH = 5;
  var MASTERED = 4;
  var WEAK = 2;

  function phraseKey(lessonId, ar) { return lessonId + "|" + ar; }

  function rawStrength(lessonId, ar) {
    return (store.str || {})[phraseKey(lessonId, ar)] || null;
  }

  // What you know now, not what you knew the day you last practised.
  // A phrase left alone past its holding time slips back a step for
  // every further holding time that passes.
  function strengthOf(lessonId, ar) {
    var rec = rawStrength(lessonId, ar);
    if (!rec) return null;
    var s = rec.s;
    var since = daysSince(rec.day);
    if (since === null) return s;
    // One step back, however long you have been away. Sliding a phrase
    // all the way down for a month's absence is what made the whole
    // course lose ground once the pool passed a couple of hundred: a
    // phrase you had cold in March is not back to nothing in May.
    if (s > 0 && since > holdFor(s)) s--;
    return s;
  }

  function isFading(lessonId, ar) {
    var rec = rawStrength(lessonId, ar);
    return !!rec && strengthOf(lessonId, ar) < rec.s;
  }

  // mode: "soft" for a typing slip, which costs one step instead of two;
  // "held" for an answer found on the second attempt, which keeps the
  // phrase off the immediate queue without letting it climb.
  // You got it, but you had to dig for it. The climb is taken back
  // without counting a miss: it is not wrong, it is not solid.
  function onlyJust(lessonId, ar) {
    if (!lessonId || !ar || !store.str) return;
    var rec = store.str[phraseKey(lessonId, ar)];
    if (!rec) return;
    rec.s = Math.max(0, (rec.s || 0) - 1);
    rec.day = today();
    save();
  }

  function bumpStrength(lessonId, ar, right, mode) {
    if (!lessonId || !ar) return;
    if (!store.str) store.str = {};
    var k = phraseKey(lessonId, ar);
    var rec = store.str[k] || { s: 0, n: 0 };
    var now = strengthOf(lessonId, ar);      // after any fading
    if (now !== null) rec.s = now;
    rec.n += 1;
    // Right climbs one step; wrong drops two, so a phrase you keep
    // missing stays in rotation instead of ageing out.
    if (right) {
      if (mode !== "held") rec.s = Math.min(MAX_STRENGTH, rec.s + 1);
    } else {
      rec.s = Math.max(0, rec.s - (mode === "soft" ? 1 : 2));
      // Kept so a phrase that keeps slipping can be recognised as one,
      // and so today's misses can lead tomorrow.
      rec.miss = (rec.miss || 0) + 1;
      rec.missDay = today();
    }
    rec.day = today();
    store.str[k] = rec;
  }

  /* ---------- the ear against the eye ---------- */

  // Two different skills wear the same score. A phrase you get right
  // every time it is on the page and miss every time it is only said to
  // you is not a phrase you know, and until now nothing in the app could
  // see the difference, let alone correct it.
  var MODE_WINDOW = 240;
  var MODE_MIN = 12;
  var GAP_AT = 15;

  function byEar(task) {
    if (!task) return false;
    if (task.type === "listen" || task.type === "dictate") return true;
    // A reply is spoken to you and not written down wherever there is a
    // voice; without one it is a reading exercise.
    if (task.type === "dialog" && canSpeak()) return true;
    return false;
  }

  function onThePage(task) {
    if (!task) return false;
    return task.type === "quiz" || task.type === "write" ||
      task.type === "build" || task.type === "say" ||
      (task.type === "dialog" && !canSpeak());
  }

  function modes() {
    var m = store.modes || {};
    return {
      ear: { n: (m.ear && m.ear.n) || 0, ok: (m.ear && m.ear.ok) || 0 },
      eye: { n: (m.eye && m.eye.n) || 0, ok: (m.eye && m.eye.ok) || 0 }
    };
  }

  function noteMode(task, right) {
    var which = byEar(task) ? "ear" : onThePage(task) ? "eye" : null;
    if (!which) return;
    var m = modes();
    m[which].n += 1;
    if (right) m[which].ok += 1;
    // A window, not a lifetime: what your ear did in March should not
    // still be holding the average down in June.
    if (m[which].n > MODE_WINDOW) {
      m[which].n = Math.round(m[which].n / 2);
      m[which].ok = Math.round(m[which].ok / 2);
    }
    store.modes = m;
  }

  function modePct(side) {
    var m = modes()[side];
    return m.n >= MODE_MIN ? Math.round(m.ok / m.n * 100) : null;
  }

  // Positive when the ear is the one behind.
  function earGap() {
    var e = modePct("ear"), p = modePct("eye");
    if (e === null || p === null) return null;
    return p - e;
  }

  function earBehind() {
    var g = earGap();
    return g !== null && g >= GAP_AT;
  }

  /* ---------- phrases you have set aside ---------- */

  // Marking a phrase as known takes it out of rotation straight away,
  // but not for good: it comes back once, much later, for a spot check.
  // People reliably overrate what they know right after seeing it, and
  // a permanent tick would quietly retire things you would now fail.
  var RECHECK_AFTER = 10;       // days before a set-aside phrase is checked
  var CHECKS_PER_SESSION = 2;   // how many overdue checks a session leads with
  var MISSES_FIRST = 3;         // how many of yesterday's misses a session leads with
  var LEECH_AT = 5;             // misses before a phrase is treated as stuck

  // A phrase you have missed five times and still cannot hold is not
  // learning, it is grinding. It gets treated differently rather than
  // served again identically.
  function missCount(lessonId, ar) {
    var rec = rawStrength(lessonId, ar);
    return rec ? (rec.miss || 0) : 0;
  }

  function isLeech(lessonId, ar) {
    var rec = rawStrength(lessonId, ar);
    if (!rec || (rec.miss || 0) < LEECH_AT) return false;
    return strengthOf(lessonId, ar) <= 1;
  }

  // Missed on an earlier day and not since put right.
  function missedEarlier(lessonId, ar) {
    var rec = rawStrength(lessonId, ar);
    if (!rec || rec.missDay === undefined) return false;
    if ((rec.s || 0) > 1) return false;
    var since = daysSince(rec.missDay);
    return since !== null && since >= 1 && since <= 14;
  }
  var REPLIES_PER_SESSION = 2;  // guaranteed conversation rounds, when there are any

  function runCount() { return store.runs || 0; }

  function knownRec(lessonId, ar) {
    return (store.known || {})[phraseKey(lessonId, ar)] || null;
  }

  function setKnown(lessonId, ar) {
    if (!store.known) store.known = {};
    store.known[phraseKey(lessonId, ar)] = { day: today() };
    save();
  }

  // Records written before the app could tell the time have no day on
  // them; treat those as due rather than as never due.
  function knownAge(rec) {
    if (!rec) return null;
    var d = daysSince(rec.day);
    return d === null ? RECHECK_AFTER : d;
  }

  function clearKnown(lessonId, ar) {
    if (!store.known) return;
    delete store.known[phraseKey(lessonId, ar)];
    save();
  }

  // Asleep now, but due to be checked again.
  function isDueCheck(rec) { return !!rec && knownAge(rec) >= RECHECK_AFTER; }

  function knownCount() {
    return Object.keys(store.known || {}).length;
  }

  function forgetAllKnown() {
    store.known = {};
    save();
  }

  /* ---------- phrases you have hidden ---------- */

  // Different from setting one aside. "Known" means you have it and it
  // comes back for a check. "Hidden" means it is not your problem:
  // a job title you will never claim, a colour you do not care about.
  // It never comes back, and it stops counting toward anything.
  // The course tells you what a phrase means. Nothing until now let you
  // tell yourself: a hook to remember it by, the Italian that comes more
  // naturally, where you heard it.
  function myNote(ar) {
    return (store.mynotes || {})[ar] || "";
  }

  function setMyNote(ar, text) {
    if (!store.mynotes) store.mynotes = {};
    var clean = String(text || "").trim().slice(0, 200);
    if (clean) store.mynotes[ar] = clean;
    else delete store.mynotes[ar];
    save();
  }

  // The app has counted every answer you have given and never shown you
  // one of them.
  function historyOf(lid, ar) {
    var rec = rawStrength(lid, ar);
    if (!rec || !rec.n) return "";
    var miss = rec.miss || 0;
    var right = Math.max(0, rec.n - miss);
    var when = rec.missDay ? daysSince(rec.missDay) : null;
    return '<div class="history">' + right + " right out of " + rec.n +
      (miss
        ? " &#183; last missed " + (when === 0 ? "today" : when === 1 ? "yesterday" : when + " days ago")
        : " &#183; never missed") + "</div>";
  }

  function myNoteHTML(ar) {
    var mine = myNote(ar);
    return '<div class="mynote' + (mine ? " is-set" : "") + '">' +
      (mine ? '<span class="mynote-text">' + esc(mine) + "</span>" : "") +
      '<button class="link-btn" data-act="mynote" data-id="' + esc(ar) + '">' +
      (mine ? "Change my note" : "Add a note of my own") + "</button></div>";
  }

  // The app knows a phrase's strength, whether it is fading and how long
  // its hold is. It has never told you any of it.
  function standing(ar) {
    var lid = lessonTeaching(ar);
    if (!lid) return null;
    var r = recordOf(lid);
    if (!(r && r.done)) return { text: "not started", cls: "cold" };
    if (knownRec(lid, ar)) return { text: "set aside", cls: "aside" };
    var st = strengthOf(lid, ar);
    if (st === null) return { text: "not asked yet", cls: "cold" };
    var rec = rawStrength(lid, ar);
    var since = rec ? daysSince(rec.day) : null;
    var hold = holdFor(st);
    var left = (since === null) ? null : Math.max(0, hold - since);
    var word = st >= MASTERED ? "solid" : st >= 2 ? "holding" : "weak";
    if (isFading(lid, ar)) return { text: word + " · slipping", cls: "fade" };
    return {
      text: word + (left === null ? "" : left === 0 ? " · due now" : " · about " + left + (left === 1 ? " day" : " days")),
      cls: st >= MASTERED ? "solid" : st >= 2 ? "warm" : "cold"
    };
  }

  function standingHTML(ar) {
    var st = standing(ar);
    if (!st) return "";
    return '<span class="standing is-' + st.cls + '">' + esc(st.text) + "</span>";
  }

  function isHidden(lessonId, ar) {
    return !!(store.hidden || {})[phraseKey(lessonId, ar)];
  }

  function toggleHidden(lessonId, ar) {
    if (!store.hidden) store.hidden = {};
    var k = phraseKey(lessonId, ar);
    if (store.hidden[k]) delete store.hidden[k];
    else {
      store.hidden[k] = true;
      // Hiding supersedes setting aside; keeping both would be noise.
      if (store.known) delete store.known[k];
    }
    save();
  }

  function hiddenCount() { return Object.keys(store.hidden || {}).length; }

  function unhideAll() { store.hidden = {}; save(); }

  var ENGLISH = null;

  function englishFor(ar) {
    if (!ENGLISH) {
      ENGLISH = {};
      LESSONS.forEach(function (l) {
        l.phrases.forEach(function (p) { if (!ENGLISH[p.ar]) ENGLISH[p.ar] = p.en; });
        (l.dialogue || []).forEach(function (d) {
          if (!ENGLISH[d.ask]) ENGLISH[d.ask] = d.askEn;
          if (!ENGLISH[d.reply]) ENGLISH[d.reply] = d.en;
        });
      });
    }
    return ENGLISH[ar] || "";
  }

  function phrasesOf(lesson) {
    var out = lesson.phrases.map(function (p) {
      return { ar: p.ar, en: p.en, core: !!p.core, phrase: p, lesson: lesson };
    });
    (lesson.dialogue || []).forEach(function (d) {
      out.push({ ar: d.reply, en: d.en, core: false, exchange: d, lesson: lesson });
    });
    return out;
  }

  // A word you heard in the street belongs in the same machinery as
  // everything the course taught you, which means it has to arrive as a
  // lesson. This is that lesson: no script, so nothing that needs audio
  // will offer it, and no core, because you decide what yours are for.
  var MINE_ID = 900;

  function mineWords() { return store.mine || []; }

  function mineLesson() {
    var words = mineWords();
    if (!words.length) return null;
    return {
      id: MINE_ID,
      title: "Words you brought",
      intro: "Words you heard somewhere and wrote down yourself.",
      isMine: true,
      phrases: words.map(function (w) { return { ar: w.ar, en: w.en }; })
    };
  }

  function finishedLessons() {
    var out = LESSONS.filter(function (l) {
      var r = recordOf(l.id);
      return !!(r && r.done);
    });
    var mine = mineLesson();
    if (mine) out.push(mine);
    return out;
  }

  // Everything in the lessons you have passed, with how well you know it.
  function studied() {
    var out = [];
    finishedLessons().forEach(function (l) {
      phrasesOf(l).forEach(function (item) {
        if (isHidden(l.id, item.ar)) return;
        item.s = strengthOf(l.id, item.ar);
        item.fading = isFading(l.id, item.ar);
        var rec = knownRec(l.id, item.ar);
        item.known = !!rec;
        item.dueCheck = isDueCheck(rec);
        out.push(item);
      });
    });
    return out;
  }

  function progressCounts() {
    var all = studied();
    var mastered = 0, weak = 0, fading = 0;
    all.forEach(function (i) {
      if (i.known) { mastered++; return; }
      if (i.s === null) return;
      if (i.fading) fading++;
      if (i.s >= MASTERED) mastered++;
      else if (i.s <= WEAK) weak++;
    });
    return { total: all.length, mastered: mastered, weak: weak, fading: fading, known: knownCount() };
  }

  /* ---------- the core ---------- */

  // The backbone of the language: a phrase carries the label if it can
  // hold up a conversation on its own. Counted across the whole course,
  // not just the lessons you have passed, so the target never moves.
  function coreItems() {
    var out = [];
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) {
        if (p.core && !isHidden(l.id, p.ar)) {
          out.push({
            ar: p.ar, en: p.en, lesson: l,
            s: strengthOf(l.id, p.ar),
            known: !!knownRec(l.id, p.ar)
          });
        }
      });
    });
    return out;
  }

  function coreCounts() {
    var all = coreItems();
    var solid = 0, reached = 0;
    all.forEach(function (i) {
      var r = recordOf(i.lesson.id);
      var inReach = !!(r && r.done);
      if (inReach) reached++;
      // Setting a phrase aside counts as solid: you said you had it,
      // and the spot check later will say otherwise if you did not.
      if (inReach && (i.known || (i.s !== null && i.s >= MASTERED))) solid++;
    });
    return { total: all.length, solid: solid, reached: reached };
  }

  function isCoreSolid() {
    var c = coreCounts();
    return c.reached > 0 && c.solid >= c.reached;
  }

  /* ============================================================
     HELPERS
     ============================================================ */

  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // A wrong answer has to be wrong. Two phrases that do the same job -
  // marhàban and àhlan, anà bikhèir and al-hàmdu lillàh - are both right
  // answers to the same question, and offering one as the mistake is the
  // app being wrong, not you.
  function sameJob(a, b) {
    if (!a || !b || a === b) return false;
    var ga = null, gb = null;
    TWINS.forEach(function (t) {
      if (t.members.indexOf(a) !== -1) ga = t.id;
      if (t.members.indexOf(b) !== -1) gb = t.id;
    });
    return !!ga && ga === gb;
  }

  function phraseOf(p) {
    return p && (p.ar || p.reply || null);
  }

  function distractors(pool, correct, field, n, answerAr) {
    var out = [];
    shuffle(pool).forEach(function (p) {
      if (out.length >= n || p[field] === correct) return;
      if (answerAr && sameJob(phraseOf(p), answerAr)) return;
      for (var i = 0; i < out.length; i++) if (out[i][field] === p[field]) return;
      out.push(p);
    });
    return out;
  }

  // Two typed answers are the same answer when the letters are. Where
  // the word breaks fall is a matter of taste in a transliteration:
  // "assalamu alaikum" and "as-salàmu ʿaláikum" are one phrase.
  function sameSaid(a, b) {
    return normalise(a).replace(/ /g, "") === normalise(b).replace(/ /g, "");
  }

  // Doubled letters are a spelling decision, not a word. Al-hàmdu lillàh
  // typed as alhamdulilah is the same sentence, and being marked wrong
  // for it teaches nothing about Arabic.
  function sameSaidLoose(a, b) {
    var flat = function (x) {
      return normalise(x).replace(/ /g, "").replace(/(.)\1+/g, "$1");
    };
    return flat(a) === flat(b);
  }

  // What you typed against every form of the phrase this app knows: the
  // one on screen, the fus-ha behind it, and the other dialects. Choosing
  // Levantine should not make the fus-ha you already know into an error.
  // One letter out on a long word is a slip of the thumb, not a phrase
  // you do not know. Two letters out is a different word.
  function oneOut(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    if (a.length < 6 && b.length < 6) return false;
    var i = 0, j = 0, slips = 0;
    while (i < a.length && j < b.length) {
      if (a.charAt(i) === b.charAt(j)) { i++; j++; continue; }
      if (++slips > 1) return false;
      if (a.length > b.length) i++;
      else if (b.length > a.length) j++;
      else { i++; j++; }
    }
    return slips + (a.length - i) + (b.length - j) <= 1;
  }

  // If what you wrote is another phrase the course teaches, that is worth
  // knowing: "not quite" tells you nothing, "that is tea" tells you what
  // happened.
  function phraseTyped(typed, notThis) {
    var hit = null;
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) {
        if (hit || p.ar === notThis) return;
        if (sameSaid(typed, p.ar) || sameSaid(typed, disp(p.ar))) hit = p;
      });
    });
    return hit;
  }

  function otherGenderOf(ar) {
    var out = null;
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) {
        if (out) return;
        if (p.ar === ar && p.f) out = p.f;
        else if (p.f === ar) out = p.ar;
      });
    });
    return out;
  }

  function judgeTyped(typed, ar) {
    if (!normalise(typed)) return null;
    var shown = disp(ar);
    if (sameSaid(typed, shown)) return { right: true };
    // the course's own form stays right even after you have replaced it
    if (myForm(ar) && (sameSaid(typed, dialectOf(ar) ? dialectOf(ar)[0] : ar))) return { right: true };
    if (sameSaid(typed, ar)) return { right: true, other: ar === shown ? null : "fusha" };
    var loose = sameSaidLoose(typed, shown) || sameSaidLoose(typed, ar);
    if (loose) return { right: true, loose: true };
    var found = null;
    VARIETIES.forEach(function (v) {
      if (found || v.key === "msa" || v.key === variety()) return;
      var d = (DIALECT[ar] || {})[v.key];
      if (d && (sameSaid(typed, d[0]) || sameSaidLoose(typed, d[0]))) found = v.label;
    });
    if (found) return { right: true, other: found };
    // The card teaches both genders, says which is which and speaks them
    // both. Typing the other one is not an error.
    var twin = otherGenderOf(ar);
    if (twin && (sameSaid(typed, twin) || sameSaid(typed, disp(twin)) || sameSaidLoose(typed, disp(twin)))) {
      return { right: true, gender: twin };
    }
    var flat = function (x) { return normalise(x).replace(/ /g, ""); };
    if (oneOut(flat(typed), flat(shown)) || oneOut(flat(typed), flat(ar))) {
      return { right: true, typo: true };
    }
    var was = phraseTyped(typed, ar);
    return { right: false, instead: was ? { ar: was.ar, en: was.en } : null };
  }

  // What counts as the same typed answer: accents, case, the ayn mark,
  // hyphens, doubled spaces and end punctuation are all forgiven.
  function normalise(s) {
    return String(s)
      .toLowerCase()
      .replace(/[àáâä]/g, "a").replace(/[èéêë]/g, "e").replace(/[ìíîï]/g, "i")
      .replace(/[òóôö]/g, "o").replace(/[ùúûü]/g, "u")
      .replace(/[ʿʾ'`´’‘]/g, "")
      .replace(/[?!.,;:]/g, "")
      .replace(/-/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  /* ============================================================
     ROUND BUILDERS
     ============================================================ */

  // Four options while it is new, three once it is holding, two when you
  // nearly have it. A phrase you have known for a month was being asked
  // exactly like one you met yesterday, which wasted half the round.
  function optionsFor(lessonId, ar) {
    var s = strengthOf(lessonId, ar);
    if (s === null || s <= 1) return 3;
    if (s <= 3) return 2;
    return 1;
  }

  function quizRound(lesson, phrase) {
    // Asked in English, a parked phrase would be exactly the choice you
    // said you did not want to make. Asked in Arabic, it is the reason
    // you kept it.
    var toEnglish = isPassive(phrase.ar) || Math.random() < 0.5;
    var field = toEnglish ? "en" : "ar";
    var want = optionsFor(lesson.id, phrase.ar);
    var wrong = distractors(visiblePhrases(lesson), phrase[field], field, want, phrase.ar);
    if (!wrong.length) return null;
    return {
      type: "quiz",
      points: 1,
      srcLesson: lesson,
      toEnglish: toEnglish,
      prompt: toEnglish ? phrase.ar : phrase.en,
      answer: phrase[field],
      phrase: phrase,
      options: shuffle(wrong.concat([phrase]).map(function (p) { return p[field]; }))
    };
  }

  // Self-graded on purpose: there is no honest way to score speech in a
  // browser, and the strength system catches a generous marker anyway,
  // because the same phrase comes back and eventually meets a quiz.
  function sayRound(lesson, phrase) {
    return { type: "say", points: 1, srcLesson: lesson, phrase: phrase, answer: phrase.ar, shown: false };
  }

  function writeRound(lesson, phrase) {
    return { type: "write", points: 1, srcLesson: lesson, phrase: phrase, answer: disp(phrase.ar), typed: "" };
  }

  // Writing down what you heard, with nothing on the screen to read. The
  // numbers drill does this for numbers; a whole phrase is the harder
  // and more useful version, because holding four words in your head
  // long enough to write them is most of listening.
  function dictateRound(lesson, phrase) {
    if (!spk(phrase.ar)) return null;
    return {
      type: "dictate", points: 1, srcLesson: lesson, phrase: phrase,
      answer: disp(phrase.ar), typed: "", played: false
    };
  }

  // One phrase, two spellings, and the question is only which is which.
  // It must not move the phrase's strength: knowing that a word has a
  // street form is not knowing the word.
  function swapRound(lesson, phrase) {
    var d = dialectOf(phrase.ar);
    if (!d || d[0] === phrase.ar) return null;
    var toStreet = Math.random() < 0.5;
    var pool = [];
    visiblePhrases(lesson).concat(reachable().map(function (it) { return it.phrase || it; }))
      .forEach(function (p) {
        if (!p || !p.ar || p.ar === phrase.ar) return;
        var od = dialectOf(p.ar);
        if (!od || od[0] === p.ar) return;
        var text = toStreet ? od[0] : p.ar;
        if (pool.indexOf(text) === -1) pool.push(text);
      });
    if (pool.length < 2) return null;
    var answer = toStreet ? d[0] : phrase.ar;
    var options = shuffle(pool).slice(0, 3).concat([answer]);
    return {
      type: "swap",
      points: 1,
      srcLesson: lesson,
      phrase: phrase,
      toStreet: toStreet,
      prompt: toStreet ? phrase.ar : d[0],
      answer: answer,
      noMemory: true,
      options: shuffle(options)
    };
  }

  function listenRound(lesson, phrase) {
    if (!SCRIPT[phrase.ar]) return null;
    var wrong = distractors(visiblePhrases(lesson), phrase.en, "en", optionsFor(lesson.id, phrase.ar), phrase.ar);
    if (!wrong.length) return null;
    return {
      type: "listen",
      points: 1,
      srcLesson: lesson,
      phrase: phrase,
      answer: phrase.en,
      options: shuffle(wrong.concat([phrase]).map(function (p) { return p.en; }))
    };
  }

  // A long phrase is learned from the tail. Say the last two words, then
  // the last three, then all of it: that way the end never crumbles,
  // which is exactly how long phrases crumble.
  function ladderFor(words) {
    if (words.length < 4) return null;
    var steps = [];
    var from = Math.max(1, words.length - 2);
    while (from > 0) { steps.push(words.slice(from)); from -= 1; }
    steps.push(words.slice(0));
    // at most three rungs, ending on the whole phrase
    if (steps.length > 3) steps = [steps[0], steps[Math.floor(steps.length / 2)], steps[steps.length - 1]];
    return steps;
  }

  function buildTiles(words, lesson, phrase) {
    var extras = [];
    shuffle(visiblePhrases(lesson)).forEach(function (p) {
      if (extras.length >= 2 || p === phrase) return;
      var cand = shuffle(tokens(disp(p.ar)))[0];
      if (!cand || words.indexOf(cand) !== -1 || extras.indexOf(cand) !== -1) return;
      extras.push(cand);
    });
    return shuffle(words.concat(extras)).map(function (w, i) { return { id: i, word: w }; });
  }

  function buildRound(lesson, phrase) {
    var words = tokens(disp(phrase.ar));
    var extras = [];
    shuffle(visiblePhrases(lesson)).forEach(function (p) {
      if (extras.length >= 2 || p === phrase) return;
      var cand = shuffle(tokens(disp(p.ar)))[0];
      if (!cand || words.indexOf(cand) !== -1 || extras.indexOf(cand) !== -1) return;
      extras.push(cand);
    });
    // Only for a phrase you have not got yet: once it is holding, the
    // whole thing at once is the point.
    var ladder = strengthOf(lesson.id, phrase.ar) === null ? ladderFor(words) : null;
    var target = ladder ? ladder[0] : words;
    return {
      type: "build",
      points: 1,
      srcLesson: lesson,
      phrase: phrase,
      ladder: ladder,
      rung: 0,
      target: target,
      tiles: buildTiles(target, lesson, phrase),
      picked: []
    };
  }

  // Every dialogue line you have reached, so the wrong answers are not
  // the other three lines of the exchange you are in.
  function dialoguePool() {
    var out = [];
    LESSONS.filter(unlocked).forEach(function (l) {
      (l.dialogue || []).forEach(function (d) { out.push(d); });
    });
    return out;
  }

  // Some questions have more than one true answer, either because two
  // phrases do the same job or because the course itself teaches two
  // replies to the same line. Both count.
  function repliesTo(ask, reply) {
    var out = [reply];
    LESSONS.forEach(function (l) {
      (l.dialogue || []).forEach(function (d) {
        if (d.ask === ask && out.indexOf(d.reply) === -1 && !isPassive(d.reply)) out.push(d.reply);
      });
    });
    return out;
  }

  function dialogRound(lesson, exchange) {
    if (isPassive(exchange.reply)) return null;
    var wide = dialoguePool();
    var want = Math.max(1, optionsFor(lesson.id, exchange.reply) - 1);
    var ok = repliesTo(exchange.ask, exchange.reply);
    var pool = (wide.length > 12 ? wide : lesson.dialogue).filter(function (d) {
      return ok.indexOf(d.reply) === -1;
    });
    var wrong = distractors(pool, exchange.reply, "reply", want, exchange.reply);
    if (!wrong.length) {
      wrong = distractors(lesson.dialogue.filter(function (d) {
        return ok.indexOf(d.reply) === -1;
      }), exchange.reply, "reply", want, exchange.reply);
    }
    if (!wrong.length) return null;
    return {
      type: "dialog",
      points: 1,
      srcLesson: lesson,
      exchange: exchange,
      answer: exchange.reply,
      answers: ok.length > 1 ? ok : null,
      options: shuffle(wrong.map(function (d) { return d.reply; }).concat(ok.length > 1 ? ok : [exchange.reply]))
    };
  }

  function matchRound(lesson) {
    var picks = shuffle(lesson.pool || visiblePhrases(lesson)).slice(0, MATCH_PAIRS);
    if (picks.length < 2) return null;
    return {
      type: "match",
      points: picks.length,
      pairs: picks,
      left: shuffle(picks.map(function (p, i) { return { i: i, text: disp(p.ar) }; })),
      right: shuffle(picks.map(function (p, i) { return { i: i, text: p.en }; })),
      done: [],
      picked: null,
      miss: null,
      missedOnce: {}
    };
  }

  // Whether a phrase can carry a given game at all, checked before
  // drawing so a single-game review never draws unusable material.
  function canMake(item, type) {
    var p = item.phrase || item;
    if (PRODUCING[type]) {
      var said = type === "dialog" ? (item.exchange && item.exchange.reply) : p.ar;
      if (!said || isPassive(said)) return false;
    }
    if (type === "dialog") return !!item.exchange;
    if (type === "build") {
      var n = tokens(disp(p.ar)).length;
      return n >= 2 && n <= 6;
    }
    if (type === "swap") {
      var d = dialectOf(p.ar);
      return !!d && d[0] !== p.ar;
    }
    if (type === "listen") return !!SCRIPT[p.ar];
    if (type === "dictate") return !!SCRIPT[p.ar] && tokens(disp(p.ar)).length >= 2;
    return true;
  }

  function makeRound(lesson, item, type) {
    if (!canMake(item, type)) return null;
    var p = item.phrase || item;
    // Five misses and still nothing: asking for it cold a sixth time is
    // not teaching. It comes with its pieces shown, and only ever to be
    // recognised, until it starts sticking.
    if (isLeech(lesson.id, p.ar)) {
      var stuck = quizRound(lesson, p);
      if (stuck) {
        stuck.isLeech = true;
        stuck.toEnglish = true;
        stuck.prompt = p.ar;
        stuck.answer = p.en;
        stuck.options = shuffle(distractors(visiblePhrases(lesson), p.en, "en", 3, p.ar)
          .concat([p]).map(function (x) { return x.en; }));
      }
      return stuck;
    }
    if (type === "dialog") return item.exchange ? dialogRound(lesson, item.exchange) : null;
    if (type === "build") return canMake(item, "build") ? buildRound(lesson, p) : null;
    if (type === "say") return sayRound(lesson, p);
    if (type === "write") return writeRound(lesson, p);
    if (type === "swap") return swapRound(lesson, p);
    if (type === "listen") return listenRound(lesson, p);
    if (type === "dictate") return dictateRound(lesson, p);
    return quizRound(lesson, p);
  }

  function roundsFor(lesson, types) {
    var want = types || ASKING;
    var rs = [];
    want.forEach(function (type) {
      if (type === "dialog") {
        (lesson.dialogue || []).forEach(function (d) {
          var r = dialogRound(lesson, d);
          if (r) rs.push(r);
        });
        return;
      }
      var source = type === "build" ? buildable(lesson) : visiblePhrases(lesson);
      source.forEach(function (p) {
        var r = makeRound(lesson, p, type);
        if (r) rs.push(r);
      });
    });
    return rs;
  }

  // Deal round-robin across the game types, so you never get five
  // quizzes in a row.
  // The order it is given is the order it deals in: the caller has
  // already decided which phrases come first, and shuffling here undid
  // that.
  function roundKey(r) {
    return r.phrase ? r.phrase.ar : (r.exchange ? r.exchange.reply : null);
  }

  function interleave(rounds, count) {
    var byType = {};
    ASKING.forEach(function (k) { byType[k] = []; });
    rounds.forEach(function (r) { if (byType[r.type]) byType[r.type].push(r); });

    // Each game deals in turn, and none of them deals a phrase another
    // has already asked about until every phrase has had a turn: six
    // lanes each starting from the top used to ask three questions
    // about one phrase and skip a third of the lesson.
    var out = [], used = {};
    function take(lane, fresh) {
      for (var j = 0; j < lane.length; j++) {
        var k = roundKey(lane[j]);
        if (fresh && k && used[k]) continue;
        return lane.splice(j, 1)[0];
      }
      return null;
    }
    var fresh = true;
    while (out.length < count) {
      var dealt = 0;
      for (var i = 0; i < ASKING.length && out.length < count; i++) {
        var r = take(byType[ASKING[i]], fresh);
        if (!r) continue;
        var key = roundKey(r);
        if (key) used[key] = true;
        out.push(r);
        dealt++;
      }
      if (!dealt) {
        if (!fresh) break;
        fresh = false;
      }
    }
    return out;
  }

  // A single game can run out of distinct material. Regenerating the
  // pool reshuffles quiz options and tile order, so a second pass is
  // fresh practice rather than the identical question again.
  // Deal every phrase in the lesson before dealing any of them a second
  // time: a ten-round session over fifteen phrases used to be able to
  // ask the same one three times and skip a third of the lesson.
  function spread(rounds) {
    var seen = {}, first = [], rest = [];
    rounds.forEach(function (r) {
      var k = r.phrase ? r.phrase.ar : (r.exchange ? r.exchange.reply : null);
      if (!k) { first.push(r); return; }
      if (seen[k]) { rest.push(r); return; }
      seen[k] = true;
      first.push(r);
    });
    return first.concat(rest);
  }

  function fillRounds(lesson, types, count) {
    var out = interleave(spread(shuffle(roundsFor(lesson, types))), count);
    var guard = 0;
    while (out.length < count && guard++ < 12) {
      var more = interleave(shuffle(roundsFor(lesson, types)), count - out.length);
      if (!more.length) break;
      out = out.concat(more);
    }
    return out.slice(0, count);
  }

  // A phrase met for the first time comes back twice more in the same
  // session, two rounds later and then five: the distance is what turns
  // recognising it into remembering it. The repeats do not climb the
  // strength - one sitting is one piece of evidence - they are there for
  // the retrieval.
  var ECHO_AT = [2, 5];

  function echoNew(tasks, lessonFor) {
    var out = tasks.slice();
    var added = 0;
    tasks.forEach(function (t) {
      if (added >= 2 || !t.phrase) return;
      var l = t.srcLesson || lessonFor;
      if (!l || strengthOf(l.id, t.phrase.ar) !== null) return;
      var at = out.indexOf(t);
      if (at < 0) return;
      // In whatever games are switched on, not always the quiz: a
      // say-only session has to stay a say-only session.
      var types = askingGames();
      if (!types.length) types = [t.type];
      ECHO_AT.forEach(function (gap) {
        var item = { phrase: t.phrase, ar: t.phrase.ar, en: t.phrase.en };
        var copy = null;
        typeFor(item, types).forEach(function (ty) {
          if (!copy) copy = makeRound(l, item, ty);
        });
        if (!copy) return;
        copy.points = 0;
        copy.isEcho = true;
        var pos = Math.min(out.length, at + gap);
        out.splice(pos, 0, copy);
      });
      added++;
    });
    return out;
  }

  // What a session did to you, measured rather than asserted: the
  // strength of everything it is about to ask, taken before it asks.
  function taskKeys(t, lesson) {
    var out = [];
    function add(l, ar) { if (l && ar) out.push(phraseKey(l.id, ar)); }
    if (t.type === "match") {
      (t.pairs || []).forEach(function (p) { add(p._lesson || t.srcLesson || lesson, p.ar); });
      return out;
    }
    var ph = t.phrase || (t.exchange ? { ar: t.exchange.reply } : t.turn ? { ar: t.turn.reply } : null);
    if (!ph) return out;
    add((t.phrase && t.phrase._lesson) || t.srcLesson || lesson, ph.ar);
    return out;
  }

  function snapshotOf(tasks, lesson) {
    var before = {};
    tasks.forEach(function (t) {
      taskKeys(t, lesson).forEach(function (k) {
        if (k in before) return;
        var cut = k.indexOf("|");
        before[k] = strengthOf(k.slice(0, cut), k.slice(cut + 1));
      });
    });
    return before;
  }

  function newSession(fields) {
    var all = fields.tasks;
    return {
      before: snapshotOf(all, fields.lesson || null),
      lesson: fields.lesson || null,
      isReview: !!fields.isReview,
      isDrill: fields.isDrill || null,
      isConvo: !!fields.isConvo,
      isFollow: !!fields.isFollow,
      isFixup: !!fields.isFixup,
      isToday: !!fields.isToday,
      isBack: !!fields.isBack,
      isOne: !!fields.isOne,
      isTest: !!fields.isTest,
      isTestOut: !!fields.isTestOut,
      only: fields.only || null,
      aimed: fields.aimed || null,
      word: fields.word || null,
      extended: false,
      grew: false,
      convo: fields.convo || null,
      reviewPool: fields.reviewPool || 0,
      todayNext: fields.todayNext || null,
      tasks: all,
      i: 0,
      startedAt: Date.now(),
      earned: 0,
      max: all.reduce(function (s, t) { return s + t.points; }, 0),
      missed: [],
      retried: false,
      state: "asking",
      lastRight: false
    };
  }

  function matchCount(asking) {
    return games().match ? (asking.length ? 1 : 3) : 0;
  }

  function buildSession(lesson) {
    var asking = askingGames();
    var tasks = [];
    var echoIn = lesson;
    for (var i = 0; i < matchCount(asking); i++) {
      var grid = matchRound(lesson);
      if (grid) tasks.push(grid);
    }
    if (asking.length) tasks = tasks.concat(fillRounds(lesson, asking, ROUNDS));
    if (!tasks.length) tasks = fillRounds(lesson, ["quiz"], ROUNDS);
    tasks = echoNew(tasks, echoIn);
    return newSession({ lesson: lesson, tasks: tasks });
  }

  // A pair is only fair to match if nothing else in the grid shares
