    var task = typeof barPct === "number";
    return '<div class="topbar' + (task ? " is-task" : "") + '">' +
      '<button class="icon-btn" data-act="back" aria-label="Back">&larr;</button>' +
      '<button class="icon-btn" data-act="nav-open" aria-label="Open the menu">&#9776;</button>' +
      '<h1 class="topbar-title">' + esc(title) + "</h1>" +
      (counter ? '<span class="counter">' + esc(counter) + "</span>" : "") +
      "</div>" +
      (task ? '<div class="bar"><i style="width:' + barPct + '%"></i></div>' : "") +
      (task ? "" : '<div class="large-title" aria-hidden="true">' + esc(title) + "</div>");
  }

  // Sitting through thirteen flashcards for a lesson you already know is
  // the fastest way to stop using an app. Ten of its phrases, cold, no
  // cards, no options where it can be typed: nine right and it is passed.
  var TESTOUT_PASS = 90;

  function buildTestOut(lesson) {
    var pool = visiblePhrases(lesson);
    if (pool.length < 6) return null;
    var picked = shuffle(pool).slice(0, Math.min(10, pool.length));
    var tasks = [];
    picked.forEach(function (p) {
      var item = { ar: p.ar, en: p.en, core: !!p.core, phrase: p, lesson: lesson };
      var r = canMake(item, "write") ? writeRound(lesson, p) : quizRound(lesson, p);
      if (!r) return;
      r.isTestOut = true;
      r.isLeech = false;
      tasks.push(r);
    });
    if (tasks.length < 5) return null;
    return newSession({ lesson: lesson, isTestOut: true, tasks: tasks });
  }

  function skipLesson(lesson, off) {
    if (!store.hidden) store.hidden = {};
    lesson.phrases.forEach(function (p) {
      var k = phraseKey(lesson.id, p.ar);
      if (off) delete store.hidden[k];
      else store.hidden[k] = true;
    });
    save();
  }

  function lessonSkipped(lesson) {
    return lesson.phrases.every(function (p) { return isHidden(lesson.id, p.ar); });
  }

  function lessonHTML(lesson) {
    var r = recordOf(lesson.id);
    var coreN = lesson.phrases.filter(function (p) { return p.core; }).length;
    return topbarHTML(lesson.title) +
      '<div class="card" style="padding:26px 24px;margin-top:8px">' +
      '<div class="eyebrow">Lesson ' + lessonNo(lesson) + "</div>" +
      '<h2 style="font-size:26px;letter-spacing:-.02em;margin:8px 0">' + esc(lesson.title) + "</h2>" +
      '<p style="margin:0;color:var(--ink-2);font-size:15px">' + esc(lesson.intro) + "</p>" +
      '<p class="mono" style="margin:16px 0 0;color:var(--ink-3);font-size:13.5px">' +
      lesson.phrases.length + " phrases" + (coreN ? " &#183; " + coreN + " core" : "") +
      " &#183; " + (r ? "best " + r.best + "%" : "not played yet") + "</p>" +
      "</div>" +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost" data-go="learn" data-id="' + lesson.id + '">Study the phrases</button>' +
      '<button class="btn" data-go="play" data-id="' + lesson.id + '">Play</button>' +
      "</div>" +
      // Two ways past a lesson: you already know it, or you never will.
      '<div class="lesson-past">' +
      (r && r.done ? "" :
        '<button class="link-btn" data-act="testout" data-id="' + lesson.id + '">' +
        "I already know this one - test me out of it</button>") +
      '<button class="link-btn" data-act="skip-lesson" data-id="' + lesson.id + '">' +
      (lessonSkipped(lesson) ? "Put this lesson back" : "I will never need this lesson") + "</button>" +
      (lessonSkipped(lesson)
        ? '<p class="aside-note">Every phrase in it is hidden. Nothing here comes up anywhere.</p>'
        : "") + "</div>" +
      // Three hundred pixels of settings used to sit between the card and
      // the button, on the one screen whose whole job is that button.
      '<details class="guide fold" data-fold="lessonset"' + foldAttr("lessonset") +
      '><summary>Which Arabic, and which games<span class="fold-count">' +
      esc(varietyInfo().label) + "</span></summary>" +
      '<div class="fold-body">' + varietyHTML(true) +
      pickerHTML("choose what this lesson drills") + "</div></details>";
  }

  function glossHTML(ar) {
    var parts = glossesFor(disp(ar));
    if (!parts.length) return "";
    return '<div class="gloss">' + parts.map(function (g) {
      return '<span class="gloss-row"><span class="ar">' + esc(g.word) + "</span>" +
        '<span class="gloss-eq">=</span><span class="gloss-en">' + esc(g.gloss) + "</span></span>";
    }).join("") + "</div>";
  }

  // Reading the answer teaches less than getting it wrong first. The
  // card asks for a guess before it will show anything, and it does not
  // mark the guess: what it is for is the moment of trying, and then
  // seeing how close you were.
  // A phrase that does the same job as one you have already met is
  // introduced next to it, with the difference named. Confusions are
  // cheaper to prevent at the first meeting than to unpick later.
  // Most phrases carry no risk at all and get no label. The ones that
  // do get one because there is something to say, not because a scheme
  // demanded a value for every row.
  var HOW = {
    safe: { label: "Safe with anyone",
      why: "Works with a stranger, a colleague or a shopkeeper. Nothing in it commits you." },
    direct: { label: "This one commits you",
      why: "Not rude and not wrong, but it will be read as interest, a claim or an intrusion. Say it when you mean it." }
  };

  function howOf(ar) {
    var out = null;
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) { if (!out && p.ar === ar && p.how) out = p.how; });
    });
    return out;
  }

  function howTag(ar) {
    var k = howOf(ar);
    if (!k || !HOW[k]) return "";
    return '<span class="pill pill--tag how-tag is-' + k + '">' + esc(HOW[k].label) + "</span>";
  }

  function howNote(ar) {
    var k = howOf(ar);
    if (!k || !HOW[k]) return "";
    return '<div class="flash-note"><span><b>' + esc(HOW[k].label) + ".</b> " +
      esc(HOW[k].why) + "</span></div>";
  }

  function twinGroupOf(ar) {
    var group = null;
    TWINS.forEach(function (t) { if (!group && t.members.indexOf(ar) !== -1) group = t; });
    return group;
  }

  // The choice between two ways of saying one thing belongs in the round
  // where the second way just came up, not on a screen you have to
  // remember to visit. It recommends; it does not decide.
  function twinPickHTML(t) {
    if (!session.lastRight || session.twinAsked) return "";
    var ph = t.phrase || (t.exchange ? { ar: t.exchange.reply } : t.turn ? { ar: t.turn.reply } : null);
    if (!ph || !ph.ar) return "";
    var g = twinGroupOf(ph.ar);
    if (!g) return "";
    var reached = twinReached(g).filter(function (ar) {
      var lid = lessonTeaching(ar);
      return lid && !isHidden(lid, ar);
    });
    var live = reached.filter(function (ar) { return !isPassive(ar); });
    if (live.length < 2) return "";
    var pick = live.indexOf(g.keep) !== -1 ? g.keep : live[0];
    return '<div class="twin-inline"><p class="twin-inline-head">' +
      "You have " + live.length + " ways to say this. Keeping one and putting the rest on " +
      "recognise only is less to carry.</p>" +
      '<div class="twin-inline-row">' + live.map(function (ar) {
        return '<button class="pill pill--md chip' + (ar === pick ? " is-on" : "") +
          '" data-act="twin-keep" data-id="' + esc(g.id) + '" data-value="' + esc(ar) + '">' +
          '<span class="ar">' + esc(disp(ar)) + "</span>" +
          (ar === pick ? " &#183; said most" : "") + "</button>";
      }).join("") +
      '<button class="link-btn" data-act="twin-later">Not now</button></div></div>';
  }

  function twinNote(ar) {
    var group = null;
    TWINS.forEach(function (t) { if (!group && t.members.indexOf(ar) !== -1) group = t; });
    if (!group) return "";
    var met = null;
    group.members.forEach(function (other) {
      if (met || other === ar) return;
      var lid = lessonTeaching(other);
      if (lid && strengthOf(lid, other) !== null) met = other;
    });
    if (!met) return "";
    var pick = group.keep;
    return '<div class="flash-note"><span>Not the same as <b class="ar">' + esc(disp(met)) +
      "</b>, which is <b>" + esc(englishFor(met) || "") + "</b>. " + esc(group.why) +
      (pick
        ? " Of these, <b class=\"ar\">" + esc(disp(pick)) + "</b> is the one said most" +
          (pick === ar ? ", and it is this one." : "; you can put the others on recognise only.")
        : "") + "</span>" + sayBtn(met, true) + "</div>";
  }

  // Walking back through the pile used to hand you every card again as
  // if you had never seen it, guess and all. What you did on a card
  // belongs to the card.
  // Who a phrase is aimed at lives in its last syllable, and that is
  // exactly the syllable a beginner drops. If the phrase carries one,
  // say what it is while the phrase is on the screen.
  function endingHint(shown, hasOther) {
    var w = String(shown || "").toLowerCase().replace(/[?!.,;:]/g, "").split(/\s+/);
    var last = w[w.length - 1] || "";
    var out = null;
    if (/(ik|ki)$/.test(last)) out = "woman";
    else if (/(ak|uk|ka)$/.test(last)) out = "man";
    // A phrase about you does not change with who is listening, and
    // knowing that is worth as much as knowing when it does.
    if (!out && !hasOther) {
      var mine = /[bcdfghjklmnpqrstvwxyzʿ][ìi]$/.test(last) || w.indexOf("ana") !== -1 || w.indexOf("anà") !== -1;
      if (mine) {
        return '<div class="flash-ending">Nothing here changes with who you are speaking to: ' +
          "this one is about <b>you</b>. The endings that do change are <b>-ak</b> and <b>-ik</b>.</div>";
      }
    }
    // A verb said to a woman takes its own ending, and it is a different
    // rule from the one above.
    var verbFem = w.some(function (x) { return /(ìn|ìna)$/.test(x) && x.length > 4; });
    if (!out && !verbFem) return "";
    return '<div class="flash-ending">' +
      (out === "woman"
        ? "That <b>-ik</b> on the end is <i>you</i>, said to a woman. To a man it is <b>-ak</b>, and in fus&#183;ha <b>-uki</b> and <b>-uka</b>."
        : out === "man"
          ? "That <b>-ak</b> on the end is <i>you</i>, said to a man. To a woman it is <b>-ik</b>, and in fus&#183;ha <b>-uka</b> and <b>-uki</b>."
          : "The <b>-ìn</b> on the verb is what makes it addressed to a woman. To a man the verb ends there.") +
      "</div>";
  }

  function keepCard() {
    if (!learn) return;
    if (!learn.at) learn.at = {};
    if (!learn.shown && !learn.guessed) return;
    learn.at[learn.i] = {
      shown: !!learn.shown,
      guessed: learn.guessed || null,
      guessOpts: learn.guessOpts || null
    };
  }

  function restoreCard() {
    var was = (learn.at || {})[learn.i];
    learn.shown = !!(was && was.shown);
    learn.guessed = (was && was.guessed) || null;
    learn.guessOpts = (was && was.guessOpts) || null;
  }

  // How much of the pile you have actually looked at, and how much you
  // have walked past. Skipping is allowed; pretending you did not is
  // what the count is for.
  function cardsDone() {
    var at = learn.at || {};
    var guessed = 0, shown = 0;
    Object.keys(at).forEach(function (k) {
      if (at[k].guessed) guessed++;
      else if (at[k].shown) shown++;
    });
    // the card you are on counts as soon as you do something with it
    if (learn.guessed && !at[learn.i]) guessed++;
    else if (learn.shown && !at[learn.i]) shown++;
    return { guessed: guessed, shown: shown, total: learn.lesson.phrases.length };
  }

  function cardsLine() {
    var c = cardsDone();
    var left = c.total - c.guessed - c.shown;
    if (!c.guessed && !c.shown) return "";
    return '<p class="learn-count">' +
      (c.guessed ? c.guessed + " guessed" : "") +
      (c.guessed && c.shown ? " &#183; " : "") +
      (c.shown ? c.shown + " just read" : "") +
      (left ? " &#183; " + left + " not looked at yet" : " &#183; that is all of them") +
      "</p>";
  }

  function guessHTML(p) {
    var pool = learn.lesson.phrases.filter(function (x) { return x !== p; });
    if (pool.length < 2) return '<div class="flash-hint">Tap to see what it means</div>';
    if (!learn.guessOpts) {
      learn.guessOpts = shuffle(shuffle(pool).slice(0, 2).concat([p]))
        .map(function (x) { return x.en; });
    }
    return '<div class="flash-hint">Before you look: what do you think it means?</div>' +
      '<div class="options guess">' + learn.guessOpts.map(function (en, i) {
        return '<button class="option" data-act="learn-guess" data-value="' + esc(en) + '">' +
          '<span class="option-key">' + (i + 1) + "</span><span>" + esc(en) + "</span></button>";
      }).join("") + "</div>";
  }

  function guessBackHTML(p) {
    if (learn.guessed === p.en) {
      return '<div class="guess-back ok">You guessed that. Good instinct.</div>';
    }
    return '<div class="guess-back">You guessed <b>' + esc(learn.guessed) + "</b>.</div>";
  }

  function learnHTML() {
    var l = learn.lesson;
    var p = l.phrases[learn.i];
    var pct = Math.round((learn.i + 1) / l.phrases.length * 100);
    var last = learn.i + 1 === l.phrases.length;

    var note = "";
    if (p.note) note += '<div class="flash-note"><span>' + p.note + "</span></div>";
    note += howNote(p.ar);
    note += twinNote(p.ar);
    var rit = ritualFor(p.ar);
    if (rit) {
      note += '<div class="flash-note"><span><b>This one expects an answer.</b> They will say ' +
        '<b class="ar">' + esc(disp(rit.back)) + "</b> - or you will, if they say this to you.</span>" +
        sayBtn(rit.back, true) + "</div>";
    }
    note += historyOf(l.id, p.ar);
    note += myNoteHTML(p.ar);

    var known = !!knownRec(l.id, p.ar);
    var hidden = isHidden(l.id, p.ar);
    var only = isPassive(p.ar);
    var aside = '<div class="aside-row"><div class="aside-pair">' +
      (hidden ? "" :
        '<button class="pill pill--md aside' + (known ? " is-on" : "") + '" data-act="known" data-id="' + esc(p.ar) + '"' +
        ' aria-pressed="' + (known ? "true" : "false") + '">' +
        '<span class="tick" aria-hidden="true"></span>' +
        (known ? "Set aside" : "I know this one") + "</button>") +
      (hidden ? "" :
        '<button class="pill pill--md aside' + (only ? " is-on" : "") + '" data-act="passive" data-id="' + esc(p.ar) + '"' +
        ' aria-pressed="' + (only ? "true" : "false") + '">' +
        '<span class="tick" aria-hidden="true"></span>' +
        (only ? "Recognise only" : "I will not say this one") + "</button>") +
      '<button class="pill pill--md aside aside-hide' + (hidden ? " is-off" : "") + '" data-act="hide" data-id="' + esc(p.ar) + '"' +
      ' aria-pressed="' + (hidden ? "true" : "false") + '">' +
      (hidden ? "Hidden" : "Not for me") + "</button>" +
      "</div>" +
      (hidden
        ? '<span class="aside-note">Hidden for good. It will not come up anywhere.</span>'
        : only ? '<span class="aside-note">You are asked to understand this one, never to produce it.</span>'
        : known ? '<span class="aside-note">Out of rotation. It will come back once for a check.</span>' : "") +
      asideKey() +
      "</div>";

    return topbarHTML(l.title + " &#183; study", pct, (learn.i + 1) + " / " + l.phrases.length) +
      '<div class="card flashcard fade-in" tabindex="-1">' +
      (p.core || p.how
        ? '<div class="flash-tags">' +
          (p.core ? '<span class="pill pill--tag core-tag">Core phrase</span>' : "") +
          howTag(p.ar) + "</div>"
        : "") +
      '<div class="say-row"><div class="flash-ar ar">' + esc(disp(p.ar)) + "</div>" + sayBtn(p.ar) + "</div>" +
      (p.f
        ? '<div class="flash-alt">' + esc(p.fLabel || "Speaking to a woman") + ': <span class="ar">' +
          esc(disp(p.f)) + "</span>" + sayBtn(p.f, true) + "</div>"
        : "") +
      endingHint(disp(p.ar), !!p.f) +
      // Silence here was making fus-ha look like the dialect you chose.
      (variety() === "msa" ? ""
        : isDialectForm(p.ar)
          ? '<div class="in-variety">' + esc(varietyInfo().label) +
            ' &#183; fusha: <span class="ar">' + esc(p.ar) + "</span>" +
            '<button class="say say-sm" data-act="say" data-say="' + esc(p.ar) + '" data-book="1"' +
            (canSpeak() ? "" : " disabled") + ' aria-label="Hear the fus&#183;ha">' + SPEAKER_SVG +
            "</button></div>"
          : sameInDialect(p.ar)
            ? '<div class="in-variety">the same in ' + esc(varietyInfo().label) + "</div>"
            : '<div class="in-variety">fus&#183;ha &#183; no ' + esc(varietyInfo().label) +
              " form written for this one yet</div>") +
      (learn.shown
        ? '<div class="flash-rule"></div><div class="flash-en">' + esc(p.en) + "</div>" +
          (learn.guessed ? guessBackHTML(p) : "") +
          glossHTML(p.ar) + note + aside
        : guessHTML(p)) +
      "</div>" +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost btn-step" data-act="learn-prev"' +
      (learn.i === 0 ? " disabled" : "") + ' aria-label="Previous phrase">&larr;</button>' +
      '<button class="btn" data-act="' + (learn.shown ? "learn-next" : "learn-reveal") + '">' +
      (learn.shown ? (last ? "Finish and play" : "Next phrase") : "Show meaning") + "</button>" +
      '<button class="btn btn-ghost btn-step" data-act="learn-fwd"' +
      (last ? " disabled" : "") + ' aria-label="Next phrase, without revealing">&rarr;</button>' +
      "</div>" +
      // Reading the cards is not learning them. This is the way out of
      // the pile at any point, not only at the last card.
      cardsLine() +
      '<div class="learn-jump"><button class="link-btn" data-go="play" data-id="' + l.id +
      '">Enough reading, play lesson ' + lessonNo(l) + "</button></div>";
  }

  /* ============================================================
     PLAY
     ============================================================ */

  function roundNote(t) {
    if (t.isBack) return "One of the ones worth having back first";
    if (t.isEcho) return "The same one again, on purpose";
    if (t.isCheck) return "A phrase you set aside, coming back for its check";
    if (t.isMiss) return "You missed this one recently";
    if (t.isLeech) return "This one keeps slipping, so here it is in pieces";
    return "";
  }

  // Above strength 3 the round is timed, softly: nothing fails on the
  // clock, but an answer that took longer than the bar does not climb.
  // Knowing a phrase and having it ready are different things, and only
  // the second one is any use in a conversation.
  var QUICK_MS = 3500;

  function isQuick(t) {
    if (session && session.isTest) return false;
    if (!t || !t.phrase || t.isLeech || t.isRetry) return false;
    if (!t.options || t.type === "match") return false;
    var l = lessonOf(t, t.phrase);
    if (!l) return false;
    var s = strengthOf(l.id, t.phrase.ar);
    return s !== null && s >= 4;
  }

  function tookTooLong(t) {
    return !!(t.startedAt && Date.now() - t.startedAt > QUICK_MS);
  }

  function roundBodyHTML(t) {
    return t.type === "match" ? matchHTML(t) :
      t.type === "quiz" ? quizHTML(t) :
      t.type === "build" ? buildHTML(t) :
      t.type === "say" ? sayHTML(t) :
      t.type === "write" ? writeHTML(t) :
      t.type === "swap" ? swapHTML(t) :
      t.type === "listen" ? listenHTML(t) :
      t.type === "dictate" ? dictateHTML(t) :
      t.type === "follow" ? followHTML(t) :
      t.type === "convoturn" ? convoTurnHTML(t) : dialogHTML(t);
  }

  // No counter, no progress bar, no score: three things whose only job
  // is to tell you how much is left, on a screen where the answer is
  // none.
  function oneHTML() {
    if (!session || !session.isOne) {
      return topbarHTML("One phrase") +
        '<p class="pb-lead">Pass a lesson first: there is nothing to ask you yet.</p>' +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }
    var t = session.tasks[session.i];
    var quick1 = isQuick(t) && session.state === "asking";
    if (quick1 && !t.startedAt) t.startedAt = Date.now();
    return topbarHTML("One phrase") +
      (quick1 ? '<div class="quickbar"><i></i></div>' : "") +
      '<div class="fade-in">' + roundBodyHTML(t) + "</div>" + verdictHTML(t) +
      (session.state === "asking"
        ? '<p class="one-note">One question, and it counts like any other. Leave whenever you like.</p>'
        : "");
  }

  function playHTML() {
    var t = session.tasks[session.i];
    var pct = Math.round(session.i / session.tasks.length * 100);
    var body = roundBodyHTML(t);
    var title = session.word ? "The word " + session.word
      : session.aimed ? "Ready for: " + session.aimed.can
      : session.isTest ? "The test"
      : session.isToday ? "Today"
      : session.isFixup ? "Fixing what you missed"
      : session.isFollow ? session.convo.title + " \u00b7 listening"
      : session.isDrill ? (gameByKey(session.isDrill) || {}).label + " only"
      : session.isReview ? "Mixed review"
      : session.isConvo ? session.convo.title
      : session.lesson.title;
    var note = roundNote(t);
    if (session.grew && session.state === "asking") {
      session.grew = false;
      session.grewShown = true;
    }
    var quick = isQuick(t) && session.state === "asking";
    if (quick && !t.startedAt) t.startedAt = Date.now();
    return topbarHTML(title, pct, (session.i + 1) + " / " + session.tasks.length) +
      (quick ? '<div class="quickbar"><i></i></div>' : "") +
      (session.grewShown && session.i >= session.tasks.length - EXTRA_ROUNDS
        ? '<p class="round-why">Going well, so a few more.</p>'
        : note ? '<p class="round-why">' + esc(note) + "</p>" : "") +
      '<div class="fade-in">' + body + "</div>" + verdictHTML(t);
  }

  function dunnoHTML() {
    if (session.state === "checked") return "";
    return '<div class="dunno-row"><button class="link-btn" data-act="dunno">' +
      "I do not know this one - show me</button></div>";
  }

  function optionsHTML(list, arabic, t) {
    var checked = session.state === "checked";
    return '<div class="options">' + list.map(function (opt, i) {
      var cls = "option" + (arabic ? " ar" : "");
      var state = "";
      var struck = !checked && t.tried === opt;
      if (checked) {
        if (opt === t.answer) { cls += " is-right"; state = "Correct answer"; }
        else if (opt === t.chosen) { cls += " is-wrong"; state = "Your answer, incorrect"; }
        else cls += " is-dim";
      } else if (struck) {
        cls += " is-struck";
        state = "Ruled out";
      }
      return '<button class="' + cls + '" data-act="answer" data-value="' + esc(opt) + '"' +
        (checked || struck ? " disabled" : "") + ">" +
        '<span class="option-key">' + (i + 1) + "</span><span>" +
        esc(arabic ? disp(opt) : opt) + "</span>" +
        (state ? '<span class="sr-only">, ' + state + "</span>" : "") + "</button>";
    }).join("") + "</div>" + dunnoHTML();
  }

  // A stuck phrase is shown in pieces rather than asked for cold. A
  // one-word phrase has no pieces, so it gets whatever the course knows
  // about it instead: the rule it was taught with, or its own meaning.
  // A phrase that keeps going while you are studying a dialect has a
  // second thing to hold on to: the fus-ha it came from, which is often
  // the version a beginner half recognises already.
  function anchorHTML(t) {
    if (variety() === "msa" || !t.phrase) return "";
    var lsn = lessonOf(t, t.phrase);
    if (!lsn) return "";
    var ar = t.phrase.ar;
    if (!isDialectForm(ar)) return "";
    var st = strengthOf(lsn.id, ar);
    var stuck = missCount(lsn.id, ar) >= 2 || (st !== null && st <= 1);
    if (!stuck) return "";
    return '<div class="anchor"><span class="anchor-head">Hard one. In fus&#183;ha it is</span>' +
      '<span class="ar">' + esc(ar) + "</span>" +
      '<button class="say say-sm" data-act="say" data-say="' + esc(ar) + '" data-book="1"' +
      (canSpeak() ? "" : " disabled") + ' aria-label="Hear the fus&#183;ha">' + SPEAKER_SVG + "</button>" +
      '<span class="anchor-why">The street form came out of that one. Hearing both is usually ' +
      "enough to make the street one stick.</span></div>";
  }

  function leechAid(t) {
    if (!t.isLeech || !t.phrase) return "";
    var g = glossHTML(t.phrase.ar);
    if (g) return '<div class="why">' + g + "</div>";
    var n = noteFor(t.phrase.ar);
    if (n) return '<div class="why">' + n + "</div>";
    var one = glossFor(disp(t.phrase.ar));
    return one
      ? '<div class="why"><div class="gloss"><span class="gloss-row">' +
        '<span class="ar">' + esc(disp(t.phrase.ar)) + '</span><span class="gloss-eq">=</span>' +
        '<span class="gloss-en">' + esc(one) + "</span></span></div></div>"
      : "";
  }

  // Reading is the crutch that stops you listening. With this on, any
  // round that can be heard is heard, and the words are one tap away
  // rather than in front of you.
  function earOnly() {
    return !!store.earOnly && canSpeak();
  }

  function quizHTML(t) {
    var hear = t.toEnglish ? sayBtn(t.prompt, true) : "";
    if (t.toEnglish && earOnly() && !session.isTest && !!spk(t.prompt) &&
      session.state !== "checked" && !t.peeked) {
      return '<div class="prompt">' +
        '<div class="prompt-label">What does this mean?</div>' +
        '<div class="listen-stage">' +
        '<button class="say say-lg" data-act="say" data-say="' + esc(t.prompt) + '"' +
        ' aria-label="Play it again">' + SPEAKER_SVG + "</button></div>" +
        '<div class="prompt-sub"><button class="peek" data-act="peek">Show me the words</button></div>' +
        "</div>" + leechAid(t) + optionsHTML(t.options, !t.toEnglish, t);
    }
    return '<div class="prompt">' +
      '<div class="prompt-label">' + (t.toEnglish ? "What does this mean?" : "How do you say this?") + "</div>" +
      '<div class="say-row"><div class="prompt-main' + (t.toEnglish ? " ar" : "") + '">' +
      esc(t.toEnglish ? disp(t.prompt) : t.prompt) + "</div>" + hear + "</div></div>" +
      leechAid(t) + optionsHTML(t.options, !t.toEnglish, t);
  }

  function dialogHTML(t) {
    var open = session.state === "checked" || t.peeked;
    // With a voice, it is said to you and not shown: reading the line
    // and picking from three you have seen before is not listening.
    var byEar = canSpeak() && !!spk(t.exchange.ask);
    var said = byEar && !open
      ? '<div class="listen-stage"><button class="say say-lg" data-act="say" data-say="' +
        esc(t.exchange.ask) + '" aria-label="Hear it again">' + SPEAKER_SVG + "</button></div>"
      : '<div class="say-row"><div class="prompt-main ar">' + esc(disp(t.exchange.ask)) + "</div>" +
        sayBtn(t.exchange.ask, true) + "</div>";

    return '<div class="prompt">' +
      '<div class="prompt-label">Someone says to you</div>' + said +
      '<div class="prompt-sub">' +
      (open
        ? esc(t.exchange.askEn)
        : '<button class="peek" data-act="peek">' +
          (byEar ? "Show me the words" : "What does that mean?") + "</button>") + "</div>" +
      '<div class="prompt-label" style="margin-top:22px">How do you reply?</div>' +
      "</div>" + optionsHTML(t.options, true, t);
  }

  function sayHTML(t) {
    var checked = session.state === "checked";
    if (!t.shown && !checked) {
      return '<div class="prompt">' +
        '<div class="prompt-label">Say it out loud</div>' +
        '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" +
        '<div class="prompt-sub">out loud, then check yourself</div>' +
        (canHear() ? '<div class="mic-row">' + micBtn("Say it into the mic", ears.busy) + "</div>" : micNote()) +
        "</div>" +
        heardHTML(t, t.phrase.ar,
          t.heard && t.heard.text ? { act: "say-confirm", label: "Yes, that is what I said" } : null) +
        '<div class="btn-row"><button class="btn btn-wide" data-act="say-reveal">Reveal</button></div>';
    }
    return '<div class="prompt">' +
      '<div class="prompt-label">You were going for</div>' +
      '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" +
      '<div class="say-row" style="margin-top:18px">' +
      '<div class="prompt-main ar">' + esc(disp(t.phrase.ar)) + "</div>" + sayBtn(t.phrase.ar) + "</div>" +
      "</div>" +
      heardHTML(t, t.phrase.ar) +
      tapeHTML(t.phrase.ar) +
      (checked ? "" :
        '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-act="say-grade" data-value="missed">Missed it</button>' +
        '<button class="btn" data-act="say-grade" data-value="got">Got it</button>' +
        "</div>");
  }

  function swapHTML(t) {
    var v = varietyInfo();
    return '<div class="prompt">' +
      '<div class="prompt-label">' + (t.toStreet
        ? "On television they say"
        : "In the street they say") + "</div>" +
      '<div class="say-row"><div class="prompt-main ar">' + esc(t.prompt) + "</div>" +
      '<button class="say" data-act="say" data-say="' + esc(t.phrase.ar) + '"' +
      (t.toStreet ? ' data-book="1"' : "") + (canSpeak() ? "" : " disabled") +
      ' aria-label="Hear it">' + SPEAKER_SVG + "</button></div>" +
      '<div class="prompt-sub">' + esc(t.phrase.en) + "</div>" +
      '<div class="prompt-label" style="margin-top:22px">' + (t.toStreet
        ? "How would you hear it in " + esc(v.label) + "?"
        : "And in fus&#183;ha?") + "</div>" +
      "</div>" + optionsHTML(t.options, true, t);
  }

  function writeHTML(t) {
    var checked = session.state === "checked";
    var cls = "type-in" + (checked ? (session.lastRight ? " is-right" : " is-wrong") : "");
    return '<div class="prompt">' +
      '<div class="prompt-label">Type it from memory</div>' +
      '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" +
      '<div class="prompt-sub">in these letters, not Arabic script &#183; accents and capitals do not matter</div>' +
      "</div>" +
      '<input class="' + cls + '" data-act="typing" type="text" value="' + esc(t.typed) + '"' +
      ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
      ' aria-label="Type the Arabic phrase"' + (checked ? " disabled" : "") + ">" +
      (checked ? "" :
        '<div class="action-row"><button class="btn btn-wide" data-act="check-write">Check</button></div>');
  }

  function dictateHTML(t) {
    var checked = session.state === "checked";
    var cls = "type-in" + (checked ? (session.lastRight ? " is-right" : " is-wrong") : "");
    return '<div class="prompt">' +
      '<div class="prompt-label">Write down what you hear</div>' +
      '<div class="listen-stage">' +
      '<button class="say say-lg" data-act="say" data-say="' + esc(t.phrase.ar) + '"' +
      ' aria-label="Play it again">' + SPEAKER_SVG + "</button></div>" +
      '<div class="prompt-sub">' +
      (checked ? '<span class="ar">' + esc(disp(t.phrase.ar)) + "</span>" : "tap to hear it again") +
      "</div></div>" +
      '<input class="' + cls + '" data-act="typing" type="text" value="' + esc(t.typed) + '"' +
      ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
      ' aria-label="Type what you heard"' + (checked ? " disabled" : "") + ">" +
      (checked ? "" :
        '<div class="action-row"><button class="btn btn-wide" data-act="check-write">Check</button></div>');
  }

  function listenHTML(t) {
    var checked = session.state === "checked";
    return '<div class="prompt">' +
      '<div class="prompt-label">Listen, then choose the meaning</div>' +
      '<div class="listen-stage">' +
      '<button class="say say-lg" data-act="say" data-say="' + esc(t.phrase.ar) + '"' +
      ' aria-label="Play the phrase again">' + SPEAKER_SVG + "</button>" +
      "</div>" +
      '<div class="prompt-sub">' + (checked ? esc(t.phrase.ar) : "tap to hear it again") + "</div>" +
      "</div>" + optionsHTML(t.options, false, t);
  }

  function bubble(who, ar, en, hideEn) {
    return '<div class="turn is-' + who + '">' +
      '<div class="bubble"><span class="ar">' + esc(disp(ar)) + "</span>" +
      (hideEn
        ? '<button class="peek" data-act="peek">What does that mean?</button>'
        : '<span class="bubble-en">' + esc(en) + "</span>") + "</div>" +
      sayBtn(ar, true) + "</div>";
  }

  // Which of the three replies the microphone landed on, if any.
  function convoHeardPick(t) {
    if (!t.heard || !t.heard.text) return null;
    var best = null, bestScore = 0;
    t.options.forEach(function (opt) {
      var sc = heardScore(t.heard.text, SCRIPT[opt] || "");
      if (sc > bestScore) { bestScore = sc; best = opt; }
    });
    if (!best || bestScore < 0.34) return null;
    return { act: "convo-confirm", id: best, label: "Yes, I said " + best };
  }

  function followHTML(t) {
    var checked = session.state === "checked";
    return '<div class="prompt">' +
      '<div class="prompt-label">Listen to the whole exchange</div>' +
      '<div class="listen-stage">' +
      '<button class="say say-lg" data-act="replay" aria-label="Play it again">' + SPEAKER_SVG + "</button>" +
      "</div>" +
      '<div class="prompt-sub">' +
      (canSpeak() ? "tap to hear it again, at normal speed" : "no Arabic voice on this device") + "</div>" +
      '<div class="prompt-label" style="margin-top:22px">Which of these was said?</div>' +
      "</div>" +
      optionsHTML(t.options, false, t) +
      (checked
        ? '<details class="guide suggest" open><summary>The exchange</summary><div class="fold-body">' +
          '<div class="transcript">' + t.lines.map(function (l) {
            return bubble(l.who, l.ar, l.en);
          }).join("") + "</div></div></details>"
        : "");
  }

  function convoTurnHTML(t) {
    var checked = session.state === "checked";
    var cls = "type-in" + (checked ? (session.lastRight ? " is-right" : " is-wrong") : "");
    var lines = "";
    for (var i = 0; i < t.idx; i++) {
      // what you actually said, which in a branching conversation is not
      // always what the script had first
      var past = (session.tasks[i] && session.tasks[i].turn) || t.convo.turns[i];
      lines += bubble("them", past.say, past.sayEn) + bubble("you", past.reply, past.replyEn);
    }
    lines += bubble("them", t.turn.say, t.turn.sayEn, !checked && !t.peeked);
    if (checked) lines += bubble("you", t.turn.reply, t.turn.replyEn);

    return (t.idx === 0 ? '<p class="convo-setting">' + esc(t.convo.setting) + "</p>" : "") +
      '<div class="transcript">' + lines + "</div>" +
      (checked ? "" :
        '<div class="prompt-label" style="margin:20px 0 12px">' +
        (t.alts ? "Both of these are real answers. What happens next depends on which one you give."
          : t.produce ? "How do you reply? No options this time." : "How do you reply?") + "</div>" +
        (canHear() ? '<div class="mic-row">' + micBtn("Answer out loud", ears.busy) + "</div>" : micNote()) +
        heardHTML(t, t.answer, convoHeardPick(t), !!t.produce) +
        (t.produce
          ? '<input class="' + cls + '" data-act="typing" type="text" value="' + esc(t.typed || "") + '"' +
            ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
            ' aria-label="Type your reply">' +
            '<div class="action-row"><button class="btn btn-wide" data-act="check-write">Check</button></div>' +
            '<button class="link-btn" data-act="convo-options">Give me the three options</button>'
          : optionsHTML(t.options, true, t)));
  }

  function buildHTML(t) {
    var checked = session.state === "checked";
    var rung = t.ladder
      ? '<div class="prompt-sub">' +
        (t.rung === t.ladder.length - 1 ? "and now the whole thing"
          : t.rung === 0 ? "the end of it first" : "one more word") +
        " &#183; " + (t.rung + 1) + " of " + t.ladder.length + "</div>"
      : "";
    var slotCls = "slot" + (t.picked.length ? "" : " is-empty") +
      (checked ? (session.lastRight ? " is-right" : " is-wrong") : "");

    var slot = t.picked.map(function (id) {
      return '<button class="tile in-slot" data-act="unpick" data-id="' + id + '"' +
        (checked ? " disabled" : "") + ">" + esc(t.tiles[id].word) + "</button>";
    }).join("");

    var bank = t.tiles.map(function (tile) {
      var spent = t.picked.indexOf(tile.id) !== -1;
      return '<button class="tile' + (spent ? " is-spent" : "") + '" data-act="pick" data-id="' + tile.id + '"' +
        (spent || checked ? " disabled" : "") + (spent ? ' tabindex="-1" aria-hidden="true"' : "") +
        ">" + esc(tile.word) + "</button>";
    }).join("");

    return '<div class="prompt">' +
      '<div class="prompt-label">Build this sentence</div>' +
      '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" + rung + "</div>" +
      '<div class="' + slotCls + '">' + slot + "</div>" +
      '<div class="bank">' + bank + "</div>" +
      (checked ? "" :
        '<div class="btn-row"><button class="btn btn-wide" data-act="check-build"' +
        (t.picked.length === t.target.length ? "" : " disabled") + ">Check</button></div>");
  }

  function matchHTML(t) {
    function cell(side, item) {
      var gone = t.done.indexOf(item.i) !== -1;
      var picked = t.picked && t.picked.side === side && t.picked.i === item.i;
      var miss = t.miss && t.miss.side === side && t.miss.i === item.i;
      var state = gone ? "Matched" : miss ? "No match, try again" : "";
      return '<button class="match-cell' + (side === "l" ? " ar" : "") +
        (gone ? " is-gone" : "") + (picked ? " is-picked" : "") + (miss ? " is-miss" : "") +
        '" data-act="match" data-side="' + side + '" data-i="' + item.i + '"' +
        (gone ? "" : ' aria-pressed="' + (picked ? "true" : "false") + '"') +
        (gone ? " disabled" : "") + ">" + esc(item.text) +
        (state ? '<span class="sr-only">, ' + state + "</span>" : "") + "</button>";
    }
    var rows = "";
    for (var i = 0; i < t.pairs.length; i++) rows += cell("l", t.left[i]) + cell("r", t.right[i]);
    return '<div class="prompt" style="margin-bottom:0">' +
      '<div class="prompt-label">Pair each phrase with its meaning</div>' +
      '<div class="prompt-main" style="font-size:17px;color:var(--ink-2)">' +
      t.done.length + " of " + t.pairs.length + " matched</div></div>" +
      '<div class="match-grid">' + rows + "</div>";
  }

  var NOTES = null;

  // The 58 explanations in the lessons were only ever visible on a study
  // card you chose to open. The moment you get that phrase wrong is when
  // the rule is worth reading.
  function noteFor(ar) {
    if (!NOTES) {
      NOTES = {};
      LESSONS.forEach(function (l) {
        l.phrases.forEach(function (p) { if (p.note && !NOTES[p.ar]) NOTES[p.ar] = p.note; });
      });
    }
    return NOTES[ar] || null;
  }

  function whyHTML(t) {
    var ph = t.phrase || (t.exchange ? { ar: t.exchange.reply } : null);
    if (!ph || !ph.ar) return "";
    var n = noteFor(ph.ar);
    if (!n) {
      // No rule written for it, but the pieces still explain themselves.
      var g = glossesFor(disp(ph.ar));
      return g.length ? '<details class="why" data-fold="why"><summary>' + glossHTML(ph.ar) + "</summary></details>" : "";
    }
    return '<details class="why" data-fold="why"><summary>' + n + "</summary></details>";
  }

  function arabicAnswerFor(t) {
    if (t.type === "say") return true;
    return !((t.type === "quiz" && t.toEnglish) || t.type === "listen");
  }

  // Setting a phrase aside or hiding it should be possible wherever you
  // meet it, not only on the study card. Only "I know this" is withheld
  // after a wrong answer, because you plainly did not.
  function leechOut(t) {
    if (!t.isLeech || !t.phrase) return "";
    var lsn = lessonOf(t, t.phrase);
    if (!lsn) return "";
    return '<div class="confused">This one has slipped ' +
      missCount(lsn.id, t.phrase.ar) + " times. " +
      (isPassive(t.phrase.ar)
        ? "It is on recognise only, so you are not asked to say it."
        : "You can put it on recognise only and stop being asked to produce it.") +
      "</div>";
  }

  // Three buttons that all mean roughly "less of this one" and none of
  // which said what it actually did.
  function asideKey() {
    return '<p class="aside-key"><b>I know this one</b> takes it out of rotation and brings it back once, ' +
      "much later, for a check. <b>I will not say this one</b> keeps it in the games that test whether you " +
      "understood and stops asking you to produce it - the right choice when two phrases do the same job. " +
      "<b>Not for me</b> is for good: it never comes up anywhere again. All three are undone in Your words.</p>";
  }

  function roundControls(t) {
    var ph = t.phrase || (t.exchange ? { ar: t.exchange.reply } : null);
    if (!ph || !ph.ar) return "";
    var lsn = lessonOf(t, ph);
    if (!lsn) return "";
    if (isHidden(lsn.id, ph.ar)) {
      return '<div class="round-controls"><span class="aside-note">Hidden. It will not come up again.</span>' +
        '<button class="pill pill--md aside aside-hide is-off" data-act="hide" data-id="' + esc(ph.ar) +
        '" data-lesson="' + lsn.id + '">Show it again</button></div>';
    }
    var known = !!knownRec(lsn.id, ph.ar);
    var bits = "";
    if (session.lastRight && !t.isRetry) {
      bits += '<button class="pill pill--md aside' + (known ? " is-on" : "") + '" data-act="known" data-id="' + esc(ph.ar) +
        '" data-lesson="' + lsn.id + '"><span class="tick" aria-hidden="true"></span>' +
        (known ? "Set aside" : "I know this one") + "</button>";
    }
    var onlyR = isPassive(ph.ar);
    bits += '<button class="pill pill--md aside' + (onlyR ? " is-on" : "") + '" data-act="passive" data-id="' + esc(ph.ar) +
      '"><span class="tick" aria-hidden="true"></span>' +
      (onlyR ? "Recognise only" : "I will not say this one") + "</button>";
    bits += '<button class="pill pill--md aside aside-hide" data-act="hide" data-id="' + esc(ph.ar) +
      '" data-lesson="' + lsn.id + '">Not for me</button>';
    return '<div class="round-controls">' + bits + asideKey() + "</div>";
  }

  // What you picked, and what it actually is. "Wrong" teaches nothing;
  // "you chose lau samàht, which is for getting attention" teaches the
  // difference that caught you.
  function insteadWith(t) {
    if (!t.instead) return "";
    return '<div class="confused">What you wrote is <b class="ar">' + esc(disp(t.instead.ar)) +
      "</b>, which is <b>" + esc(t.instead.en) + "</b>.</div>";
  }

  function confusedWith(t) {
    var picked = t.chosen;
    if (!picked || picked === t.answer) return "";
    var ar = null, en = null;
    if (t.type === "quiz" && t.toEnglish) {
      // the options were English: find the phrase that means it
      LESSONS.forEach(function (l) {
        l.phrases.forEach(function (p) { if (!ar && p.en === picked) { ar = p.ar; en = p.en; } });
      });
    } else {
      ar = picked;
      en = englishFor(picked);
    }
    if (!ar || !en) return "";
    return '<div class="confused">You chose <span class="ar">' + esc(disp(ar)) +
      "</span>, which is <b>" + esc(en) + "</b>.</div>";
  }

  function verdictHTML(t) {
    if (session.state !== "checked") return "";
    var last = session.i === session.tasks.length - 1;
    var msg;
    if (session.lastRight) {
      // Getting it right is the honest moment to say you have it, and
      // getting it on the second go is the honest moment to say that.
      msg = t.otherForm
        ? '<div class="verdict-msg ok"><b>Right, in ' + esc(t.otherForm === "fusha" ? "fus·ha" : t.otherForm) +
          '.</b>&nbsp;<span>Here it is as you are studying it: </span><span class="ar">' +
          esc(t.answer) + "</span>" + sayBtn(t.phrase ? t.phrase.ar : t.answer, true) + "</div>"
        : t.sameJob
          ? '<div class="verdict-msg ok"><b>That works too.</b>&nbsp;<span>The script had </span>' +
            '<span class="ar">' + esc(t.answer) + "</span><span>, and yours does the same job.</span></div>"
        : t.otherGender
          ? '<div class="verdict-msg ok"><b>Right, the other way round.</b>&nbsp;<span>That is the form for ' +
            "the other gender; the one asked for was </span><span class=\"ar\">" + esc(t.answer) + "</span></div>"
        : t.typo
          ? '<div class="verdict-msg ok"><b>Nearly - one letter out.</b>&nbsp;<span>It is written </span>' +
            '<span class="ar">' + esc(t.answer) + "</span></div>"
        : t.loose
          ? '<div class="verdict-msg ok"><b>Correct.</b>&nbsp;<span>Written out it is </span><span class="ar">' +
            esc(t.answer) + "</span></div>"
          : t.slow
            ? '<div class="verdict-msg ok"><b>Right, but slowly.</b>&nbsp;<span>In a conversation that pause is a gap.</span></div>'
            : t.secondTry
              ? '<div class="verdict-msg ok"><b>Right, second time.</b>&nbsp;<span>It will come round again.</span></div>'
              : '<div class="verdict-msg ok"><b>Correct.</b></div>';
    } else {
      var answer = t.type === "build" ? t.target.join(" ") : (arabicAnswerFor(t) ? disp(t.answer) : t.answer);
      var head = t.noGuess ? "No guess. Here it is." : "Not quite.";
      var arabicAnswer = arabicAnswerFor(t);
      // sayBtn wants the phrase, not the words on screen: in a dialect,
      // and on anything with a question mark, they are not the same.
      var heard = t.phrase ? t.phrase.ar : (t.exchange ? t.exchange.reply : t.answer);
      msg = '<div class="verdict-msg no"><b>' + esc(head) + "</b>&nbsp;<span" +
        (arabicAnswer ? ' class="ar"' : "") + ">" + esc(answer) + "</span>" +
        (arabicAnswer ? sayBtn(heard, true) : "") + "</div>";
    }
    var ending = last && (session.retried || session.missed.length === 0);
    if (session.isTest) {
      return '<div class="verdict" tabindex="-1">' + msg +
        '<button class="btn btn-wide" data-act="next">' +
        (last ? "Finish the test" : "Next") + "</button></div>";
    }
    return '<div class="verdict" tabindex="-1">' + msg +
      (session.lastRight ? "" : confusedWith(t)) +
      (session.lastRight ? "" : insteadWith(t)) + leechOut(t) + anchorHTML(t) +
      (session.lastRight ? "" : whyHTML(t)) + twinPickHTML(t) + roundControls(t) +
      '<button class="btn btn-wide" data-act="next">' +
      (session.isOne ? "Another one" : ending ? "See your score" : "Continue") + "</button>" +
      (session.isOne
        ? '<button class="link-btn only-just" data-go="home">That is enough</button>'
        : "") +
      // Right, but only just, is not the same as right. Saying so pulls
      // the phrase back a step instead of letting it sail off for a
      // month on an answer you had to dig for.
      (session.lastRight && !t.secondTry && t.phrase
        ? '<button class="link-btn only-just" data-act="only-just">That was a struggle</button>'
        : "") + "</div>";
  }

  /* ============================================================
     RESULT
     ============================================================ */

  function resultHTML() {
    var score = session.max ? Math.round(session.earned / session.max * 100) : 0;
    var passed = score >= PASS;
    var lesson = session.lesson;
    var next = lesson ? LESSONS[LESSONS.indexOf(lesson) + 1] : null;

    var line;
    if (session.isTestOut) {
      line = score >= TESTOUT_PASS
        ? "Passed without playing it. The lesson is marked done and its phrases are in the rotation like any other."
        : "Under " + TESTOUT_PASS + "%, so it stays open. Nothing is lost: what you just answered counted for those phrases.";
    } else if (session.isTest) {
      var prev = examHistory().length > 1 ? examHistory()[examHistory().length - 2] : null;
      var gap = prev ? daysSince(prev.day) : null;
      line = session.tasks.length + " at random from everything you have passed, with nothing to help you. " +
        (prev
          ? (score > prev.score
              ? "Up from " + prev.score + "%"
              : score < prev.score
                ? "Down from " + prev.score + "%"
                : "The same as") +
            " " + (gap === 0 ? "earlier today" : gap === 1 ? "yesterday" : gap + " days ago") + "."
          : "This is your first, so it is the line everything later is measured against.");
    } else if (session.isFixup) {
      line = passed
        ? "All of them, second time round."
        : "Some are still slipping. They will come round again on their own.";
    } else if (session.isFollow) {
      line = passed
        ? "You followed it without seeing a word of it. That is the hard half."
        : "Play it through once more and listen for the shape rather than every word.";
    } else if (session.isConvo) {
      line = passed
        ? "You held the whole conversation. Try it again later without the options in front of you."
        : "Read the exchange through again, then replay it; the reply always follows from what was just said.";
    } else if (session.isToday && session.todayNext) {
      line = "Revision done. Lesson " + lessonNo(session.todayNext) + ", " +
        session.todayNext.title.toLowerCase() + ", is waiting when you are.";
    } else if (session.isDrill) {
      line = ((gameByKey(session.isDrill) || {}).label || "That game") +
        ", drawn from everything you have passed.";
    } else if (session.word) {
      line = "Every line in the course that uses " + session.word + ", and nothing else.";
    } else if (session.aimed) {
      line = "Built from what it takes to " + session.aimed.can + ", and the phrases around it.";
    } else if (session.isReview) {
      line = "Drawn from your " + session.reviewPool + " finished lesson" +
        (session.reviewPool === 1 ? "" : "s") +
        ", weighted toward the core and the phrases you keep getting wrong.";
    } else if (passed) {
      line = next
        ? "Lesson " + lessonNo(next) + ", " + next.title.toLowerCase() + ", is now open."
        : "That is the whole course. Go back and push the weaker lessons up.";
    } else {
      line = "You need " + PASS + "% to move on. Study the phrases once more, then play again.";
    }

    var misses = "";
    if (session.missed.length) {
      var seen = {}, rows = "";
      session.missed.forEach(function (p) {
        if (seen[p.ar]) return;
        seen[p.ar] = true;
        rows += '<div class="miss">' + sayBtn(p.ar, true) +
          '<span class="ar">' + esc(disp(p.ar)) + "</span>" +
          '<span class="miss-en">' + esc(p.en) + "</span></div>";
      });
      var n = Object.keys(seen).length;
      misses = '<div class="result-misses"><h3>Worth another look</h3>' + rows +
        '<div class="btn-row" style="margin-top:14px"><button class="btn btn-wide" data-act="fixup">' +
        "Fix these " + n + " now</button></div></div>";
    }

    var eyebrow = session.isTestOut
        ? (score >= TESTOUT_PASS ? "You knew it" : "Not quite known")
      : session.isTest ? "Test over"
      : session.isFixup ? "Patched up"
      : session.isConvo ? "Conversation over"
      : session.isReview ? "Review complete"
      : (passed ? "Lesson complete" : "Not there yet");
    var tone = session.isTest || session.isReview || session.isConvo ? "review" : (passed ? "pass" : "fail");

    var again = session.isTest ? '<button class="btn btn-ghost" data-go="can">What you can do</button>'
      : session.isFixup ? ""
      : session.isFollow
      ? '<button class="btn btn-ghost" data-go="follow" data-id="' + esc(session.convo.id) + '">Hear it again</button>'
      : session.isConvo
      ? '<button class="btn btn-ghost" data-go="convo" data-id="' + esc(session.convo.id) + '">Run it again</button>'
      : session.isReview
        ? '<button class="btn btn-ghost" data-go="review">Review again</button>'
        : '<button class="btn btn-ghost" data-go="play" data-id="' + lesson.id + '">Play again</button>';
    // Today does not end with the review: it hands you on to whichever
    // of the producing screens is next in the circuit.
    // Before the onward step, the honest one: something you passed is
    // slipping, and it has a name.
    var weak = weakestLesson(session.lesson || null);
    var aim = nextForWant();
    var back = aim
      ? '<div class="circuit"><button class="btn btn-ghost btn-wide" data-go="ready" data-id="' +
        esc(aim.entry.id) + '">Next for what you are here for: ' + esc(aim.entry.can) + "</button>" +
        '<span class="circuit-why">' + aim.have + " of " + aim.n + " phrases solid &#183; " +
        esc(wantInfo().label.toLowerCase()) + "</span>" +
        '<button class="link-btn" data-go="choose">or pick the lessons yourself</button></div>'
      : weak
      ? '<div class="circuit"><button class="btn btn-ghost btn-wide" data-go="play" data-id="' +
        weak.lesson.id + '">Before you go on: lesson ' + lessonNo(weak.lesson) + " again</button>" +
        '<span class="circuit-why">' + weak.n + " phrases there are slipping &#183; " +
        esc(weak.lesson.title.toLowerCase()) + "</span>" +
        '<button class="link-btn" data-go="choose">or pick the lessons yourself</button></div>'
      : '<div class="circuit"><button class="link-btn" data-go="choose">' +
        "Take me to a lesson of my choosing</button></div>";

    var circuit = "";
    if (session.isToday || session.isReview) {
      var step = circuitNext();
      if (step) {
        circuit = '<div class="circuit"><button class="btn btn-ghost btn-wide" data-go="' + step.go +
          '">' + esc(step.label) + "</button>" +
          '<span class="circuit-why">' + esc(step.why) + "</span></div>";
      }
    }

    var onward = session.isToday && session.todayNext
      ? '<button class="btn" data-go="lesson" data-id="' + session.todayNext.id + '">Lesson ' + lessonNo(session.todayNext) + "</button>"
      : !session.isReview && !session.isConvo && passed && next
        ? '<button class="btn" data-go="lesson" data-id="' + next.id + '">Next lesson</button>'
        : '<button class="btn" data-go="home">Back to lessons</button>';

    return topbarHTML(session.word ? "The word " + session.word
      : session.aimed ? "Ready for: " + session.aimed.can
      : session.isTest ? "The test"
      : session.isToday ? "Today"
      : session.isFixup ? "Fixing what you missed"
      : session.isConvo ? session.convo.title
      : session.isDrill ? (gameByKey(session.isDrill) || {}).label + " only"
      : session.isReview ? "Mixed review" : lesson.title) +
      '<div class="card result fade-in" tabindex="-1">' +
      '<div class="eyebrow">' + eyebrow + "</div>" +
      '<div class="result-score mono ' + tone + '">' + score + "%</div>" +
      (session.isTest ? "" : '<p class="result-delta">' + esc(deltaLine(sessionDelta())) + "</p>") +
      '<p class="result-line">' + esc(line) + "</p>" +
      misses + (session.isTest ? "" : back) + circuit + "</div>" +
      '<div class="btn-row">' + again + onward + "</div>";
  }

  /* ============================================================
     ANSWERING
     ============================================================ */

  function lessonOf(task, phrase) {
    return (phrase && phrase._lesson) || (task && task.srcLesson) || session.lesson;
  }

  function noteMiss(task, phrase) {
    session.missed.push({ ar: phrase.ar, en: phrase.en, lesson: lessonOf(task, phrase) });
  }

  function scorePhrase(task, right, phrase) {
    if (!phrase || (task && (task.isRetry || task.isTest || task.noMemory))) return;
    if (task && task.isEcho && right) {
      var le = lessonOf(task, phrase);
      if (le) { bumpStrength(le.id, phrase.ar, true, "held"); save(); }
      return;
    }
    var l = lessonOf(task, phrase);
    if (!l) return;
    // Typing it is the one game where a miss can be a spelling and not a
    // gap, so it costs a step instead of two.
    bumpStrength(l.id, phrase.ar, right, task && task.type === "write" ? "soft" : null);

    // This was a phrase you had set aside, coming back for its check.
    var rec = knownRec(l.id, phrase.ar);
    if (rec) {
      if (right) setKnown(l.id, phrase.ar);   // sleeps again from now
      else clearKnown(l.id, phrase.ar);       // back into normal rotation
    }
    save();
  }

  function settle(task, right, phrase, secondTry) {
    // Reaching for the three options after being asked to produce it is
    // the same admission as getting it on the second try.
    if (right && task.gaveUp) secondTry = true;
    if (right && !secondTry && tookTooLong(task)) {
      task.slow = true;
      secondTry = true;   // right, but not ready: hold it where it is
    }
    session.state = "checked";
    session.lastRight = right;
    task.settled = true;
    task.wasRight = right;
    task.secondTry = !!secondTry;
    if (right && !secondTry && task.points > 0) session.earned += 1;
    if (!task.isRetry && !task.noMemory) noteMode(task, right && !secondTry);
    if (!right && phrase && !task.isRetry) noteMiss(task, phrase);
    // Getting there on the second go is not knowing it: the round moves
    // on, but the phrase does not climb for it.
    if (right && secondTry) {
      var l = phrase && lessonOf(task, phrase);
      if (l) { bumpStrength(l.id, phrase.ar, true, "held"); save(); }
    } else {
      scorePhrase(task, right, phrase);
    }
    // A single question never reaches finish(), which is where the app
    // usually notices you were here. Answering one still counts as a
    // visit, or a week of them would read as a week away.
    if (session.isOne) { store.lastDay = today(); save(); }
    render();
  }

  // Guessing between four options teaches the app nothing and you less.
  // Saying so costs one step, not two, because you were honest about it.
  function giveUp() {
    if (session.state === "checked") return;
    var t = session.tasks[session.i];
    t.gaveUp = true;
    t.noGuess = true;
    var ph = phraseOfTask(t);
    session.state = "checked";
    session.lastRight = false;
    t.settled = true;
    t.wasRight = false;
    if (ph && !t.isRetry) noteMiss(t, ph);
    var l = ph && lessonOf(t, ph);
    if (l && !t.isRetry && !t.isTest && !t.noMemory) {
      bumpStrength(l.id, ph.ar, false, "soft");
      save();
    }
    render();
  }

  function answer(value) {
    if (session.state === "checked") return;
    var t = session.tasks[session.i];

    // One wrong answer is not the end of the question. The one you chose
    // is struck out and you go again: a second try is retrieval, reading
    // the answer is not. The second one settles it either way.
    // A fork, or a question the course answers two ways, has more than
    // one right answer, and striking one of them out as a wrong first try
    // would be exactly backwards.
    var onFork = t.answers && t.answers.indexOf(value) !== -1;
    if (value !== t.answer && !onFork && !t.tried && t.options && t.options.length > 2 &&
      !t.isRetry && !t.isTest) {
      t.tried = value;
      render();
      return;
    }

    t.chosen = value;
    if (!t.alts && t.answers && t.answers.indexOf(value) !== -1 && value !== t.answer) {
      // both are taught as answers to this line; the one you gave is the
      // one the round is about
      t.answer = value;
      if (t.exchange) t.exchange = { ask: t.exchange.ask, askEn: t.exchange.askEn, reply: value, en: englishFor(value) || t.exchange.en };
    }
    if (t.alts) {
      var picked = null;
      t.alts.forEach(function (a) { if (a.reply === value) picked = a; });
      if (picked) {
        t.answer = picked.reply;
        t.turn = { say: t.turn.say, sayEn: t.turn.sayEn, reply: picked.reply, replyEn: picked.replyEn };
        rebuildTail(picked.next);
      }
      settle(t, !!picked, picked ? { ar: picked.reply, en: picked.replyEn } : phraseOfTask(t), !!t.tried);
      return;
    }
    settle(t, value === t.answer, phraseOfTask(t), !!t.tried);
  }

  function phraseOfTask(t) {
    return t.type === "dialog" ? { ar: t.exchange.reply, en: t.exchange.en } :
      t.type === "convoturn" ? { ar: t.turn.reply, en: t.turn.replyEn } :
      t.phrase;
  }

  // The last turn of a branching conversation is whichever one your
  // answer led to, so it is built again the moment you answer.
  function rebuildTail(turn) {
    if (!turn || !session) return;
    var tail = session.tasks[session.tasks.length - 1];
    if (!tail || tail.type !== "convoturn") return;
    var wrong = [];
    CONVOS.forEach(function (c) {
      c.turns.forEach(function (t) {
        if (wrong.length >= 2 || t.reply === turn.reply || wrong.indexOf(t.reply) !== -1) return;
        if (sameJob(t.reply, turn.reply)) return;
        wrong.push(t.reply);
      });
    });
    tail.turn = turn;
    tail.answer = turn.reply;
    tail.chosen = null;
    tail.tried = null;
    tail.typed = "";
    tail.srcLesson = lessonById(lessonTeaching(turn.reply));
    tail.options = shuffle(wrong.slice(0, 2).concat([turn.reply]));
  }

  function checkWrite() {
    var t = session.tasks[session.i];
    if (session.state === "checked") return;
    var field = app.querySelector('[data-act="typing"]');
    if (field) t.typed = field.value;
    if (!normalise(t.typed)) return;
    var ph = phraseOfTask(t);
    var verdict = ph ? judgeTyped(t.typed, ph.ar) : { right: sameSaid(t.typed, t.answer) };
    // In a conversation the question is what you would say, not which
    // word the script had. Any phrase that does the same job answers it.
    if (ph && verdict && !verdict.right && t.type === "convoturn") {
      var alt = null;
      LESSONS.forEach(function (l) {
        l.phrases.forEach(function (p) {
          if (alt || !sameJob(p.ar, ph.ar)) return;
          var v = judgeTyped(t.typed, p.ar);
          if (v && v.right) alt = p.ar;
        });
      });
      if (alt) verdict = { right: true, sameJob: alt };
    }
    if (!verdict) return;
    t.loose = !!verdict.loose;
    t.typo = !!verdict.typo;
    t.otherGender = verdict.gender || null;
    t.sameJob = verdict.sameJob || null;
    t.otherForm = verdict.other || null;
    t.instead = verdict.instead || null;
    // A slip of the thumb is right, but it is not solid: it holds the
    // phrase where it is rather than letting it climb.
    settle(t, verdict.right, ph, verdict.typo ? true : undefined);
  }

  function checkBuild() {
    var t = session.tasks[session.i];
    if (session.state === "checked" || t.picked.length !== t.target.length) return;
    var built = t.picked.map(function (id) { return t.tiles[id].word; });
    var right = built.join(" ") === t.target.join(" ");

    // Up the ladder: a rung answered right is not the end of the round,
    // it is the next rung, one word longer.
    if (right && t.ladder && t.rung < t.ladder.length - 1) {
      t.rung += 1;
      t.target = t.ladder[t.rung];
      t.tiles = buildTiles(t.target, t.srcLesson, t.phrase);
      t.picked = [];
      t.climbed = true;
      render();
      return;
    }
    settle(t, right, t.phrase);
  }

  function matchTap(side, i) {
    var t = session.tasks[session.i];
    if (session.state === "checked" || t.done.indexOf(i) !== -1) return;
    t.miss = null;

    if (!t.picked || t.picked.side === side) { t.picked = { side: side, i: i }; render(); return; }

    if (t.picked.i === i) {
      t.done.push(i);
      if (!t.missedOnce[i]) session.earned += 1;
      scorePhrase(t, !t.missedOnce[i], t.pairs[i]);
      t.picked = null;
      if (t.done.length === t.pairs.length) {
        session.state = "checked";
        session.lastRight = true;
        // Match never goes through settle(), so it has to say for itself
        // that it is finished, or walking back to it is a dead end.
        t.settled = true;
        t.wasRight = true;
      }
      render();
      return;
    }

    [i, t.picked.i].forEach(function (k) {
      if (!t.missedOnce[k]) {
        t.missedOnce[k] = true;
        noteMiss(t, t.pairs[k]);
        scorePhrase(t, false, t.pairs[k]);
      }
    });
    t.miss = { side: side, i: i };
    t.picked = null;
    render();
    window.setTimeout(function () {
      if (session && session.tasks[session.i] === t && t.miss) { t.miss = null; render(); }
    }, 420);
  }

  // Closing the tab in the middle of a session lost the session. The
  // strengths were safe - they are written as each answer lands - but the
  // twelve rounds you were in the middle of were not.
  function keepSession() {
    if (!session || session.finished || session.isTest || session.isTestOut) { store.open = null; return; }
    if (session.i < 1) { store.open = null; return; }
    store.open = {
      day: today(),
      i: session.i,
      of: session.tasks.length,
      kind: sessionKind(),
      lesson: session.lesson ? session.lesson.id : null,
      convo: session.convo ? session.convo.id : null,
      only: session.only || null
    };
    save();
  }

  function openSession() {
    var o = store.open;
    if (!o || o.day !== today()) return null;
    return o;
  }

  function resumeSession() {
    var o = openSession();
    if (!o) return;
    store.open = null;
    save();
    var s2 = null;
    if (o.kind === "lesson" && o.lesson) s2 = buildSession(lessonById(o.lesson));
    else if (o.kind === "convo" || o.kind === "daily") {
      var c = convoById(o.convo);
      if (c) s2 = buildConvo(c);
    } else s2 = buildReview(o.only ? { only: o.only } : {});
    if (s2) { session = s2; go({ name: "play" }); }
    else { render(); }
  }

  function finish() {
    // Walking back to the last round and forward again must not score
    // the session twice.
    if (session.finished) { go({ name: "result" }, { replace: true }); return; }
    session.finished = true;
    store.open = null;
    var score = session.max ? Math.round(session.earned / session.max * 100) : 0;
    // Sessions are the clock the spot checks run on. A test is not one:
    // nothing in it counted, so nothing in it may move the clock either.
    if (!session.isTest) store.runs = runCount() + 1;
    store.lastDay = today();
    noteDiary(score);
    if (session.isTestOut) {
      // Nine out of ten cold is a better proof than a played lesson.
      if (score >= TESTOUT_PASS) record(session.lesson.id, score);
      else save();
    } else if (session.isTest) {
      store.exams = examHistory().concat([{ day: today(), score: score, n: session.tasks.length }]).slice(-12);
      save();
    } else if (session.isFixup) {
      // Strengths already moved as each answer landed. A three-phrase
      // patch is not a review run and must not stand as one.
      save();
    } else if (session.isReview) {
      var rv = store.review || { best: 0, runs: 0 };
      rv.runs += 1;
      if (score > rv.best) rv.best = score;
      store.review = rv;
      save();
    } else if (session.isConvo) {
      if (session.convo.isDaily) store.daily = today();
      if (!store.convos) store.convos = {};
      var c = store.convos[session.convo.id] || { best: 0 };
      if (score > c.best) c.best = score;
      store.convos[session.convo.id] = c;
      save();
    } else {
      record(session.lesson.id, score);
    }
    go({ name: "result" }, { replace: true });
  }

  var EXTRA_ROUNDS = 4;

  // A session that is going well stops at the same place as one that is
  // not. If the run is strong and there is more to draw on, it carries
  // on a little rather than ending on the number twelve.
  function maybeExtend() {
    if (!session.isReview || session.extended) return;
    if (session.i < session.tasks.length - 1) return;
    var asked = session.tasks.filter(function (t) { return t.settled && t.points > 0; });
    if (asked.length < 6) return;
    var right = asked.filter(function (t) { return t.wasRight && !t.secondTry; }).length;
    if (right / asked.length < 0.9) return;
    var more = buildReview();
    if (!more) return;
    var add = more.tasks.filter(function (t) { return t.type !== "match"; }).slice(0, EXTRA_ROUNDS);
    if (!add.length) return;
    session.extended = true;
    session.tasks = session.tasks.concat(add);
    session.max += add.reduce(function (n, t) { return n + t.points; }, 0);
    session.grew = true;
  }

  function advance() {
    stopTape();
    dropTape();
    keepSession();
    rotateVoice();
    speech.lastSaid = null;
    // A single question has no next round and no end: either another
    // one, drawn fresh, or you put the phone away.
    if (session.isOne) {
      var again = buildOne();
      if (again) { session = again; go({ name: "one" }); }
      else go({ name: "home" });
      return;
    }
    if (!session.isTest) maybeExtend();
    var atEnd = session.i >= session.tasks.length - 1;

    if (atEnd && !session.retried && !session.isTest) {
      session.retried = true;
      var seen = {}, repeats = [];
      session.missed.forEach(function (m) {
        if (seen[m.ar] || repeats.length >= RETRY_MAX || !m.lesson) return;
        seen[m.ar] = true;
        var again = quizRound(m.lesson, m);
        if (again) { again.points = 0; again.isRetry = true; repeats.push(again); }
      });
      if (repeats.length) session.tasks = session.tasks.concat(repeats);
    }

    if (session.i >= session.tasks.length - 1) { finish(); return; }
    session.i++;
    session.state = "asking";
    go({ name: "play" });
  }

  // Every render replaces the whole screen, which used to slam shut any
  // fold you had opened - including the one holding the chips you had
  // just tapped.
  function foldState() {
    var out = {};
    if (!app.querySelectorAll) return out;
    var was = app.querySelectorAll("details[data-fold]");
    for (var i = 0; i < was.length; i++) {
      var k = was[i].getAttribute("data-fold");
      if (k) out[k] = !!was[i].open;
    }
    return out;
  }

  var wantFold = null;
  var whoNote = null;

  // A fold the menu is sending you to is emitted open, so it is open in
  // the first paint rather than a frame later.
  function foldAttr(id, openByDefault) {
    return (wantFold === id || openByDefault) ? " open" : "";
  }

  function restoreFolds(open) {
    if (wantFold) open[wantFold] = true;
    if (!app.querySelectorAll) return;
    var now = app.querySelectorAll("details[data-fold]");
    for (var i = 0; i < now.length; i++) {
      var k = now[i].getAttribute("data-fold");
      if (k && open[k] !== undefined) now[i].open = open[k];
      if (k && k === wantFold && now[i].scrollIntoView) now[i].scrollIntoView({ block: "start" });
    }
    wantFold = null;
  }

  var moveWas = "";
  var scrollAt = {};

  // Screens have a depth, so the app can tell going in from coming back
  // and slide the right way.
  var DEPTH = {
    home: 0, lesson: 1, learn: 2, play: 2, result: 3,
    phrasebook: 1, make: 1, you: 1, moment: 1, twins: 1, asked: 1, numbers: 1,
    loud: 1, words: 1, talk: 1, one: 1, can: 1, diary: 1, mine: 1, now: 1,
    street: 1, sounds: 1, choose: 1, frame: 1, answers: 1
  };

  function moveClass(next) {
    var was = typeof DEPTH[moveWas] === "number" ? DEPTH[moveWas] : 1;
    var now = typeof DEPTH[next] === "number" ? DEPTH[next] : 1;
    moveWas = next;
    if (now === was) return "";
    return now > was ? " screen-push" : " screen-pop";
  }

    var t = session.tasks[session.i];
    if (session.state === "checked") {

      return;
    }

    if (t.type === "write") {
      var field = app.querySelector('[data-act="typing"]');
      if (field && typeof field.focus === "function") {
        field.focus();
        if (typeof field.setSelectionRange === "function") {
          field.setSelectionRange(field.value.length, field.value.length);
        }
      }

    if (t.type === "match") {
      var cellTarget = t.miss || t.picked;
      var cell = cellTarget
        ? app.querySelector('[data-act="match"][data-side="' + cellTarget.side + '"][data-i="' + cellTarget.i + '"]')
        : app.querySelector('[data-act="match"]:not([disabled])');
      if (cell && typeof cell.focus === "function") cell.focus();
    }

    if ((t.type === "listen" || t.type === "dictate") && !t.played) { t.played = true; speak(t.phrase.ar); }
    if (t.type === "follow" && !t.played) { t.played = true; playRun(t.lines); }
  }

  // Speak a whole exchange back to back, so it arrives the way speech
  // does rather than one card at a time.
  var playingRun = null;

  function playRun(lines, done) {
    if (!canSpeak()) { done && done(); return; }
    stopSpeech();
    var i = 0;
    playingRun = {};
    var mine = playingRun;
    function next() {
      if (mine !== playingRun) return;
      if (i >= lines.length) { playingRun = null; done && done(); return; }
      var line = lines[i++];
      var text = spk(line.ar);
      if (!text) { next(); return; }
      var u = new window.SpeechSynthesisUtterance(text);
      u.voice = speech.voice;
      u.lang = speech.voice.lang;
      u.rate = store.speed === "slow" ? 0.75 : 1;
      u.onend = u.onerror = next;
      window.speechSynthesis.speak(u);
    }
    next();
  }

  function stopSpeech() {
    if (speech.supported) window.speechSynthesis.cancel();
    speech.playing = null;
    playingRun = null;
  }

  // Only from the grip or the heading, and only while it is a sheet: in
  // the drawer, and anywhere the list has been scrolled, a downward drag
  // is somebody reading the menu.
  var sheet = null;
  var SHEET_SHUT = 96;

  function sheetEl() {
    return app.querySelector ? app.querySelector(".nav") : null;
  }

  function sheetWidth() {
    return typeof window.innerWidth === "number" ? window.innerWidth : 0;
  }

  function endSheet(shut) {
    var el = sheet && sheet.el;
    sheet = null;
    if (!el || !el.style) return;
    el.style.transform = "";
    if (el.classList) el.classList.remove("is-dragging");
    if (shut) { navOpen = false; render(); }
  }

  if (typeof document.addEventListener === "function") {
    document.addEventListener("touchstart", function (ev) {
      if (navOpen && sheetWidth() && sheetWidth() <= 620) {
        var grip = ev.target && ev.target.closest && ev.target.closest(".nav-grip, .nav-head");
        var el = grip ? sheetEl() : null;
        var st = ev.touches && ev.touches[0];
        if (el && st && !(el.scrollTop > 0)) {
          sheet = { y: st.clientY, el: el, dy: 0 };
          if (el.classList) el.classList.add("is-dragging");
        }
      }
      var t = ev.touches && ev.touches[0];
      if (!t || navOpen || (ev.touches && ev.touches.length > 1)) { swipe = null; return; }
      swipe = t.clientX <= 24 ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
    }, { passive: true });

    document.addEventListener("touchmove", function (ev) {
      if (!sheet) return;
      var t = ev.touches && ev.touches[0];
      if (!t) return;
      sheet.dy = Math.max(0, t.clientY - sheet.y);
      if (sheet.el.style) sheet.el.style.transform = "translateY(" + sheet.dy + "px)";
    }, { passive: true });

    document.addEventListener("touchend", function () {
      if (sheet) { endSheet(sheet.dy > SHEET_SHUT); return; }
    }, { passive: true });

    document.addEventListener("touchcancel", function () {
      if (sheet) endSheet(false);
    }, { passive: true });

    document.addEventListener("touchend", function (ev) {
      if (!swipe) return;
      var t = ev.changedTouches && ev.changedTouches[0];
      var was = swipe;
      swipe = null;
      if (!t) return;
      var dx = t.clientX - was.x;
      var dy = Math.abs(t.clientY - was.y);
      // a real edge swipe: mostly sideways, far enough, and not a slow drag
      if (dx > 70 && dy < 60 && Date.now() - was.at < 700) goBack();
    }, { passive: true });
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

    if (navOpen) {
      if (ev.key === "Escape") {
        ev.preventDefault();
        navOpen = false;
        render();
        var navOpener = app.querySelector('[data-act="nav-open"]');
        if (navOpener && typeof navOpener.focus === "function") navOpener.focus();
        return;
      }
      if (ev.key === "Tab") {
        var navFocusable = app.querySelectorAll('.nav button:not([disabled])');
        if (navFocusable.length) {
          var navFirst = navFocusable[0], navLast = navFocusable[navFocusable.length - 1];
          if (ev.shiftKey && document.activeElement === navFirst) { ev.preventDefault(); navLast.focus(); }
          else if (!ev.shiftKey && document.activeElement === navLast) { ev.preventDefault(); navFirst.focus(); }
        }
        return;
      }
    }

    var field = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-act");
    if (field === "typing") {
      if (ev.key === "Enter") { ev.preventDefault(); checkWrite(); }
      return;
    }
    if (field === "moment-typing") {
      if (ev.key === "Enter") { ev.preventDefault(); checkMoment(); }
      return;
    }
    if (field === "numbers-typing") {
      if (ev.key === "Enter") { ev.preventDefault(); checkNumbers(); }
      return;
    }

    if (view.name === "play" && session) {
      if (session.state === "checked" && (ev.key === "Enter" || ev.key === " ")) {
        ev.preventDefault();
        var nextBtn = app.querySelector('[data-act="next"]');
        if (nextBtn) nextBtn.click();
        return;
      }
      if (session.state === "asking" && /^[1-4]$/.test(ev.key)) {
        var opts = app.querySelectorAll('[data-act="answer"]');
        var chosen = opts[Number(ev.key) - 1];
        if (chosen) { ev.preventDefault(); chosen.click(); }
      }
      return;
    }

    if (view.name === "learn") {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        var stepBtn = app.querySelector('[data-act="learn-' + (ev.key === "ArrowLeft" ? "prev" : "fwd") + '"]');
        if (stepBtn && !stepBtn.disabled) { ev.preventDefault(); stepBtn.click(); }
        return;
      }
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        var lb = app.querySelector('[data-act="learn-reveal"],[data-act="learn-next"]');
        if (lb) lb.click();
      }
    }
  });

  if (speech.supported) {
    findArabicVoice();
    window.speechSynthesis.onvoiceschanged = function () {
      if (findArabicVoice()) render();
    };
  }

  if (typeof window.addEventListener === "function") {
    window.addEventListener("hashchange", function () {
      if (applyingRoute) return;
      var here = window.location.hash;
      if (here === hashFor(view)) return;
      stopSpeech();
      applyHash(here);
      window.scrollTo(0, 0);
    });
  }

  applyHash(typeof window.location !== "undefined" ? window.location.hash : "");
})();
</script>

</body>
</html>
