      ? '<div class="pb-group"><h3>Set aside &#183; ' + idx.known.length + "</h3>" +
        '<p class="fold-lead">Out of rotation because you said you had them. Each comes back for a check about ' + RECHECK_AFTER + " days later.</p>" +
        idx.known.sort(function (a, b) { return a.due - b.due; }).map(function (it) {
          return wordRow(it, "known", it.due === 0 ? "Due a check" : "Back in " + it.due + "d");
        }).join("") + "</div>"
      : '<div class="pb-group"><h3>Set aside</h3>' +
        '<p class="fold-lead">Nothing yet. Tick <b>I know this one</b> on a card or after a right answer.</p></div>';

    var hiddenBlock = idx.hidden.length
      ? '<div class="pb-group"><h3>Hidden &#183; ' + idx.hidden.length + "</h3>" +
        '<p class="fold-lead">Gone for good, on purpose. They never come up anywhere.</p>' +
        idx.hidden.map(function (it) { return wordRow(it, "hide", "Show again"); }).join("") + "</div>"
      : '<div class="pb-group"><h3>Hidden</h3>' +
        '<p class="fold-lead">Nothing hidden. Use <b>Not for me</b> on anything you will never need.</p></div>';

    var passiveBlock = idx.passive.length
      ? '<div class="pb-group"><h3>Recognise only &#183; ' + idx.passive.length + "</h3>" +
        '<p class="fold-lead">You are never asked to produce these, only to understand them. They still come ' +
        "up in the quiz, the listening and the matching.</p>" +
        idx.passive.map(function (it) { return wordRow(it, "passive", "Say it too"); }).join("") + "</div>"
      : '<div class="pb-group"><h3>Recognise only</h3>' +
        '<p class="fold-lead">Nothing parked. When two phrases do the same job, ' +
        "<b>One job, several phrases</b> lets you keep one and only recognise the other.</p></div>";

    return topbarHTML("Your words") +
      '<p class="pb-lead">What you have taken out of rotation, and how to put it back. Tap any line to hear it.</p>' +
      knownBlock + passiveBlock + hiddenBlock +
      (idx.known.length || idx.hidden.length || idx.passive.length
        ? '<div class="btn-row btn-row-stack">' +
          (idx.known.length ? '<button class="btn btn-ghost" data-act="unknow-all">Return all set aside</button>' : "") +
          (idx.passive.length ? '<button class="btn btn-ghost" data-act="unpassive-all">Ask for all of them again</button>' : "") +
          (idx.hidden.length ? '<button class="btn btn-ghost" data-act="unhide-all">Show all hidden</button>' : "") +
          "</div>"
        : "");
  }

  // The phrasebook is 40 hand-picked lines. Everything you have been
  // taught is nine times that, and until now the search box could not
  // see any of it.
  var COURSE = null;
  function courseIndex() {
    if (COURSE) return COURSE;
    COURSE = [];
    var seen = {};
    function add(ar, en, lesson) {
      if (!ar || !en || seen[ar]) return;
      seen[ar] = true;
      COURSE.push({ ar: ar, en: en, lesson: lesson });
    }
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) { add(p.ar, p.en, l); });
      (l.dialogue || []).forEach(function (d) {
        add(d.ask, d.askEn, l);
        add(d.reply, d.en, l);
      });
    });
    return COURSE;
  }

  var COURSE_HITS = 24;

  function courseSearch(q, skip) {
    var alsoEn = italianFor(q);
    return courseIndex().filter(function (item) {
      if (skip[item.ar]) return false;
      if (normalise(item.ar).indexOf(q) !== -1) return true;
      if (normalise(disp(item.ar)).indexOf(q) !== -1) return true;
      if (normalise(item.en).indexOf(q) !== -1) return true;
      for (var i = 0; i < alsoEn.length; i++) {
        if (hasWord(normalise(item.en), alsoEn[i])) return true;
      }
      return false;
    });
  }

  /* ============================================================
     THE DICTIONARY - every word the course can break down, what it
     means, and every line it turns up in. From a word you can start
     a session made of nothing but those lines.
     ============================================================ */

  // A part of speech for every one of a thousand words would be a
  // second table to keep true, and it would go stale the first time a
  // lesson went in. The gloss is the description the file already
  // holds, so the gloss is what decides - and the one bucket the
  // rules cannot split says so rather than guessing.
  var KINDS = [
    { key: "verb", label: "Verbs" },
    { key: "question", label: "Question words" },
    { key: "pronoun", label: "Me, you, mine" },
    { key: "number", label: "Numbers" },
    { key: "formula", label: "Said whole" },
    { key: "word", label: "Everything else" }
  ];

  var KIND_SET = {
    formula: {
      "shùkran": 1, "ʿàfwan": 1, "inshàallah": 1, "khalàs": 1, "yàlla": 1,
      "maʿlèsh": 1, "wàllah": 1, "wàlaw": 1, "bkhàtrak": 1, "sàhtein": 1,
      "hayyà": 1, "màrhaba": 1, "àhlan": 1, "sàhlan": 1, "marhàban": 1,
      "tamàm": 1, "tàyyib": 1, "tàyyeb": 1, "mabrùk": 1
    },
    question: {
      "man": 1, "mà": 1, "màdha": 1, "àina": 1, "matà": 1, "kam": 1,
      "kèifa": 1, "ày": 1, "àyy": 1, "hal": 1, "limàdha": 1, "lèish": 1,
      "shu": 1, "wèin": 1, "èmta": 1, "addèsh": 1, "mìn": 1, "kìf": 1,
      "kìfak": 1, "kìfik": 1
    }
  };

  function kindOf(word, gloss) {
    if (KIND_SET.formula[word]) return "formula";
    if (KIND_SET.question[word]) return "question";
    var g = String(gloss || "").toLowerCase().replace(/\s*\([^)]*\)/g, "").trim();
    if (/^(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|a hundred|one hundred)\b/.test(g)) return "number";
    if (/^(my|your|his|her|our|their)\b/.test(g)) return "pronoun";
    // "I want" and "I have" are verbs to anyone looking for them, even
    // where Arabic builds them out of a preposition and an ending.
    if (/^(i|you|he|she|it|we|they) [a-z]/.test(g)) return "verb";
    if (/^(i|you|he|she|it|we|they|this|that)\b/.test(g)) return "pronoun";
    if (/^(with|about|in|on|for) (me|you|him|her|us|them|it)\b/.test(g)) return "pronoun";
    if (/^(may|let)\b/.test(g)) return "verb";
    if (/^(wash|take|teach|show|correct|write|come|sit|try|wait|give|look|speak|stop|enter|go|bless|say|do not)\b/.test(g)) return "verb";
    return "word";
  }

  function kindLabel(k) {
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i].key === k) return KINDS[i].label;
    return "";
  }

  // The Levantine of a phrase, whichever table it lives in, so a word
  // is indexed against both sides of the course and not just the one
  // the app happens to be showing.
  function levFormOf(ar) {
    var row = DIALECT[ar];
    if (row && row.lev) return row.lev[0];
    if ((SAME.lev || {})[ar]) return ar;
    return null;
  }

  function dictTokens(text) {
    return String(text).toLowerCase().split(/\s+/).map(function (w) {
      return w.replace(/[?!.,;:"]/g, "").trim();
    }).filter(Boolean);
  }

  var DICT = null;

  function dictIndex() {
    if (DICT) return DICT;
    var rows = {};
    function seed(w, gloss, isLev) {
      if (rows[w]) return;
      rows[w] = { word: w, gloss: gloss, lev: !!isLev, kind: kindOf(w, gloss), lines: [], seen: {} };
    }
    Object.keys(GLOSS).forEach(function (w) { seed(w, GLOSS[w], false); });
    Object.keys(GLOSS_LEV).forEach(function (w) { seed(w, GLOSS_LEV[w], true); });

    function hit(token, ar) {
      var bare = bareWord(token);
      var r = rows[token] || rows[bare] || rows["al-" + bare];
      if (!r || r.seen[ar]) return;
      r.seen[ar] = true;
      r.lines.push(ar);
    }

    var texts = [];
    courseIndex().forEach(function (item) { texts.push(item.ar); });
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) { if (p.f) texts.push(p.f); });
    });
    texts.forEach(function (ar) {
      dictTokens(ar).forEach(function (t) { hit(t, ar); });
      var lv = levFormOf(ar);
      if (lv) dictTokens(lv).forEach(function (t) { hit(t, ar); });
    });

    var list = [];
    Object.keys(rows).forEach(function (w) {
      var r = rows[w];
      if (!r.lines.length) return;
      delete r.seen;
      list.push(r);
    });
    list.sort(function (a, b) {
      var x = normalise(a.word), y = normalise(b.word);
      return x < y ? -1 : x > y ? 1 : 0;
    });
    DICT = { list: list, by: {} };
    list.forEach(function (r) { DICT.by[r.word] = r; });
    return DICT;
  }

  var DICT_HITS = 60;
  var dictQuery = "";
  var dictKindKey = "all";

  function dictSearch() {
    var q = normalise(dictQuery);
    var alsoEn = q ? italianFor(q) : [];
    return dictIndex().list.filter(function (r) {
      if (dictKindKey !== "all" && r.kind !== dictKindKey) return false;
      if (!q) return true;
      if (normalise(r.word).indexOf(q) !== -1) return true;
      if (normalise(r.gloss).indexOf(q) !== -1) return true;
      for (var i = 0; i < alsoEn.length; i++) {
        if (hasWord(normalise(r.gloss), alsoEn[i])) return true;
      }
      return false;
    });
  }

  function dictRowsHTML() {
    var hits = dictSearch();
    var shown = hits.slice(0, DICT_HITS);
    if (!shown.length) {
      return '<p class="fold-lead">Nothing under that. Try the meaning instead of the word, ' +
        "or take the filter off.</p>";
    }
    return '<p class="pb-italian">' + hits.length + (hits.length === 1 ? " word" : " words") +
      (hits.length > shown.length ? ", showing the first " + shown.length : "") + ".</p>" +
      shown.map(function (r) {
        return '<button class="pb-row dict-row" data-act="dict-open" data-id="' + esc(r.word) + '">' +
          '<span class="pb-text"><span class="ar">' + esc(r.word) + "</span>" +
          '<span class="pb-en">' + esc(r.gloss) + "</span></span>" +

  }

  function dictHTML() {
    if (view.word) return dictWordHTML(view.word);
    return topbarHTML("Dictionary") +

      '<input class="pb-search" data-act="dict-search" type="text" value="' + esc(dictQuery) + '"' +

      '<div class="chips">' +
      '<button class="pill pill--md chip' + (dictKindKey === "all" ? " is-on" : "") +
      '" data-act="dict-kind" data-id="all">All</button>' +
      KINDS.map(function (k) {
        return '<button class="pill pill--md chip' + (dictKindKey === k.key ? " is-on" : "") +
          '" data-act="dict-kind" data-id="' + k.key + '">' + esc(k.label) + "</button>";
      }).join("") + "</div>" +
      '<div data-dict aria-live="polite">' + dictRowsHTML() + "</div>";
  }

  function wordPool(r) {
    var want = {};
    r.lines.forEach(function (ar) { want[ar] = true; });
    return studied().filter(function (it) { return want[it.ar]; });
  }

  function dictWordHTML(word) {
    var r = dictIndex().by[word];
    if (!r) { view = { name: "dict" }; return dictHTML(); }
    var ready = wordPool(r).length;
    return topbarHTML(r.word) +
      '<p class="pb-lead"><b>' + esc(r.gloss) + "</b> &#183; " + esc(kindLabel(r.kind)) +
      (r.lev ? " &#183; a Levantine word" : "") + "</p>" +
      '<div class="pb-group"><h3>' + r.lines.length +
      (r.lines.length === 1 ? " line in the course" : " lines in the course") + "</h3>" +
      r.lines.map(function (ar) {
        return '<div class="pb-row">' + sayBtn(ar, true) +
          '<span class="pb-text"><span class="ar">' + esc(disp(ar)) + "</span>" +
          '<span class="pb-en">' + esc(englishFor(ar)) + "</span></span>" + standingHTML(ar) + "</div>";
      }).join("") + "</div>" +
      (ready >= 3
        ? '<div class="btn-row"><button class="btn" data-act="dict-drill" data-id="' + esc(r.word) +
          '">Build a session from these</button></div>' +
          '<p class="fold-lead">' + ready + " of them are in lessons you have passed.</p>"
        : '<p class="fold-lead">A session out of one word needs three of its lines from lessons ' +
          "you have passed. You have " + ready + " so far.</p>");
  }

  function wordDrill(word) {
    var r = dictIndex().by[word];
    if (!r) return null;
    var pool = wordPool(r);
    if (pool.length < 3) return null;
    var types = askingGames();
    if (!types.length) types = ["quiz"];
    var picked = [];
    shuffle(pool).forEach(function (item) {
      if (picked.length >= reviewRounds()) return;
      var options = typeFor(item, types);
      for (var i = 0; i < options.length; i++) {
        var made = makeRound(item.lesson, item, options[i]);
        if (made) { picked.push(made); return; }
      }
    });
    if (picked.length < 3) return null;
    return newSession({ isReview: true, word: word, reviewPool: pool.length, tasks: picked });
  }

  function phrasebookHTML() {
    return topbarHTML("Phrasebook") +
      '<p class="pb-lead">The lines worth having to hand, and a search that reaches every phrase in the course. Nothing here is locked, and the speaker works on every one.</p>' +
      '<input class="pb-search" data-act="search" type="text" value="' + esc(pbQuery) + '"' +
      ' placeholder="Search in English, Arabic or Italian" autocomplete="off" autocorrect="off"' +
      ' autocapitalize="off" spellcheck="false" aria-label="Search every phrase in the course">' +
      (italianFor(normalise(pbQuery)).length
        ? '<p class="pb-italian">Italian works too: <b>' + esc(pbQuery.trim()) + "</b> is being read as <b>" +
          esc(italianFor(normalise(pbQuery)).join(", ")) + "</b>.</p>"
        : '<p class="pb-italian">English, Arabic, or Italian: <b>acqua</b>, <b>dove</b>, <b>quanto costa</b>.</p>') +
      '<div data-results aria-live="polite">' + phrasebookResults() + "</div>";
  }

  // The keys carry a suffix where Italian has one word for two English
  // ones; the suffix is never typed, so it is stripped before matching.
  //
  // Two rules learned the hard way. An exact word beats a prefix, or
  // typing "chi" (who) drags in chiamare, chiave and chiamo. And a
  // multi-word query is tried whole and word by word, or "per favore"
  // and "quanto costa" - which this app suggests itself - find nothing.
  function italianFor(q) {
    var tries = [q];
    if (q.indexOf(" ") !== -1) {
      tries.push(q.replace(/ /g, ""));
      q.split(" ").forEach(function (w) { if (w.length >= 3) tries.push(w); });
    }
    var exact = [], pre = [];
    tries.forEach(function (t) {
      Object.keys(ITALIAN).forEach(function (k) {
        var word = k.split("_")[0];
        var v = ITALIAN[k];
        if (word === t) { if (exact.indexOf(v) === -1) exact.push(v); return; }
        if (t.length >= 3 && word.indexOf(t) === 0 && pre.indexOf(v) === -1) pre.push(v);
      });
    });
    return exact.length ? exact : pre;
  }

  // "he" is inside hello, where, here, the and head. A gloss matches an
  // Italian word only when the English word is a word.
  function hasWord(hay, needle) {
    var at = hay.indexOf(needle);
    while (at !== -1) {
      var before = at === 0 ? " " : hay.charAt(at - 1);
      var after = at + needle.length >= hay.length ? " " : hay.charAt(at + needle.length);
      if (!/[a-z]/.test(before) && !/[a-z]/.test(after)) return true;
      at = hay.indexOf(needle, at + 1);
    }
    return false;
  }

  function phrasebookResults() {
    var q = normalise(pbQuery);
    var viaItalian = q ? italianFor(q) : [];
    var groups = "", hits = 0;

    function matches(ar, en) {
      if (!q) return true;
      if (normalise(ar).indexOf(q) !== -1) return true;
      if (normalise(en).indexOf(q) !== -1) return true;
      for (var i = 0; i < viaItalian.length; i++) {
        if (hasWord(normalise(en), viaItalian[i])) return true;
      }
      return false;
    }

    PHRASEBOOK.forEach(function (group) {
      var rows = "";
      group.lines.forEach(function (ar) {
        var en = englishFor(ar);
        if (!matches(ar, en)) return;
        hits++;
        rows += '<div class="pb-row">' + sayBtn(ar, true) +
          '<span class="pb-text"><span class="ar">' + esc(disp(ar)) + "</span>" +
          '<span class="pb-en">' + esc(en) + "</span></span>" + standingHTML(ar) + "</div>";
      });
      if (rows) groups += '<div class="pb-group"><h3>' + esc(group.title) + "</h3>" + rows + "</div>";
    });

    // A search runs on past the phrasebook, into every phrase and every
    // line of dialogue in the course.
    var more = "";
    if (q) {
      var shown = {};
      PHRASEBOOK.forEach(function (g) { g.lines.forEach(function (ar) { shown[ar] = true; }); });
      var found = courseSearch(q, shown);
      if (found.length) {
        var rest = "";
        found.slice(0, COURSE_HITS).forEach(function (item) {
          hits++;
          rest += '<div class="pb-row">' + sayBtn(item.ar, true) +
            '<span class="pb-text"><span class="ar">' + esc(disp(item.ar)) + "</span>" +
            '<span class="pb-en">' + esc(item.en) + "</span></span>" +
            '<button class="pill pill--md pb-tag" data-go="lesson" data-id="' + item.lesson.id +
            '" aria-label="Go to lesson ' + lessonNo(item.lesson) + ', ' + esc(item.lesson.title) +
            '">L' + lessonNo(item.lesson) + "</button></div>";
        });
        more = '<div class="pb-group"><h3>Elsewhere in the course</h3>' + rest + "</div>" +
          (found.length > COURSE_HITS
            ? '<p class="pb-more">' + (found.length - COURSE_HITS) +
              " more. Narrow it down a little.</p>"
            : "");
      }
    }

    return hits ? groups + more
      : '<p class="pb-empty">Nothing matches &ldquo;' + esc(pbQuery) + "&rdquo;.</p>";
  }

  /* ============================================================
     MAKING SENTENCES THE COURSE NEVER TAUGHT YOU

     Ten patterns, each one lifted from a phrase the lessons already
     teach, with the last word taken out. Into the gap goes any word
     you have been taught. Nothing here is generated: the patterns and
     the words that may fill them were gone through by hand, and the
     script of each stem is cut from the taught phrase it came from.
     ============================================================ */

  var FRAMES = [
    { stem: "Urìd", ar: "أُرِيدُ", en: "I want ___", needs: 9,
      words: ["Shày", "Qàhwa", "ʿAsìr", "Khubz", "Àruzz", "Làhm", "Dajàj", "Sàmak",
        "Tàdhkara", "Ghùrfa", "Sayyàra", "Dàrraja", "Kitàb", "Hàtif", "Dawà'", "Haqìba", "Sàʿa"] },

    { stem: "Ahtàj", ar: "أَحْتَاجُ", en: "I need ___", needs: 16,
      words: ["Dawà'", "Tàksi", "Ghùrfa", "Tàdhkara", "Nùqud", "Mà'", "Kùrsi",
        "Hàtif", "Sayyàra", "Haqìba", "Kitàb"] },

    { stem: "ʿÌndi", ar: "عِنْدِي", en: "I have ___", needs: 7,
      dia: { lev: ["ʿÀndi", "عندي"] },
      words: ["Qìtta", "Kalb", "Hisàn", "Àrnab", "Sayyàra", "Dàrraja", "Kitàb", "Hàtif",
        "Sàʿa", "Tàdhkara", "Ghùrfa", "Nùqud", "Haqìba", "Kùrsi", "Tàwila", "Sarìr", "Dawà'"] },

    { stem: "Àina", ar: "أَيْنَ", en: "Where is ___?", needs: 10, q: true,
      dia: { lev: ["Wèin", "وين"] },
      words: ["Al-fùnduq", "Al-matàr", "Al-qitàr", "Al-hàfila", "Al-bàit", "Al-màtbakh",
        "Al-bàb", "Al-mìftah", "Al-màktab", "As-sùq", "Al-mìtro", "Ash-shùbbak"] },

    { stem: "Ùhib", ar: "أُحِبُّ", en: "I like ___", needs: 14,
      words: ["Ar-rabìʿ", "As-sàif", "Al-kharìf", "Ash-shità", "Ash-shàms",
        "Al-màtar", "Ath-thàlj", "As-sàfar", "As-sùq"] },

    { stem: "Àkul", ar: "آكُلُ", en: "I eat ___", needs: 16,
      words: ["Khubz", "Àruzz", "Làhm", "Dajàj", "Sàmak"] },

    { stem: "Àshrab", ar: "أَشْرَبُ", en: "I drink ___", needs: 16,
      words: ["Mà'", "Shày", "Qàhwa", "ʿAsìr"] },

    { stem: "Àdhhab ilà", ar: "أَذْهَبُ إِلَى", en: "I am going to ___", needs: 16,
      dia: { lev: ["Bròh", "بروح", "ʿ", "ع"] },
      words: ["Al-fùnduq", "Al-matàr", "As-sùq", "Al-màktab", "Al-bàit"] },

    { stem: "Khudhni ilà", ar: "خُذْنِي إِلَى", en: "Take me to ___", needs: 26,
      dia: { lev: ["Khùdni", "خدني", "ʿ", "ع"] },
      words: ["Al-fùnduq", "Al-matàr", "Al-bàit", "As-sùq", "Al-màktab", "Al-mìtro"] },

    { stem: "Bikàm ilà", ar: "بِكَمْ إِلَى", en: "How much to ___?", needs: 26, q: true,
      dia: { lev: ["Addèsh", "قديش", "ʿ", "ع"] },
      words: ["Al-fùnduq", "Al-matàr", "Al-bàit", "As-sùq", "Al-màktab", "Al-mìtro"] },

    // Every frame above says something about you. These three ask the
    // person in front of you something, which is the half of a
    // conversation the course could not start.
    { stem: "Hal ʿìndak", ar: "هَلْ عِنْدَكَ", en: "Do you have ___?", needs: 11, q: true,
      dia: { lev: ["ʿÀndak", "عندك"] },
      words: ["Shày", "Qàhwa", "Mà'", "ʿAsìr", "Khubz", "Tàdhkara", "Ghùrfa", "Dawà'",
        "Nùqud", "Hàtif", "Kitàb", "Sayyàra", "Kùrsi", "Tàwila", "Sàʿa", "Haqìba",
        "Qìtta", "Kalb", "Dàrraja", "Tàksi"] },

    { stem: "Hal turìd", ar: "هَلْ تُرِيدُ", en: "Would you like ___?", needs: 5, q: true,
      dia: { lev: ["Bìddak", "بدك"] },
      words: ["Qàhwa", "Mà'", "ʿAsìr", "Khubz", "Àruzz", "Dajàj", "Sàmak", "Làhm",
        "Tàdhkara", "Ghùrfa", "Dawà'"] },

    { stem: "Hal tùhib", ar: "هَلْ تُحِبُّ", en: "Do you like ___?", needs: 13, q: true,
      dia: { lev: ["Bthèbb", "بتحب"] },
      words: ["Ar-rabìʿ", "As-sàif", "Al-kharìf", "Ash-shità", "Ash-shàms",
        "Al-màtar", "Ath-thàlj", "As-sàfar", "As-sùq", "Al-mìtro", "Al-qitàr"] }
  ];

  // A word taught on its own is written with a capital. Dropped into a
  // sentence it is not the first word any more.
  function midSentence(w) {
    return String(w).replace(/[A-Za-z\u00c0-\u024f]/, function (ch) { return ch.toLowerCase(); });
  }

  var TAUGHT_STARTS = null, TAUGHT_KEY = null;

  // Everything the course says outright, in the Arabic you are reading
  // it in: a sentence that collides with a taught phrase on screen is a
  // collision even when the two keys differ.
  function taughtStarts() {
    var key = variety();
    if (TAUGHT_STARTS && TAUGHT_KEY === key) return TAUGHT_STARTS;
    TAUGHT_KEY = key;
    TAUGHT_STARTS = [];
    var push = function (ar) {
      if (!ar) return;
      TAUGHT_STARTS.push(ar);
      var shown = disp(ar);
      if (shown !== ar) TAUGHT_STARTS.push(shown);
    };
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) { push(p.ar); });
      (l.dialogue || []).forEach(function (d) { push(d.ask); push(d.reply); });
    });
    return TAUGHT_STARTS;
  }

  // A combination that the course already says outright is not a new
  // sentence, so it never comes up here.
  function alreadyTaught(plain) {
    return taughtStarts().some(function (k) { return k.indexOf(plain) === 0; });
  }

  var WORD_LESSON = null;

  function lessonTeaching(ar) {
    if (!WORD_LESSON) {
      WORD_LESSON = {};
      LESSONS.forEach(function (l) {
        l.phrases.forEach(function (p) { if (!WORD_LESSON[p.ar]) WORD_LESSON[p.ar] = l.id; });
        // A line taught only inside a dialogue is still taught, and
        // whatever you do with it should count for the lesson it is in.
        (l.dialogue || []).forEach(function (d) {
          if (!WORD_LESSON[d.ask]) WORD_LESSON[d.ask] = l.id;
          if (!WORD_LESSON[d.reply]) WORD_LESSON[d.reply] = l.id;
        });
      });
    }
    return WORD_LESSON[ar] || null;
  }

  // Only patterns and words from lessons you have passed, so the screen
  // never asks you for a word you have not met.
  var COMBOS = null, COMBOS_TICK = "";

  function combos() {
    var key = cacheKey();
    if (COMBOS && COMBOS_TICK === key) return COMBOS;
    COMBOS_TICK = key;
    COMBOS = combosNow();
    return COMBOS;
  }

  function combosNow() {
    var done = {};
    finishedLessons().forEach(function (l) { done[l.id] = true; });
    var out = [];
    FRAMES.forEach(function (f) {
      if (!done[f.needs]) return;
      if (isPassive(f.stem)) return;
      f.words.forEach(function (w) {
        if (!SCRIPT[w] || isPassive(w)) return;
        var lid = lessonTeaching(w);
        if (!lid || !done[lid]) return;
        if (alreadyTaught(f.stem + " " + midSentence(w))) return;
        out.push({ frame: f, word: w });
      });
    });
    return out;
  }

  // Half in one Arabic and half in another would be nonsense, so a
  // dialect sentence is only built when both halves have a form in it.
  function compose(c) {
    var f = c.frame, w = c.word;
    // A frame whose stem is not itself a taught phrase carries its own
    // dialect form, so the pattern can come out in your Arabic too.
    var ds = (f.dia && f.dia[variety()]) || dialectPart(f.stem);
    var dw = dialectPart(w);
    var both = !!(ds && dw);
    var stemT = both ? ds[0] : f.stem, stemS = both ? ds[1] : f.ar;
    var wordT = midSentence(both ? dw[0] : w), wordS = both ? dw[1] : SCRIPT[w];
    // Some dialect stems glue a letter onto the word that follows:
    // ʿa plus al-funduq is ʿal-funduq, written as one.
    var glueT = (both && ds[2]) || "", glueS = (both && ds[3]) || "";
    var ar = stemT + " " + glueT + wordT + (f.q ? "?" : "");
    MADE[ar] = stemS + " " + glueS + wordS + (f.q ? "؟" : "");
    return {
      ar: ar,
      en: f.en.replace("___", (englishFor(w) || w).toLowerCase()),
      pattern: stemT + " …",
      patternEn: f.en.replace("___", "…"),
      msa: !both
    };
  }

  // Make a sentence gives you a different pattern every time, which is
  // the opposite of how a structure becomes automatic. This is the drill
  // that does the other thing: one frame, five words through it, out
  // loud, unmarked, as fast as you can say them.
  var RUN_WORDS = 5;
  var frameRun = null;

  function frameRunnable() {
    var by = {};
    combos().forEach(function (c) {
      if (!by[c.frame.stem]) by[c.frame.stem] = [];
      by[c.frame.stem].push(c);
    });
    return Object.keys(by).filter(function (k) { return by[k].length >= RUN_WORDS; })
      .map(function (k) { return by[k]; });
  }

  function newFrameRun(prev) {
    var pools = frameRunnable();
    if (!pools.length) return null;
    var pool = shuffle(pools)[0];
    if (prev && pools.length > 1) {
      var g = 0;
      while (g++ < 6 && pool[0].frame === prev.frame) pool = shuffle(pools)[0];
    }
    return {
      frame: pool[0].frame,
      list: shuffle(pool).slice(0, RUN_WORDS).map(compose),
      i: 0,
      shown: false,
      done: false,
      startedAt: null
    };
  }

  function frameRunHTML() {
    if (!frameRun) {
      return topbarHTML("One pattern, five words") +
        '<p class="pb-lead">Pass a couple of lessons first: this needs a pattern and five words ' +
        "you have both met.</p>" +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }
    var r = frameRun;
    var f = r.frame;

    if (r.done) {
      var secs = r.startedAt ? Math.round((Date.now() - r.startedAt) / 1000) : null;
      return topbarHTML("One pattern, five words") +
        '<div class="card result fade-in"><div class="eyebrow">Run over</div>' +
        '<div class="result-score mono review">' + r.list.length + "</div>" +
        '<p class="result-line">' + (secs !== null ? "Five in " + secs + " seconds. " : "") +
        "Nothing was marked. A pattern is automatic when you stop assembling it.</p></div>" +
        '<div class="btn-row"><button class="btn btn-ghost" data-go="home">Home</button>' +
        '<button class="btn" data-act="frame-again">Another pattern</button></div>';
    }

    var s2 = r.list[r.i];
    return topbarHTML("One pattern, five words", Math.round(r.i / r.list.length * 100),
      (r.i + 1) + " / " + r.list.length) +
      '<div class="prompt">' +
      '<div class="prompt-label">' + esc(f.en.replace("___", "…")) + "</div>" +
      '<div class="prompt-main">' + esc(s2.en) + "</div>" +
      '<div class="prompt-sub">say the whole thing out loud, then check yourself</div>' +
      "</div>" +
      (r.shown
        ? '<div class="verdict" tabindex="-1"><div class="verdict-msg ok">' +
          '<span class="ar">' + esc(s2.ar) + "</span>" + sayBtn(s2.ar, true) + "</div>" +
          '<button class="btn btn-wide" data-act="frame-next">' +
          (r.i === r.list.length - 1 ? "That is five" : "Next word") + "</button></div>"
        : '<div class="btn-row"><button class="btn btn-wide" data-act="frame-show">Say it, then show me</button></div>') +
      '<p class="one-note">Same pattern all five times. Nothing here is scored.</p>';
  }

  function newMake(prev) {
    var full = combos();
    var pool = full;
    if (!pool.length) return null;

    // Half the dialects only cover a handful of these words. Lean toward
    // the ones that do come out in your dialect, without shutting out
    // the rest, which fall back to fus·ha and say so.
    if (variety() !== "msa") {
      var native = pool.filter(function (o) {
        return ((o.frame.dia && o.frame.dia[variety()]) || dialectPart(o.frame.stem)) && dialectPart(o.word);
      });
      if (native.length && Math.random() < 0.5) pool = native;
    }

    var c = shuffle(pool)[0];
    if (prev && pool.length > 1) {
      var g = 0;
      while (g++ < 8 && c.frame === prev.c.frame && c.word === prev.c.word) c = shuffle(pool)[0];
    }
    var s = compose(c);

    // Producing a sentence and understanding one are two different
    // skills, and the second is the one you need most of the time.
    // They take turns.
    var hear = !!(canSpeak() && prev && !prev.hear);

    var m = {
      c: c,
      s: s,
      hear: hear,
      played: false,
      checked: false,
      right: false,
      hint: false,
      got: prev ? prev.got : 0,
      run: prev ? prev.run : 0
    };

    if (hear) {
      // One wrong answer keeps the pattern and changes the word, the
      // other keeps the word and changes the pattern, so hearing half
      // the sentence is not enough.
      var wrong = [];
      function offer(list) {
        var pick = shuffle(list)[0];
        if (!pick) return;
        var en = compose(pick).en;
        if (en !== s.en && wrong.indexOf(en) === -1) wrong.push(en);
      }
      offer(full.filter(function (o) { return o.frame === c.frame && o.word !== c.word; }));
      offer(full.filter(function (o) { return o.word === c.word && o.frame !== c.frame; }));
      var guard = 0;
      while (wrong.length < 3 && guard++ < 40) offer(full);
      m.options = shuffle(wrong.slice(0, 3).concat([s.en]));
      m.chosen = null;
      return m;
    }

    var words = tokens(s.ar);
    var extras = [];
    shuffle(pool).forEach(function (o) {
      if (extras.length >= 3 || o === c) return;
      var cand = shuffle(tokens(compose(o).ar))[0];
      if (!cand || words.indexOf(cand) !== -1 || extras.indexOf(cand) !== -1) return;
      extras.push(cand);
    });
    m.target = words;
    m.tiles = shuffle(words.concat(extras)).map(function (word, i) { return { id: i, word: word }; });
    m.picked = [];
    return m;
  }

  // The sentence is new, but the word in it is one the course taught,
  // and putting it into a sentence of your own is the strongest kind of
  // practice there is.
  function scoreMade() {
    var w = made.c.word;
    var lid = lessonTeaching(w);
    if (!lid) return;
    bumpStrength(lid, w, true);
    save();
  }

  function answerMake(en) {
    if (!made || made.checked || !made.hear) return;
    made.chosen = en;
    made.right = en === made.s.en;
    made.checked = true;
    made.run += 1;
    if (made.right) { made.got += 1; scoreMade(); }
    render();
  }

  function checkMake() {
    if (!made || made.checked) return;
    var said = made.picked.map(function (id) { return made.tiles[id].word; }).join(" ");
    made.right = normalise(said) === normalise(made.target.join(" "));
    made.checked = true;
    made.run += 1;
    if (made.right) {
      made.got += 1;
      scoreMade();
      speak(made.s.ar);
    }
    render();
  }

  // The made sentence read out with nothing on screen: the only place
  // in the app where you meet a sentence the way you will meet it in
  // the street, with no English in front of it.
  function makeHearHTML(m) {
    var opts = '<div class="options">' + m.options.map(function (opt, i) {
      var cls = "option";
      var state = "";
      if (m.checked) {
        if (opt === m.s.en) { cls += " is-right"; state = "Correct answer"; }
        else if (opt === m.chosen) { cls += " is-wrong"; state = "Your answer, incorrect"; }
        else cls += " is-dim";
      }
      return '<button class="' + cls + '" data-act="make-answer" data-value="' + esc(opt) + '"' +
        (m.checked ? " disabled" : "") + ">" +
        '<span class="option-key">' + (i + 1) + "</span><span>" + esc(opt) + "</span>" +
        (state ? '<span class="sr-only">, ' + state + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    return topbarHTML("Make a sentence", null, m.run ? m.got + "/" + m.run : "") +
      '<p class="pb-lead">Same sentences, the other way round. Nothing is written down: you get it by ear or not at all.</p>' +
      '<div class="prompt"><div class="prompt-label">Listen, then choose the meaning</div>' +
      '<div class="listen-stage">' +
      '<button class="say say-lg" data-act="say" data-say="' + esc(m.s.ar) + '"' +
      ' aria-label="Play it again">' + SPEAKER_SVG + "</button></div>" +
      '<div class="prompt-sub">' +
      (m.checked ? '<span class="ar">' + esc(m.s.ar) + "</span>" : "tap to hear it again") +
      "</div></div>" +
      opts +
      (m.checked
        ? '<div class="verdict" tabindex="-1">' +
          (m.right
            ? '<div class="verdict-msg ok"><b>Correct.</b></div>'
            : '<div class="verdict-msg no"><b>Not quite.</b>&nbsp;<span>' + esc(m.s.en) + "</span></div>") +
          (glossesFor(m.s.ar).length ? '<div class="why">' + glossHTML(m.s.ar) + "</div>" : "") +
          '<button class="btn btn-wide" data-act="make-next">Another one</button></div>'
        : "");
  }

  function makeHTML() {
    if (!made) {
      return topbarHTML("Make a sentence") +
        '<p class="pb-lead">This is where you stop repeating the course and start speaking. ' +
        'Pass a lesson or two first: the patterns and the words both have to be ones you have met.</p>' +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }

    var m = made;
    if (m.hear) return makeHearHTML(m);

    var slotCls = "slot" + (m.picked.length ? "" : " is-empty") +
      (m.checked ? (m.right ? " is-right" : " is-wrong") : "");

    var slot = m.picked.map(function (id) {
      return '<button class="tile in-slot" data-act="make-unpick" data-id="' + id + '"' +
        (m.checked ? " disabled" : "") + ">" + esc(m.tiles[id].word) + "</button>";
    }).join("");

    var bank = m.tiles.map(function (tile) {
      var spent = m.picked.indexOf(tile.id) !== -1;
      return '<button class="tile' + (spent ? " is-spent" : "") + '" data-act="make-pick" data-id="' +
        tile.id + '"' + (spent || m.checked ? " disabled" : "") +
        (spent ? ' tabindex="-1" aria-hidden="true"' : "") + ">" + esc(tile.word) + "</button>";
    }).join("");

    var sub = m.hint || m.checked
      ? '<div class="prompt-sub"><span class="ar">' + esc(m.s.pattern) + "</span> = " +
        esc(m.s.patternEn) + "</div>"
      : '<div class="prompt-sub"><button class="peek" data-act="make-hint">Give me the pattern</button></div>';

    var body;
    if (m.checked) {
      var gloss = glossesFor(m.s.ar).length ? '<div class="why">' + glossHTML(m.s.ar) + "</div>" : "";
      body = '<div class="verdict" tabindex="-1">' +
        (m.right
          ? '<div class="verdict-msg ok"><b>Correct.</b>&nbsp;<span class="ar">' + esc(m.s.ar) + "</span>" +
            sayBtn(m.s.ar, true) + "</div>"
          : '<div class="verdict-msg no"><b>Not quite.</b>&nbsp;<span class="ar">' +
            esc(m.target.join(" ")) + "</span>" + sayBtn(m.s.ar, true) + "</div>") +
        gloss +
        (m.s.msa && variety() !== "msa"
          ? '<p class="make-note">No ' + esc(varietyInfo().label) + ' form for one of these words, so this one is in fus&#183;ha.</p>'
          : "") +
        '<button class="btn btn-wide" data-act="make-next">Another one</button></div>';
    } else {
      body = '<div class="btn-row"><button class="btn btn-wide" data-act="make-check"' +
        (m.picked.length === m.target.length ? "" : " disabled") + ">Check</button></div>";
    }

    return topbarHTML("Make a sentence", null, m.run ? m.got + "/" + m.run : "") +
      '<p class="pb-lead">Not one of these is a phrase from the lessons. Each is a pattern you have been taught ' +
      'with a word you have been taught dropped into it, which is how you will actually speak.</p>' +
      '<div class="prompt"><div class="prompt-label">Say this in Arabic</div>' +
      '<div class="prompt-main">' + esc(m.s.en) + "</div>" + sub + "</div>" +
      '<div class="' + slotCls + '">' + slot + "</div>" +
      '<div class="bank">' + bank + "</div>" +
      body;
  }

  /* ============================================================
     YOUR OWN ANSWERS

     Four questions come up in every first conversation, and the course
     answers all four for a man called Marco. Tell it who you are and it
     answers them for you instead, everywhere: on the flashcard, in the
     games, in the conversations. The phrase keys never change, so your
     progress is untouched by changing your mind about your job.
     ============================================================ */

  var COUNTRIES = [
    { key: "it", en: "Italy", ar: "Itàlya", s: "إِيطَالْيَا" },
    { key: "fr", en: "France", ar: "Faransa", s: "فَرَنْسَا" },
    { key: "es", en: "Spain", ar: "Isbànya", s: "إِسْبَانْيَا" },
    { key: "de", en: "Germany", ar: "Almànya", s: "أَلْمَانْيَا" },

  // Thirteen to nineteen are not in the course and their agreement is a
  // trap, so they are left alone rather than guessed at.
  function numberWords(n, dialect) {
    n = Math.floor(Number(n));
    if (!(n > 0)) return null;
    var lev = dialect === "lev";
    var tens = lev ? TENS_LEV : TENS, units = lev ? UNITS_LEV : UNITS;
    var join = lev ? " w " : " wa ";
    var joinS = lev ? " و" : " وَ";
    var pick = function (table, fallback, k) { return table[k] || fallback[k] || null; };
    if (n <= 12 || n % 10 === 0 || n === 100) {
      if (tens[n] || TENS[n]) return pick(tens, TENS, n);
      if (n < 10) return pick(units, UNITS, n);
    }
    if (n < 20 || n > 99) return null;
    var unit = pick(units, UNITS, n % 10), ten = pick(tens, TENS, Math.floor(n / 10) * 10);
    if (!unit || !ten) return null;
    return { ar: unit.ar + join + ten.ar, s: unit.s + joinS + ten.s };
  }

  // A name is the one thing here the course cannot have taught. Letter
  // by letter into Arabic, long vowels throughout, which is how names
  // are written in Arabic anyway. It is a guide for the speaker, and
  // you never see it.
  var LETTERS = {
    a: "ا", b: "ب", c: "ك", d: "د", e: "ي", f: "ف", g: "ج", h: "ه", i: "ي",
    j: "ج", k: "ك", l: "ل", m: "م", n: "ن", o: "و", p: "ب", q: "ق", r: "ر",
    s: "س", t: "ت", u: "و", v: "ف", w: "و", x: "كس", y: "ي", z: "ز"
  };

  var PAIRS = { kh: "خ", sh: "ش", th: "ث", ch: "تش", gh: "غ", ph: "ف", ck: "ك", qu: "كو" };

  function nameScript(name) {
    var w = String(name || "").toLowerCase()
      .replace(/[àáâä]/g, "a").replace(/[èéêë]/g, "e").replace(/[ìíîï]/g, "i")
      .replace(/[òóôö]/g, "o").replace(/[ùúûü]/g, "u").replace(/ç/g, "s")
      .replace(/[^a-z ]/g, "");
    var out = "", i = 0;
    while (i < w.length) {
      var two = w.slice(i, i + 2);
      if (PAIRS[two]) { out += PAIRS[two]; i += 2; continue; }
      var ch = w.charAt(i);
      if (ch === " ") { out += " "; i++; continue; }
      if (ch === w.charAt(i + 1)) { i++; continue; }   // a doubled letter is written once
      out += LETTERS[ch] || "";
      i++;
    }
    return out.trim();
  }

  // A situation is worth asking once you have passed a lesson that can
  // answer it. Which lesson that is comes from the answers themselves.
  function momentOpen(m) {
    return m.ok.some(function (ar) {
      if (isPassive(ar)) return false;
      var lid = lessonTeaching(ar);
      var r = lid && recordOf(lid);
      return !!(r && r.done);
    });
  }

  function openMoments() { return MOMENTS.filter(momentOpen); }

  function newMoment(prev) {
    var pool = openMoments();
    if (!pool.length) return null;
    var m = shuffle(pool)[0];
    if (prev && pool.length > 1) {
      var g = 0;
      while (g++ < 8 && m === prev.m) m = shuffle(pool)[0];
    }
    return {
      m: m,
      typed: "",
      heard: null,
      checked: false,
      right: false,
      matched: null,
      spoken: false,
      shown: false,
      got: prev ? prev.got : 0,
      run: prev ? prev.run : 0
    };
  }

  // Anything on the list counts, in the spelling you have been shown or
  // in the fus·ha underneath it.
  function momentMatch(typed) {
    if (!normalise(typed)) return null;
    var hit = null;
    // The same judge the written rounds use: the fus-ha you know, another
    // dialect's form, and a doubled letter written single. Being stricter
    // here than in a write round was never a decision, only an omission.
    moment.m.ok.forEach(function (ar) {
      if (hit) return;
      var v = judgeTyped(typed, ar);
      if (v && v.right) hit = ar;
    });
    return hit;
  }

  // Some situations have an answer that is perfectly good Arabic and
  // still the wrong thing to say. Right and wrong is not the useful
  // verdict there.
  function momentMisfire(typed) {
    if (!normalise(typed) || !moment.m.no) return null;
    var hit = null;
    moment.m.no.forEach(function (ar) {
      if (hit) return;
      var v = judgeTyped(typed, ar);
      if (v && v.right) hit = ar;
    });
    return hit;
  }

  // More than one answer is right, so the microphone is judged against
  // all of them and keeps the best.
  // Saying the fus-ha form of a right answer out loud is saying a right
  // answer, whichever variety is on screen.
  function heardMoment(list) {
    var best = { text: (list && list[0]) || "", score: 0, ar: null, exact: false };
    (list || []).forEach(function (said) {
      moment.m.ok.forEach(function (ar) {
        [spk(ar), SCRIPT[ar]].forEach(function (form) {
          if (!form) return;
          var sc = heardScore(said, form);
          // Two of the right answers can be the same phrase to a man and
          // to a woman, one letter apart. What was actually said has to
          // beat what merely sounds like it, or the masculine answers
          // for both and the woman is told she said something else.
          var exact = said === form;
          if ((exact && !best.exact) || (exact === best.exact && sc > best.score)) {
            best = { text: said, score: sc, ar: ar, exact: exact };
          }
        });
      });
    });
    return best;
  }

  function settleMoment(right, matched) {
    moment.matched = matched || null;
    moment.right = !!right;
    moment.checked = true;
    moment.run += 1;
    if (!right) return;
    moment.got += 1;
    var lid = lessonTeaching(matched);
    if (lid) bumpStrength(lid, matched, true);
    save();
    speak(matched);
  }

  // Understood, and it costs you the exchange. It is not marked wrong -
  // the Arabic was right - and it does not count for the phrase either.
  function settleMisfire(ar) {
    moment.matched = null;
    moment.misfire = ar;
    moment.right = false;
    moment.checked = true;
    moment.run += 1;
  }

  function checkMoment() {
    if (!moment || moment.checked) return;
    var field = app.querySelector('[data-act="moment-typing"]');
    if (field) moment.typed = field.value;
    if (!normalise(moment.typed)) return;
    // Producing it cold is the hardest way to remember a phrase, so it
    // counts for that phrase the same as any round does.
    var miss = momentMisfire(moment.typed);
    if (miss) { settleMisfire(miss); render(); return; }
    var hit = momentMatch(moment.typed);
    settleMoment(!!hit, hit);
    render();
  }

  function showMoment() {
    if (!moment || moment.checked) return;
    moment.shown = true;
    moment.checked = true;
    moment.run += 1;
    render();
  }

  function listenMoment() {
    if (!moment || moment.checked || ears.busy) return;
    moment.heard = null;
    moment.spoken = true;
    listenOnce(function (list) {
      var best = heardMoment(list);
      moment.heard = best;
      // Close enough to one of them is an answer, and saying it is
      // harder than typing it.
      if (best.ar && best.score >= HEARD_OK) { settleMoment(true, best.ar); return; }
      var spokenMiss = momentMisfire(best.text || "");
      if (spokenMiss) { settleMisfire(spokenMiss); render(); return; }
      render();
    }, function () { render(); }, function () { render(); });
  }

  // What it made of you, when it was not close enough to count.
  function momentHeardHTML() {
    if (!moment.heard || moment.checked) return "";
    if (!moment.heard.text) {

    }
    var near = nearestTranslit(moment.heard.text);
    return '<div class="heard">' +
      '<span class="heard-label">It heard</span>' +

      '<span class="heard-note">Not one of the answers, but recognisers are shaky on Arabic. ' +
      "Put it in the box and check it if that is what you said.</span>" +
      '<button class="pill pill--md heard-yes" data-act="moment-use" data-id="' + esc(near.text || "") + '">' +
      '<span class="tick" aria-hidden="true"></span>That is what I said</button>' +
      '<button class="pill pill--md heard-no" data-act="heard-drop">No, I will type it</button></div>';
  }

    if (!moment) {

              esc(mo.m.why || "Right Arabic, wrong moment.") + "</span></div>"
            : mo.shown
              ? '<div class="verdict-msg no"><b>Here it is.</b></div>'
              : '<div class="verdict-msg no"><b>Not one of these.</b>&nbsp;<span class="ar">' +
                esc(mo.typed) + "</span></div>") +
        answers +
        '<button class="btn btn-wide" data-act="moment-next">Another situation</button></div>'

    return topbarHTML("What would you say?", null, mo.run ? mo.got + "/" + mo.run : "") +
      '<p class="pb-lead">No English sentence to translate. Read what is happening and say something that ' +
      'works. Usually more than one thing does.</p>' +
      '<div class="prompt"><div class="prompt-label">You are here</div>' +
      '<div class="prompt-main">' + esc(mo.m.en) + "</div>" +
      '<div class="prompt-sub">in these letters, not Arabic script &#183; accents and capitals do not matter</div>' +
      "</div>" +
      '<input class="' + cls + '" data-act="moment-typing" type="text" value="' + esc(mo.typed) + '"' +
      ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +

        '<button class="btn btn-ghost" data-act="moment-show">I have no idea</button>' +
        '<button class="btn" data-act="moment-check">Check</button></div>' +
        "</div>") +
      verdict;
  }

  /* ============================================================
     ONE JOB, SEVERAL PHRASES

     The course teaches four ways to say hello and five ways to say
     goodbye, because you will hear all of them. You only ever need to
     say one. So the choice here is not learn it or drop it: it is

     recognise it". Nothing is lost either way, and a phrase you park
     still turns up in the games that test understanding, which is
     exactly what you need it for.

  var TWINS = [

  /* ---------- recognise only ---------- */

  // Keyed on the phrase itself, not on the lesson: the same words in
  // two lessons are still the one thing you have decided not to say.
  function isPassive(ar) {
    return !!(store.passive || {})[ar];
  }

  function togglePassive(ar) {
    if (!store.passive) store.passive = {};
    if (store.passive[ar]) delete store.passive[ar];
    else store.passive[ar] = true;
    save();
  }

  function passiveCount() { return Object.keys(store.passive || {}).length; }

  function unpassiveAll() { store.passive = {}; save(); }

  // Producing it and recognising it are different jobs. These are the
  // games that make you produce.
  var PRODUCING = { build: true, say: true, write: true, dialog: true, dictate: true };

  function twinReached(t) {
    return t.members.filter(function (ar) {
      var lid = lessonTeaching(ar);
      var r = lid && recordOf(lid);
      return !!(r && r.done);
    });
  }

  function openTwins() {
    return TWINS.filter(function (t) { return twinReached(t).length > 1; });
  }

  // A group is still asking you to choose while more than one of the
  // phrases you have reached is in full rotation.
  function twinsToDecide() {
    return openTwins().filter(function (t) {
      return twinReached(t).filter(function (ar) { return !isPassive(ar); }).length > 1;
    });
  }

  function keepOnly(t, keep) {
    if (!store.passive) store.passive = {};
    twinReached(t).forEach(function (ar) {
      if (ar === keep) delete store.passive[ar];
      else store.passive[ar] = true;
    });
    save();
  }

  function twinsHTML() {
    var open = openTwins();
    if (!open.length) {
      return topbarHTML("One job, several phrases") +
        '<p class="pb-lead">The course teaches four ways to say hello and five ways to say goodbye, because you ' +
        'will hear all of them. You only need to say one. Pass a couple of lessons and the choices turn up here.</p>' +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }

    var groups = open.map(function (t) {
      var reached = twinReached(t);
      var live = reached.filter(function (ar) { return !isPassive(ar); });
      var keep = reached.indexOf(t.keep) !== -1 ? t.keep : reached[0];

      var rows = reached.map(function (ar) {
        var off = isPassive(ar);
        var note = noteFor(ar);
        return '<div class="twin' + (off ? " is-off" : "") + (ar === t.keep ? " is-pick" : "") + '">' +
          '<div class="twin-line">' + sayBtn(ar, true) +
          '<span class="pb-text"><span class="ar">' + esc(disp(ar)) + "</span>" +
          '<span class="pb-en">' + esc(englishFor(ar) || "") + "</span></span>" +

      return '<div class="pb-group twin-group"><h3>' + esc(t.title) + "</h3>" +
        '<p class="fold-lead">' + esc(t.why) + "</p>" + rows +
        (live.length > 1

    return topbarHTML("One job, several phrases") +
      '<p class="pb-lead">Several phrases here do the same job. Keep the one you will actually say and put the ' +
      'others on <b>recognise only</b>: they stop asking you to produce them, and go on turning up in the games ' +
      'that test whether you understood. Nothing is deleted, and you can undo any of it here or in Your words.</p>' +
      groups +
      (passiveCount()
        ? '<div class="btn-row"><button class="btn btn-ghost" data-act="unpassive-all">Put them all back in rotation</button></div>'
        : "");
  }

  /* ============================================================
     WHAT ARE THEY ASKING?

     In a real conversation you do not catch the whole question. You
     catch the word at the front of it and work out the rest from where
     you are standing. Àina and you look around; kam and you reach for
     your wallet; hal and a nod will do. This drill asks for nothing
     else: not what the sentence means, only what is being asked of
     you.
     ============================================================ */

  // The giveaway word is not the same word in every Arabic, and naming
  // the fus-ha one after a question you heard in Levantine would be a
  // lie about what you just listened to.
  /* ============================================================
     WAS THAT A YES?

     The course teaches twenty ways of answering and never once asks
     you to tell them apart. In the conversation this app exists for,
     understanding a soft no is the single most useful thing you can
     do: it is the difference between leaving well and not noticing.
     Nothing here is new material. Every line is already taught.
     ============================================================ */

  var SIDES = [
    { key: "yes", en: "A yes" },
    { key: "maybe", en: "A maybe" },
    { key: "no", en: "A no" }
  ];

  var REPLIES = [
    { ar: "Bikùll surùr", side: "yes" },
    { ar: "Bi at-ta'kìd", side: "yes" },
    { ar: "Anà muwàfiq", side: "yes" },
    { ar: "Là màniʿ", side: "yes", note: "Literally <i>no objection</i>, and it is a yes, not a shrug." },
    { ar: "Anà mustaʿìdd", side: "yes" },
    { ar: "Sa'akùn hunàk", side: "yes" },
    { ar: "Kamà turìd", side: "yes", note: "As you like: a yes that hands the choice back to you." },
    { ar: "Naʿam, ʿìndi", side: "yes" },
    { ar: "Al-àn munàsib", side: "yes" },
    { ar: "Tàyyib", side: "yes", note: "All right. Agreement, but a mild one: it accepts what was said rather than welcoming it." },

    { ar: "Rùbbama fi màrra ùkhra", side: "maybe", also: ["no"], note: "Maybe another time. In practice this is usually a no said kindly, so either reading is right here - and taking it as a maybe is how you end up asking twice." },
    { ar: "Ìdha àmkan", side: "maybe" },
    { ar: "Sa'ufàkkir", side: "maybe", also: ["no"], note: "I will think about it. In a shop it is a no; from a person it is genuinely open, so both readings count." },
    { ar: "Inshàallah", side: "maybe", also: ["yes", "no"], note: "God willing. It can be a yes, a maybe or a polite no, and only the tone tells you which - so all three answers are right here, which is the point. If someone answers a plan with this and nothing else, do not book anything." },
    { ar: "Làhiqan", side: "maybe" },
    { ar: "Hàsab", side: "maybe" },
    { ar: "Nàuʿan mà", side: "maybe" },

    { ar: "Àsifa, anà mashghùla", side: "no", note: "The polite refusal, and the one to learn first. It is complete: it does not want a follow-up question." },
    { ar: "Àsif, là àstatìʿ", side: "no" },
    { ar: "Làisa al-àn", side: "no", note: "Not now. A no about this moment, not about you." },
    { ar: "Là, shùkran", side: "no" },
    { ar: "Là, làisa ʿìndi", side: "no" },
    { ar: "Là urìd", side: "no" }
  ];

  var ASK_KINDS = [
    { key: "where", en: "Where something is", word: "àina", lev: "wèin" },
    { key: "wherefrom", en: "Where you are from", word: "min àina", lev: "min wèin" },
    { key: "whereto", en: "Where you are going", word: "ilà àina", lev: "ʿa wèin" },
    { key: "when", en: "When", word: "matà", lev: "èmta" },
    { key: "howmuch", en: "How much, or how many", word: "kam", lev: "addèsh" },
    { key: "what", en: "What", word: "mà, màdha", lev: "shu" },
    { key: "why", en: "Why", word: "limàdha", lev: "lèish" },
    { key: "who", en: "Who", word: "man", lev: "mìn" },
    { key: "how", en: "How", word: "kèifa", lev: "kìf" },
    { key: "yesno", en: "Something you can answer yes or no", word: "hal",
      lev: "no word at all, only the tone of your voice" },
    { key: "which", en: "Which one of them", word: "ày", lev: "ày, ànu" },
    { key: "choice", en: "One or the other", word: "... am ...", lev: "... willa ..." },
    { key: "backatyou", en: "The same question, back at you", word: "wa ànta, wa ànti", lev: "w ìnta" }
  ];

  function askWord(kind) {
    var k = askKindByKey(kind);
    if (!k) return "";
    var v = variety();
    return (v !== "msa" && k[v]) || k.word;
  }

  function askKindByKey(k) {
    for (var i = 0; i < ASK_KINDS.length; i++) if (ASK_KINDS[i].key === k) return ASK_KINDS[i];
    return null;
  }

  // Off the first word alone, which is the whole point of the drill.
  // Both Arabics are recognised, because what you are listening to is
  // whichever one you chose.
  function askKind(ar, spoken) {
    if (String(ar).indexOf("?") === -1) return null;
    var w = normalise(ar).split(" ");
    if (w[0] === "lau" && (w[1] === "samaht" || w[1] === "samahti")) w = w.slice(2);
    // an apology in front of a question is the same problem as a polite
    // opener in front of one: the ear has to look past both
    if (w[0] === "asif" || w[0] === "asifa" || w[0] === "asef") w = w.slice(1);

    // Egyptian hangs the question word off the back of the sentence, and
    // every rule in here was written for a word at the front.
    var tail = w[w.length - 1];
    if (tail === "eh") return "what";
    if (tail === "fein") return "where";
    if (tail === "minein") return "wherefrom";
    if (tail === "imta" || tail === "emta") return "when";
    if (tail === "kam" || tail === "bikam" || tail === "addesh") return "howmuch";
    if (tail === "min" && w.length > 1) return "who";
    if (tail === "izzay") return "how";

    // Not every question carries a question word. The one the haggle
    // runs on is two nouns and a rising tone, and the ear has to know it
    // whole rather than off a first word that never comes.
    if (w[0] === "akhir" && w[1] === "sir") return "howmuch";

    if (w[0] === "shu") return "what";
    if (w[0] === "min" && (w[1] === "wein" || w[1] === "aina")) return "wherefrom";
    if ((w[0] === "ʿa" || w[0] === "la") && w[1] === "wein") return "whereto";
    if (w[0] === "wein") return "where";
    if (w[0] === "emta") return "when";
    if (w[0] === "min" && w[1] === "emta") return "when";
    if (w[0] === "wallah") return "yesno";
    if (w[0] === "addesh" || w[0] === "kam") return "howmuch";
    // In Levantine "mìn" is who and "min" is from; only "min wèin" is
    // the second one, and that is caught above.
    if (w[0] === "min") return "who";
    if (w[0] === "kif" || w[0] === "kifak" || w[0] === "kifik") return "how";
    if (w[0] === "leish") return "why";
    if (w[0] === "anu") return "which";
    if (w.indexOf("willa") > 0) return "choice";
    for (var j = 0; j < w.length - 1; j++) {
      if (w[j] === "w" && (w[j + 1] === "inta" || w[j + 1] === "inti")) return "backatyou";
    }
    // People put the polite opener in front of the question all the
    // time, and the ear has to look past it.
    if (w[0] === "lau" && (w[1] === "samaht" || w[1] === "samahti")) w = w.slice(2);
    if (w.indexOf("am") > 0) return "choice";
    if (w[0] === "hal") return "yesno";
    // "at what time" is a when-question wearing which's clothes
    // normalise() drops the ayn, so the hour comes through as "saa"
    if ((w[0] === "ay" || (w[0] === "fi" && w[1] === "ay")) && w.indexOf("saa") !== -1) return "when";
    if (w[0] === "ay" || (w[0] === "fi" && w[1] === "ay")) return "which";

    if (w[0] === "aina") return "where";
    if (w[0] === "min" && w[1] === "aina") return "wherefrom";
    if (w[0] === "ila" && w[1] === "aina") return "whereto";
    if (w[0] === "mata") return "when";
    if (w[0] === "mundhu" && w[1] === "mata") return "when";
    if (w[0] === "ila" && w[1] === "mata") return "when";
    if ((w[0] === "wa" || w[0] === "w") && (w[1] === "baʿd" || w[1] === "bad" || w[1] === "baʿdein" || w[1] === "badein")) return "when";
    if (w[0] === "haqqan") return "yesno";
    if (w[0] === "kam" || w[0] === "bikam") return "howmuch";
    if (w[0] === "ma" || w[0] === "madha") return "what";
    if (w[0] === "man") return "who";
    if (w[0] === "keifa") return "how";
    if (w[0] === "limadha") return "why";
    // "And you?" can come after an answer rather than open the sentence.
    for (var i = 0; i < w.length - 1; i++) {
      if (w[i] === "wa" && (w[i + 1] === "anta" || w[i + 1] === "anti")) return "backatyou";
    }
    // Neither word is a question word: the "or" in the middle is what
    // makes it one.
    if (w.indexOf("am") > 0) return "choice";
    // A dialect drops hal altogether and lets the tone do the asking, so
    // a question with no marker left in it is a yes or no question.
    if (spoken) return "yesno";
    return null;
  }

  // Every question the course has actually taught you, from wherever it
  // taught it: a phrase, a line of dialogue or a conversation.
  var ASKS = null, ASKS_TICK = "";

  function askPool() {
    var key = cacheKey();
    if (ASKS && ASKS_TICK === key) return ASKS;
    ASKS_TICK = key;
    ASKS = askPoolNow();
    return ASKS;
  }

  function askPoolNow() {
    var out = [], seen = {};
    function add(ar, en, done) {
      if (!done || !ar || seen[ar]) return;
      var heard = disp(ar);
      var kind = askKind(heard, heard !== ar);
      if (!kind || !spk(ar)) return;
      seen[ar] = true;
      out.push({ ar: ar, en: en, kind: kind });
    }
    LESSONS.forEach(function (l) {
      var r = recordOf(l.id);
      var done = !!(r && r.done);
      l.phrases.forEach(function (p) { add(p.ar, p.en, done); });
      (l.dialogue || []).forEach(function (d) { add(d.ask, d.askEn, done); });
    });
    CONVOS.forEach(function (c) {
      if (!convoOpen(c)) return;
      c.turns.forEach(function (t) { add(t.say, t.sayEn, true); });
    });
    return out;
  }

  /* ---------- was that a yes? ---------- */

  var answers = null;

  function replyPool() {
    var out = [];
    REPLIES.forEach(function (r) {
      var lid = lessonTeaching(r.ar);
      var rec = lid ? recordOf(lid) : null;
      if (rec && rec.done && !isHidden(lid, r.ar)) out.push(r);
    });
    return out;
  }

  function sideByKey(k) {
    for (var i = 0; i < SIDES.length; i++) if (SIDES[i].key === k) return SIDES[i];
    return null;
  }

  function newAnswers(prev) {
    var pool = replyPool();
    if (pool.length < 3) return null;
    var r = shuffle(pool)[0];
    if (prev && pool.length > 1) {
      var g = 0;
      while (g++ < 8 && r.ar === prev.r.ar) r = shuffle(pool)[0];
    }
    return {
      r: r,
      chosen: null,
      checked: false,
      right: false,
      run: prev ? prev.run : 0,
      got: prev ? prev.got : 0
    };
  }

  function answersPick(side) {
    if (!answers || answers.checked) return;
    answers.chosen = side;
    answers.checked = true;
    // Where the app's own note says a line can be read two ways, both
    // readings are right. Grading one of them wrong would contradict the
    // sentence printed underneath.
    answers.right = side === answers.r.side ||
      (answers.r.also || []).indexOf(side) !== -1;
    answers.run += 1;
    if (answers.right) answers.got += 1;
    render();
  }

  function answersHTML() {
    if (!answers) {
      return topbarHTML("Was that a yes?") +
        '<p class="pb-lead">Pass a few more lessons: this draws on the answers the course has ' +
        "already taught you, and there are not enough of them yet.</p>" +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }
    var a = answers;
    var heard = canSpeak();
    var opts = '<div class="options">' + SIDES.map(function (side, i) {
      var cls = "option";
      var state = "";
      if (a.checked) {
        if (side.key === a.r.side) { cls += " is-right"; state = "Correct answer"; }
        else if (side.key === a.chosen) { cls += " is-wrong"; state = "Your answer, incorrect"; }
        else cls += " is-dim";
      }
      return '<button class="' + cls + '" data-act="answers-pick" data-value="' + side.key + '"' +
        (a.checked ? " disabled" : "") + ">" +
        '<span class="option-key">' + (i + 1) + "</span><span>" + esc(side.en) + "</span>" +
        (state ? '<span class="sr-only">, ' + state + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    var stage = heard
      ? '<div class="listen-stage">' +
        '<button class="say say-lg" data-act="say" data-say="' + esc(a.r.ar) + '"' +
        ' aria-label="Play the answer again">' + SPEAKER_SVG + "</button></div>" +
        '<div class="prompt-sub">' +
        (a.checked ? '<span class="ar">' + esc(disp(a.r.ar)) + "</span>" : "tap to hear it again") + "</div>"
      : '<div class="prompt-main ar">' + esc(disp(a.r.ar)) + "</div>" +
        '<div class="prompt-sub">no Arabic voice on this device, so you get it in writing</div>';

    return topbarHTML("Was that a yes?", null, a.run ? a.got + "/" + a.run : "") +
      '<p class="pb-lead">You asked. This is the answer. Not what the words mean - only whether you are ' +
      "being said yes to, put off, or turned down, which is the one thing you have to get right.</p>" +
      '<div class="prompt"><div class="prompt-label">' +
      (heard ? "Listen to the answer" : "Read the answer") + "</div>" + stage + "</div>" +
      opts +
      (a.checked
        ? '<div class="verdict" tabindex="-1">' +
          (a.right
            ? '<div class="verdict-msg ok"><b>Yes, that is ' +
              esc(sideByKey(a.chosen === a.r.side ? a.r.side : a.chosen).en.toLowerCase()) + ".</b>" +
              (a.r.also && a.r.also.length
                ? '&nbsp;<span>and it can be read as ' +
                  esc(sideByKey(a.chosen === a.r.side ? a.r.also[0] : a.r.side).en.toLowerCase()) + " too</span>"
                : "") + "</div>"
            : '<div class="verdict-msg no"><b>That was ' + esc(sideByKey(a.r.side).en.toLowerCase()) + ".</b></div>") +
          '<div class="why"><div class="pb-row">' + sayBtn(a.r.ar, true) +
          '<span class="pb-text"><span class="ar">' + esc(disp(a.r.ar)) + "</span>" +
          '<span class="pb-en">' + esc(englishFor(a.r.ar) || "") + "</span></span></div>" +
          (a.r.note ? '<p class="pair-note">' + a.r.note + "</p>" : "") + "</div>" +
          '<button class="btn btn-wide" data-act="answers-next">Another answer</button></div>'
        : "");
  }

  function newAsked(prev) {
    var pool = askPool();
    if (!pool.length) return null;
    var q = shuffle(pool)[0];
    if (prev && pool.length > 1) {
      var g = 0;
      while (g++ < 8 && q.ar === prev.q.ar) q = shuffle(pool)[0];
    }

    // The wrong answers are kinds of question the course has taught you
    // too, so this stays a listening test rather than a guessing one.
    var kinds = [];
    pool.forEach(function (o) { if (kinds.indexOf(o.kind) === -1) kinds.push(o.kind); });
    var wrong = shuffle(kinds.filter(function (k) { return k !== q.kind; })).slice(0, 3);
    if (wrong.length < 3) {
      shuffle(ASK_KINDS).forEach(function (k) {
        if (wrong.length >= 3 || k.key === q.kind || wrong.indexOf(k.key) !== -1) return;
        wrong.push(k.key);
      });
    }

    return {
      q: q,
      options: shuffle(wrong.concat([q.kind])),
      chosen: null,
      checked: false,
      right: false,
      played: false,
      got: prev ? prev.got : 0,
      run: prev ? prev.run : 0
    };
  }

  function answerAsked(key) {
    if (!asked || asked.checked) return;
    asked.chosen = key;
    asked.right = key === asked.q.kind;
    asked.checked = true;
    asked.run += 1;
    if (asked.right) {
      asked.got += 1;
      // Catching a question by ear is recall of that question, and it
      // ought to count for it like any round does.
      var lid = lessonTeaching(asked.q.ar);
      if (lid) { bumpStrength(lid, asked.q.ar, true); save(); }
    }
    render();
  }

  function askedHTML() {
    if (!asked) {
      return topbarHTML("What are they asking?") +
        '<p class="pb-lead">You will not catch the whole question. You will catch the word at the front, and ' +
        'that is enough to know what to do. Pass a lesson with a question in it and this opens.</p>' +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }

    var a = asked;
    var heard = canSpeak();

    var opts = '<div class="options">' + a.options.map(function (key, i) {
      var k = askKindByKey(key);
      var cls = "option";
      var state = "";
      if (a.checked) {
        if (key === a.q.kind) { cls += " is-right"; state = "Correct answer"; }
        else if (key === a.chosen) { cls += " is-wrong"; state = "Your answer, incorrect"; }
        else cls += " is-dim";
      }
      return '<button class="' + cls + '" data-act="asked-answer" data-value="' + esc(key) + '"' +
        (a.checked ? " disabled" : "") + ">" +
        '<span class="option-key">' + (i + 1) + "</span><span>" + esc(k ? k.en : key) + "</span>" +
        (state ? '<span class="sr-only">, ' + state + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    var stage = heard
      ? '<div class="listen-stage">' +
        '<button class="say say-lg" data-act="say" data-say="' + esc(a.q.ar) + '"' +
        ' aria-label="Play the question again">' + SPEAKER_SVG + "</button></div>" +
        '<div class="prompt-sub">' +
        (a.checked ? '<span class="ar">' + esc(disp(a.q.ar)) + "</span>" : "tap to hear it again") + "</div>"
      : '<div class="prompt-main ar">' + esc(disp(a.q.ar)) + "</div>" +
        '<div class="prompt-sub">no Arabic voice on this device, so you get it in writing</div>';

    var kind = askKindByKey(a.q.kind);

    return topbarHTML("What are they asking?", null, a.run ? a.got + "/" + a.run : "") +
      '<p class="pb-lead">Not what the question means. Only what is being asked of you, which is all you need ' +
      'to answer it.</p>' +
      '<div class="prompt"><div class="prompt-label">' +
      (heard ? "Listen to the question" : "Read the question") + "</div>" + stage + "</div>" +
      opts +
      (a.checked
        ? '<div class="verdict" tabindex="-1">' +
          (a.right
            ? '<div class="verdict-msg ok"><b>Yes.</b>&nbsp;<span>' + esc(askWord(a.q.kind)) + "</span></div>"
            : '<div class="verdict-msg no"><b>It was ' + esc(kind ? kind.en.toLowerCase() : "") +
              '.</b>&nbsp;<span>' + esc(askWord(a.q.kind)) + "</span></div>") +
          '<div class="why"><div class="pb-row">' + sayBtn(a.q.ar, true) +
          '<span class="pb-text"><span class="ar">' + esc(disp(a.q.ar)) + "</span>" +
          '<span class="pb-en">' + esc(a.q.en || "") + "</span></span></div>" +
          (glossesFor(disp(a.q.ar)).length ? glossHTML(a.q.ar) : "") + "</div>" +
          '<button class="btn btn-wide" data-act="asked-next">Another question</button></div>'
        : "");
  }

  /* ============================================================
     NUMBERS BY EAR

     Every number in the course arrives on a page: a flashcard, a
     four-way guess against the English word. That is not how a price
     or a departure time actually reaches you; it arrives spoken, once,
     and you either catch the digits or you do not. Nothing here is
     written down to fall back on. You hear the number, or, lacking a
     voice, read the transliteration you would otherwise have heard,
     and type back the digits you caught.
     ============================================================ */

  function newNumbers(prev) {
    var start = 20, cap = 99, step = 10;
    var got = prev ? prev.got : 0;
    var ceil = Math.min(cap, start + got * step);
    var wide = ceil > start;

    // Below twenty, every number is a single digit or a teen the course
    // will not touch, so the pool is just whatever is valid. Past that,
    // weight it toward the two-digit numbers and the round tens
    // especially: a price or a room number is rarely "seven", and the
    // single digits already had the whole range to themselves before
    // the ceiling moved.
    var pool = [];
    for (var i = 1; i <= ceil; i++) {
      if (!numberWords(i, variety())) continue;
      var weight = 1;
      if (wide) weight = (i >= 10 && i % 10 === 0) ? 4 : (i >= 10 ? 3 : 1);
      for (var k = 0; k < weight; k++) pool.push(i);
    }

    var n = shuffle(pool)[0];
    if (prev && pool.length > 1) {
      var g = 0;
      while (g++ < 8 && n === prev.n) n = shuffle(pool)[0];
    }

    var w = numberWords(n, variety());
    // Not a phrase the course teaches, so spk() would have nothing to
    // say without this: the same registration compose() does for its
    // own sentences.
    MADE[w.ar] = w.s;

    return {
      n: n,
      w: w,
      typed: "",
      checked: false,
      right: false,
      played: false,
      got: got,
      run: prev ? prev.run : 0
    };
  }

  function checkNumbers() {
    if (!numbers || numbers.checked) return;
    var field = app.querySelector('[data-act="numbers-typing"]');
    if (field) numbers.typed = field.value;
    var digits = String(numbers.typed).replace(/[^0-9]/g, "");
    if (!digits) return;
    numbers.checked = true;
    numbers.right = Number(digits) === numbers.n;
    numbers.run += 1;
    if (numbers.right) {
      numbers.got += 1;
      // A number the course teaches as one word is a phrase like any
      // other, and catching it by ear is recall of it. numberWords
      // writes it mid-sentence, so it comes back lower-cased.
      var key = numbers.w.ar.charAt(0).toUpperCase() + numbers.w.ar.slice(1);
      var lid = lessonTeaching(key);
      if (lid) { bumpStrength(lid, key, true); save(); }
    }
    render();
  }

  function numbersHTML() {
    if (!numbers) return topbarHTML("Numbers by ear");

    var nu = numbers;
    var heard = canSpeak();
    var checked = nu.checked;

    var stage = heard
      ? '<div class="listen-stage">' +
        '<button class="say say-lg" data-act="say" data-say="' + esc(nu.w.ar) + '"' +
        ' aria-label="Play the number again">' + SPEAKER_SVG + "</button></div>" +
        '<div class="prompt-sub">tap to hear it again</div>'
      : '<div class="prompt-main ar">' + esc(nu.w.ar) + "</div>" +
        '<div class="prompt-sub">no Arabic voice on this device, so you get it in writing</div>';

    var cls = "type-in" + (checked ? (nu.right ? " is-right" : " is-wrong") : "");

    var verdict = checked
      ? '<div class="verdict">' +
        (nu.right
          ? '<div class="verdict-msg ok"><b>Right.</b>&nbsp;<span>' + nu.n + '</span>&nbsp;<span class="ar">' +
            esc(nu.w.ar) + '</span>' + sayBtn(nu.w.ar, true) + '</div>'
          : '<div class="verdict-msg no"><b>It was ' + nu.n + '.</b>&nbsp;<span class="ar">' +
            esc(nu.w.ar) + '</span>' + sayBtn(nu.w.ar, true) + '</div>') +
        '<button class="btn btn-wide" data-act="numbers-next">Another number</button></div>'
      : "";

    return topbarHTML("Numbers by ear", null, nu.run ? nu.got + "/" + nu.run : "") +
      '<div class="prompt"><div class="prompt-label">' +
      (heard ? "Listen to the number" : "Read the number") + "</div>" + stage + "</div>" +
      '<input class="' + cls + '" data-act="numbers-typing" type="text" inputmode="numeric" pattern="[0-9]*"' +
      ' maxlength="2" value="' + esc(nu.typed) + '" autocomplete="off" autocorrect="off" autocapitalize="off"' +
      ' spellcheck="false" aria-label="Type the number, in digits"' + (checked ? " disabled" : "") + ">" +
      (checked ? "" :
        '<div class="btn-row"><button class="btn btn-wide" data-act="numbers-check">Check</button></div>') +
      verdict;
  }

  /* ============================================================
     OUT LOUD

     Two things the course could not ask of you. Shadowing: hear it,
     say it back at once, and be told how close you got - the only
     exercise that works on the mouth rather than the memory, which is
     what the ayn and the kh need. And a run: ten phrases you already
     know, one after another, timed and unmarked, to make automatic
     what is merely known.
     ============================================================ */

  function loudPool() {
    var out = [];
    finishedLessons().forEach(function (l) {
      visiblePhrases(l).forEach(function (p) {
        if (!spk(p.ar)) return;
        out.push({ ar: p.ar, en: p.en, lesson: l, s: strengthOf(l.id, p.ar) });
      });
    });
    return out;
  }

  function newLoud(mode, prev) {
    var pool = loudPool();
    if (!pool.length) return null;
    // Shadowing works on anything; a run is only worth it on phrases you
    // are supposed to have.
    var use = mode === "run" ? pool.filter(function (p) { return p.s !== null && p.s >= 2; }) : pool;
    if (!use.length) use = pool;
    var list = shuffle(use).slice(0, mode === "run" ? 10 : 1);
    return {
      mode: mode,
      list: list,
      i: 0,
      heard: null,
      score: null,
      played: false,
      startedAt: null,
      done: false,
      got: prev && prev.mode === mode ? prev.got : 0,
      run: prev && prev.mode === mode ? prev.run : 0
    };
  }

  function loudNow() { return loud && loud.list[loud.i]; }

  function shadowHeard(list) {
    var p = loudNow();
    if (!p) return;
    var best = bestHeard(list, spk(p.ar) || "");
    loud.heard = best;
    loud.score = best.score;
    loud.run += 1;
    if (best.score >= HEARD_OK) loud.got += 1;
    render();
  }

  function loudNext() {
    if (!loud) return;
    if (loud.mode === "shadow") { loud = newLoud("shadow", loud); render(); return; }
    if (loud.i >= loud.list.length - 1) { loud.done = true; render(); return; }
    loud.i += 1;
    loud.played = false;
    render();
  }

  function loudHTML() {
    if (!loud) {
      return topbarHTML("Out loud") +
        '<p class="pb-lead">Pass a lesson first: there is nothing to say yet.</p>' +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }

    var p = loudNow();
    var shadow = loud.mode === "shadow";

    if (loud.done) {
      var secs = loud.startedAt ? Math.round((Date.now() - loud.startedAt) / 1000) : null;
      return topbarHTML("Out loud") +
        '<div class="card result fade-in"><div class="eyebrow">Run over</div>' +
        '<div class="result-score mono review">' + loud.list.length + "</div>" +
        '<p class="result-line">' + (secs !== null ? "Ten phrases in " + secs + " seconds. " : "") +
        "Nothing was marked. The point was to keep going.</p></div>" +
        '<div class="btn-row"><button class="btn btn-ghost" data-go="home">Home</button>' +
        '<button class="btn" data-act="loud-again">Again</button></div>';
    }

    var stage = shadow
      ? '<div class="listen-stage">' +
        '<button class="say say-lg" data-act="say" data-say="' + esc(p.ar) + '"' +
        ' aria-label="Play it again">' + SPEAKER_SVG + "</button></div>" +
        '<div class="prompt-sub">' +
        (loud.heard ? '<span class="ar">' + esc(disp(p.ar)) + "</span>" : "listen, then say it back") +
        "</div>"
      : '<div class="prompt-main ar">' + esc(disp(p.ar)) + "</div>" +
        '<div class="prompt-sub">' + esc(p.en) + "</div>";

    var body = shadow
      ? (canHear()
          ? '<div class="mic-row">' + micBtn(loud.heard ? "Say it again" : "Say it back", ears.busy) + "</div>"
          : micNote()) +
        (loud.heard
          ? '<div class="heard' + (loud.score >= HEARD_OK ? " is-close" : "") + '">' +
            '<span class="heard-label">' +
            (loud.score >= HEARD_OK ? "That is it" : "Close enough to keep going") + "</span>" +
            '<span class="heard-text ar">' + esc(nearestTranslit(loud.heard.text).text || "-") + "</span>" +
            '<span class="heard-note">A recogniser is not a judge. What matters is that your mouth made the shape.</span>' +
            "</div>"
          : "") +
        '<div class="btn-row"><button class="btn btn-wide" data-act="loud-next">' +
        (loud.heard ? "Another one" : "Skip it") + "</button></div>"
      : '<div class="btn-row"><button class="btn btn-wide" data-act="loud-next">Next</button></div>';

    return topbarHTML("Out loud", null, shadow
      ? (loud.run ? loud.got + "/" + loud.run : "")
      : (loud.i + 1) + " / " + loud.list.length) +
      '<p class="pb-lead">' +
      (shadow
        ? "Hear it, then say it straight back. This one is for your mouth, not your memory: nothing here counts towards anything."
        : "Ten you already know, out loud, one after another. Do not stop to get them right.") +
      "</p>" +
      '<div class="prompt"><div class="prompt-label">' +
      (shadow ? "Say it back" : "Say this") + "</div>" + stage + "</div>" + body;
  }

  /* ============================================================
     LESSON, STUDY
     ============================================================ */

  function topbarHTML(title, barPct, counter) {
