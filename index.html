  function lessonHTML(lesson) {
    var r = recordOf(lesson.id);
    var coreN = lesson.phrases.filter(function (p) { return p.core; }).length;
    return topbarHTML(lesson.title) +
      '<div class="card" style="padding:26px 24px;margin-top:8px">' +
      '<div class="eyebrow">Lesson ' + lesson.id + "</div>" +
      '<h2 style="font-size:26px;letter-spacing:-.02em;margin:8px 0">' + esc(lesson.title) + "</h2>" +
      '<p style="margin:0;color:var(--ink-2);font-size:15px">' + esc(lesson.intro) + "</p>" +
      '<p class="mono" style="margin:16px 0 0;color:var(--ink-3);font-size:13.5px">' +
      lesson.phrases.length + " phrases" + (coreN ? " &#183; " + coreN + " core" : "") +
      " &#183; " + (r ? "best " + r.best + "%" : "not played yet") + "</p>" +
      "</div>" +
      pickerHTML("choose what this lesson drills") +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost" data-go="learn" data-id="' + lesson.id + '">Study the phrases</button>' +
      '<button class="btn" data-go="play" data-id="' + lesson.id + '">Play</button>' +
      "</div>";
  }

  function learnHTML() {
    var l = learn.lesson;
    var p = l.phrases[learn.i];
    var pct = Math.round((learn.i + 1) / l.phrases.length * 100);
    var last = learn.i + 1 === l.phrases.length;

    var note = "";
    if (p.f) {
      note += '<div class="flash-note"><span>' + esc(p.fLabel || "Speaking to a woman") +
        ': <b class="ar">' + esc(p.f) + "</b></span>" + sayBtn(p.f, true) + "</div>";
    }
    if (p.note) note += '<div class="flash-note"><span>' + p.note + "</span></div>";

    var known = !!knownRec(l.id, p.ar);
    var hidden = isHidden(l.id, p.ar);
    var aside = '<div class="aside-row"><div class="aside-pair">' +
      (hidden ? "" :
        '<button class="aside' + (known ? " is-on" : "") + '" data-act="known" data-id="' + esc(p.ar) + '"' +
        ' aria-pressed="' + (known ? "true" : "false") + '">' +
        '<span class="aside-tick" aria-hidden="true"></span>' +
        (known ? "Set aside" : "I know this one") + "</button>") +
      '<button class="aside aside-hide' + (hidden ? " is-off" : "") + '" data-act="hide" data-id="' + esc(p.ar) + '"' +
      ' aria-pressed="' + (hidden ? "true" : "false") + '">' +
      (hidden ? "Hidden" : "Not for me") + "</button>" +
      "</div>" +
      (hidden
        ? '<span class="aside-note">Hidden for good. It will not come up anywhere.</span>'
        : known ? '<span class="aside-note">Out of rotation. It will come back once for a check.</span>' : "") +
      "</div>";

    return topbarHTML(l.title + " &#183; study", pct, (learn.i + 1) + " / " + l.phrases.length) +
      '<div class="card flashcard fade-in">' +
      (p.core ? '<div><span class="core-tag">Core phrase</span></div>' : "") +
      '<div class="say-row"><div class="flash-ar ar">' + esc(p.ar) + "</div>" + sayBtn(p.ar) + "</div>" +
      (learn.shown
        ? '<div class="flash-rule"></div><div class="flash-en">' + esc(p.en) + "</div>" + note + aside
        : '<div class="flash-hint">Tap reveal to see what it means</div>') +
      "</div>" +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost btn-step" data-act="learn-prev"' +
      (learn.i === 0 ? " disabled" : "") + ' aria-label="Previous phrase">&larr;</button>' +
      '<button class="btn" data-act="' + (learn.shown ? "learn-next" : "learn-reveal") + '">' +
      (learn.shown ? (last ? "Finish and play" : "Next phrase") : "Reveal") + "</button>" +
      '<button class="btn btn-ghost btn-step" data-act="learn-fwd"' +
      (last ? " disabled" : "") + ' aria-label="Next phrase, without revealing">&rarr;</button>' +
      "</div>";
  }

  /* ============================================================
     PLAY
     ============================================================ */

  function playHTML() {
    var t = session.tasks[session.i];
    var pct = Math.round(session.i / session.tasks.length * 100);
    var body =
      t.type === "match" ? matchHTML(t) :
      t.type === "quiz" ? quizHTML(t) :
      t.type === "build" ? buildHTML(t) :
      t.type === "say" ? sayHTML(t) :
      t.type === "write" ? writeHTML(t) :
      t.type === "listen" ? listenHTML(t) :
      t.type === "convoturn" ? convoTurnHTML(t) : dialogHTML(t);
    var title = session.isDrill ? (gameByKey(session.isDrill) || {}).label + " only"
      : session.isReview ? "Mixed review"
      : session.isConvo ? session.convo.title
      : session.lesson.title;
    return topbarHTML(title, pct, (session.i + 1) + " / " + session.tasks.length) +
      '<div class="fade-in">' + body + "</div>" + verdictHTML(t);
  }

  function optionsHTML(list, arabic, t) {
    var checked = session.state === "checked";
    return '<div class="options">' + list.map(function (opt, i) {
      var cls = "option" + (arabic ? " ar" : "");
      if (checked) {
        if (opt === t.answer) cls += " is-right";
        else if (opt === t.chosen) cls += " is-wrong";
        else cls += " is-dim";
      }
      return '<button class="' + cls + '" data-act="answer" data-value="' + esc(opt) + '"' +
        (checked ? " disabled" : "") + ">" +
        '<span class="option-key">' + (i + 1) + "</span><span>" + esc(opt) + "</span></button>";
    }).join("") + "</div>";
  }

  function quizHTML(t) {
    var hear = t.toEnglish ? sayBtn(t.prompt, true) : "";
    return '<div class="prompt">' +
      '<div class="prompt-label">' + (t.toEnglish ? "What does this mean?" : "How do you say this?") + "</div>" +
      '<div class="say-row"><div class="prompt-main' + (t.toEnglish ? " ar" : "") + '">' +
      esc(t.prompt) + "</div>" + hear + "</div></div>" +
      optionsHTML(t.options, !t.toEnglish, t);
  }

  function dialogHTML(t) {
    return '<div class="prompt">' +
      '<div class="prompt-label">Someone says to you</div>' +
      '<div class="say-row"><div class="prompt-main ar">' + esc(t.exchange.ask) + "</div>" +
      sayBtn(t.exchange.ask, true) + "</div>" +
      '<div class="prompt-sub">' + esc(t.exchange.askEn) + "</div>" +
      '<div class="prompt-label" style="margin-top:22px">How do you reply?</div>' +
      "</div>" + optionsHTML(t.options, true, t);
  }

  function sayHTML(t) {
    var checked = session.state === "checked";
    if (!t.shown && !checked) {
      return '<div class="prompt">' +
        '<div class="prompt-label">Say it out loud</div>' +
        '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" +
        '<div class="prompt-sub">out loud, then check yourself</div>' +
        (canHear() ? '<div class="mic-row">' + micBtn("Say it into the mic", ears.busy) + "</div>" : micNote()) +
        "</div>" +
        heardHTML(t, t.phrase.ar,
          t.heard && t.heard.text ? { act: "say-confirm", label: "Yes, that is what I said" } : null) +
        '<div class="btn-row"><button class="btn btn-wide" data-act="say-reveal">Reveal</button></div>';
    }
    return '<div class="prompt">' +
      '<div class="prompt-label">You were going for</div>' +
      '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" +
      '<div class="say-row" style="margin-top:18px">' +
      '<div class="prompt-main ar">' + esc(t.phrase.ar) + "</div>" + sayBtn(t.phrase.ar) + "</div>" +
      "</div>" +
      heardHTML(t, t.phrase.ar) +
      (checked ? "" :
        '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-act="say-grade" data-value="missed">Missed it</button>' +
        '<button class="btn" data-act="say-grade" data-value="got">Got it</button>' +
        "</div>");
  }

  function writeHTML(t) {
    var checked = session.state === "checked";
    var cls = "type-in" + (checked ? (session.lastRight ? " is-right" : " is-wrong") : "");
    return '<div class="prompt">' +
      '<div class="prompt-label">Type it from memory</div>' +
      '<div class="prompt-main">' + esc(t.phrase.en) + "</div>" +
      '<div class="prompt-sub">in these letters, not Arabic script &#183; accents and capitals do not matter</div>' +
      "</div>" +
      '<input class="' + cls + '" data-act="typing" type="text" value="' + esc(t.typed) + '"' +
      ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
      ' aria-label="Type the Arabic phrase"' + (checked ? " disabled" : "") + ">" +
      (checked ? "" :
        '<div class="btn-row"><button class="btn btn-wide" data-act="check-write">Check</button></div>');
  }

  function listenHTML(t) {
    var checked = session.state === "checked";
    return '<div class="prompt">' +
      '<div class="prompt-label">Listen, then choose the meaning</div>' +
      '<div class="listen-stage">' +
      '<button class="say say-lg" data-act="say" data-say="' + esc(t.phrase.ar) + '"' +
      ' aria-label="Play the phrase again">' + SPEAKER_SVG + "</button>" +
      "</div>" +
      '<div class="prompt-sub">' + (checked ? esc(t.phrase.ar) : "tap to hear it again") + "</div>" +
      "</div>" + optionsHTML(t.options, false, t);
  }

  function bubble(who, ar, en) {
    return '<div class="turn is-' + who + '">' +
      '<div class="bubble"><span class="ar">' + esc(ar) + "</span>" +
      '<span class="bubble-en">' + esc(en) + "</span></div>" +
      sayBtn(ar, true) + "</div>";
  }

  // Which of the three replies the microphone landed on, if any.
  function convoHeardPick(t) {
    if (!t.heard || !t.heard.text) return null;
    var best = null, bestScore = 0;
    t.options.forEach(function (opt) {
      var sc = heardScore(t.heard.text, SCRIPT[opt] || "");
      if (sc > bestScore) { bestScore = sc; best = opt; }
    });
    if (!best || bestScore < 0.34) return null;
    return { act: "convo-confirm", id: best, label: "Yes, I said " + best };
  }

  function convoTurnHTML(t) {
    var checked = session.state === "checked";
    var lines = "";
    for (var i = 0; i < t.idx; i++) {
      var past = t.convo.turns[i];
      lines += bubble("them", past.say, past.sayEn) + bubble("you", past.reply, past.replyEn);
    }
    lines += bubble("them", t.turn.say, t.turn.sayEn);
    if (checked) lines += bubble("you", t.turn.reply, t.turn.replyEn);

    return (t.idx === 0 ? '<p class="convo-setting">' + esc(t.convo.setting) + "</p>" : "") +
      '<div class="transcript">' + lines + "</div>" +
      (checked ? "" :
        '<div class="prompt-label" style="margin:20px 0 12px">How do you reply?</div>' +
        (canHear() ? '<div class="mic-row">' + micBtn("Answer out loud", ears.busy) + "</div>" : micNote()) +
        heardHTML(t, t.answer, convoHeardPick(t)) +
        optionsHTML(t.options, true, t));
  }

  function buildHTML(t) {
    var checked = session.state === "checked";
    var slotCls = "slot" + (t.picked.length ? "" : " is-empty") +
      (checked ? (session.lastRight ? " is-right" : " is-wrong") : "");

    var slot = t.picked.map(function (id) {
      return '<button class="tile in-slot" data-act="unpick" data-id="' + id + '"' +
        (checked ? " disabled" : "") + ">" + esc(t.tiles[id].word) + "</button>";
    }).join("");

    var bank = t.tiles.map(function (tile) {
      var spent = t.picked.indexOf(tile.id) !== -1;
      return '<button class="tile' + (spent ? " is-spent" : "") + '" data-act="pick" data-id="' + tile.id + '"' +
        (spent || checked ? " disabled" : "") + (spent ? ' tabindex="-1" aria-hidden="true"' : "") +
        ">" + esc(tile.word) + "</button>";
    }).join("");

    return '<div class="prompt">' +
      '<div class="prompt-label">Build this sentence</div>' +
      '<div class="prompt-main">' + esc(t.phrase.en) + "</div></div>" +
      '<div class="' + slotCls + '">' + slot + "</div>" +
      '<div class="bank">' + bank + "</div>" +
      (checked ? "" :
        '<div class="btn-row"><button class="btn btn-wide" data-act="check-build"' +
        (t.picked.length === t.target.length ? "" : " disabled") + ">Check</button></div>");
  }

  function matchHTML(t) {
    function cell(side, item) {
      var gone = t.done.indexOf(item.i) !== -1;
      var picked = t.picked && t.picked.side === side && t.picked.i === item.i;
      var miss = t.miss && t.miss.side === side && t.miss.i === item.i;
      return '<button class="match-cell' + (side === "l" ? " ar" : "") +
        (gone ? " is-gone" : "") + (picked ? " is-picked" : "") + (miss ? " is-miss" : "") +
        '" data-act="match" data-side="' + side + '" data-i="' + item.i + '"' +
        (gone ? " disabled" : "") + ">" + esc(item.text) + "</button>";
    }
    var rows = "";
    for (var i = 0; i < t.pairs.length; i++) rows += cell("l", t.left[i]) + cell("r", t.right[i]);
    return '<div class="prompt" style="margin-bottom:0">' +
      '<div class="prompt-label">Pair each phrase with its meaning</div>' +
      '<div class="prompt-main" style="font-size:17px;color:var(--ink-2)">' +
      t.done.length + " of " + t.pairs.length + " matched</div></div>" +
      '<div class="match-grid">' + rows + "</div>";
  }

  function verdictHTML(t) {
    if (session.state !== "checked") return "";
    var last = session.i === session.tasks.length - 1;
    var msg;
    if (session.lastRight) {
      // Getting it right is the honest moment to say you have it.
      var ph = t.phrase;
      var lsn = ph ? lessonOf(t, ph) : null;
      var already = lsn && knownRec(lsn.id, ph.ar);
      msg = '<div class="verdict-msg ok"><b>Correct.</b>' +
        (lsn && !already && !t.isRetry
          ? '<button class="aside aside-inline" data-act="known" data-id="' + esc(ph.ar) +
            '" data-lesson="' + lsn.id + '"><span class="aside-tick" aria-hidden="true"></span>I know this one</button>'
          : already ? '<span class="aside-note">Set aside</span>' : "") +
        "</div>";
    } else {
      var answer = t.type === "build" ? t.target.join(" ") : t.answer;
      var arabicAnswer = !((t.type === "quiz" && t.toEnglish) || t.type === "listen");
      if (t.type === "say") arabicAnswer = true;
      msg = '<div class="verdict-msg no"><b>Not quite.</b>&nbsp;<span' +
        (arabicAnswer ? ' class="ar"' : "") + ">" + esc(answer) + "</span>" +
        (arabicAnswer ? sayBtn(answer, true) : "") + "</div>";
    }
    var ending = last && (session.retried || session.missed.length === 0);
    return '<div class="verdict">' + msg +
      '<button class="btn btn-wide" data-act="next">' +
      (ending ? "See your score" : "Continue") + "</button></div>";
  }

  /* ============================================================
     RESULT
     ============================================================ */

  function resultHTML() {
    var score = Math.round(session.earned / session.max * 100);
    var passed = score >= PASS;
    var lesson = session.lesson;
    var next = lesson ? LESSONS[LESSONS.indexOf(lesson) + 1] : null;

    var line;
    if (session.isConvo) {
      line = passed
        ? "You held the whole conversation. Try it again later without the options in front of you."
        : "Read the exchange through again, then replay it; the reply always follows from what was just said.";
    } else if (session.isToday && session.todayNext) {
      line = "Revision done. Lesson " + session.todayNext.id + ", " +
        session.todayNext.title.toLowerCase() + ", is waiting when you are.";
    } else if (session.isDrill) {
      line = ((gameByKey(session.isDrill) || {}).label || "That game") +
        ", drawn from everything you have passed.";
    } else if (session.isReview) {
      line = "Drawn from your " + session.reviewPool + " finished lesson" +
        (session.reviewPool === 1 ? "" : "s") +
        ", weighted toward the core and the phrases you keep getting wrong.";
    } else if (passed) {
      line = next
        ? "Lesson " + next.id + ", " + next.title.toLowerCase() + ", is now open."
        : "That is the whole course. Go back and push the weaker lessons up.";
    } else {
      line = "You need " + PASS + "% to move on. Study the phrases once more, then play again.";
    }

    var misses = "";
    if (session.missed.length) {
      var seen = {}, rows = "";
      session.missed.forEach(function (p) {
        if (seen[p.ar]) return;
        seen[p.ar] = true;
        rows += '<div class="miss">' + sayBtn(p.ar, true) +
          '<span class="ar">' + esc(p.ar) + "</span>" +
          '<span class="miss-en">' + esc(p.en) + "</span></div>";
      });
      misses = '<div class="result-misses"><h3>Worth another look</h3>' + rows + "</div>";
    }

    var eyebrow = session.isConvo ? "Conversation over"
      : session.isReview ? "Review complete"
      : (passed ? "Lesson complete" : "Not there yet");
    var tone = session.isReview || session.isConvo ? "review" : (passed ? "pass" : "fail");

    var again = session.isConvo
      ? '<button class="btn btn-ghost" data-go="convo" data-id="' + esc(session.convo.id) + '">Run it again</button>'
      : session.isReview
        ? '<button class="btn btn-ghost" data-go="review">Review again</button>'
        : '<button class="btn btn-ghost" data-go="play" data-id="' + lesson.id + '">Play again</button>';
    var onward = session.isToday && session.todayNext
      ? '<button class="btn" data-go="lesson" data-id="' + session.todayNext.id + '">Lesson ' + session.todayNext.id + "</button>"
      : !session.isReview && !session.isConvo && passed && next
        ? '<button class="btn" data-go="lesson" data-id="' + next.id + '">Next lesson</button>'
        : '<button class="btn" data-go="home">Back to lessons</button>';

    return topbarHTML(session.isConvo ? session.convo.title
      : session.isDrill ? (gameByKey(session.isDrill) || {}).label + " only"
      : session.isReview ? "Mixed review" : lesson.title) +
      '<div class="card result fade-in">' +
      '<div class="eyebrow">' + eyebrow + "</div>" +
      '<div class="result-score mono ' + tone + '">' + score + "%</div>" +
      '<p class="result-line">' + esc(line) + "</p>" + misses + "</div>" +
      '<div class="btn-row">' + again + onward + "</div>";
  }

  /* ============================================================
     ANSWERING
     ============================================================ */

  function lessonOf(task, phrase) {
    return (phrase && phrase._lesson) || (task && task.srcLesson) || session.lesson;
  }

  function noteMiss(task, phrase) {
    session.missed.push({ ar: phrase.ar, en: phrase.en, lesson: lessonOf(task, phrase) });
  }

  function scorePhrase(task, right, phrase) {
    if (!phrase || (task && task.isRetry)) return;
    var l = lessonOf(task, phrase);
    if (!l) return;
    bumpStrength(l.id, phrase.ar, right);

    // This was a phrase you had set aside, coming back for its check.
    var rec = knownRec(l.id, phrase.ar);
    if (rec) {
      if (right) setKnown(l.id, phrase.ar);   // sleeps again from now
      else clearKnown(l.id, phrase.ar);       // back into normal rotation
    }
    save();
  }

  function settle(task, right, phrase) {
    session.state = "checked";
    session.lastRight = right;
    if (right && task.points > 0) session.earned += 1;
    if (!right && phrase && !task.isRetry) noteMiss(task, phrase);
    scorePhrase(task, right, phrase);
    render();
  }

  function answer(value) {
    if (session.state === "checked") return;
    var t = session.tasks[session.i];
    t.chosen = value;
    var phrase =
      t.type === "dialog" ? { ar: t.exchange.reply, en: t.exchange.en } :
      t.type === "convoturn" ? { ar: t.turn.reply, en: t.turn.replyEn } :
      t.phrase;
    settle(t, value === t.answer, phrase);
  }

  function checkWrite() {
    var t = session.tasks[session.i];
    if (session.state === "checked") return;
    var field = app.querySelector('[data-act="typing"]');
    if (field) t.typed = field.value;
    if (!normalise(t.typed)) return;
    settle(t, normalise(t.typed) === normalise(t.answer), t.phrase);
  }

  function checkBuild() {
    var t = session.tasks[session.i];
    if (session.state === "checked" || t.picked.length !== t.target.length) return;
    var built = t.picked.map(function (id) { return t.tiles[id].word; });
    settle(t, built.join(" ") === t.target.join(" "), t.phrase);
  }

  function matchTap(side, i) {
    var t = session.tasks[session.i];
    if (session.state === "checked" || t.done.indexOf(i) !== -1) return;
    t.miss = null;

    if (!t.picked || t.picked.side === side) { t.picked = { side: side, i: i }; render(); return; }

    if (t.picked.i === i) {
      t.done.push(i);
      if (!t.missedOnce[i]) session.earned += 1;
      scorePhrase(t, !t.missedOnce[i], t.pairs[i]);
      t.picked = null;
      if (t.done.length === t.pairs.length) { session.state = "checked"; session.lastRight = true; }
      render();
      return;
    }

    [i, t.picked.i].forEach(function (k) {
      if (!t.missedOnce[k]) {
        t.missedOnce[k] = true;
        noteMiss(t, t.pairs[k]);
        scorePhrase(t, false, t.pairs[k]);
      }
    });
    t.miss = { side: side, i: i };
    t.picked = null;
    render();
    window.setTimeout(function () {
      if (session && session.tasks[session.i] === t && t.miss) { t.miss = null; render(); }
    }, 420);
  }

  function finish() {
    var score = Math.round(session.earned / session.max * 100);
    // Sessions are the clock the spot checks run on.
    store.runs = runCount() + 1;
    if (session.isReview) {
      var rv = store.review || { best: 0, runs: 0 };
      rv.runs += 1;
      if (score > rv.best) rv.best = score;
      store.review = rv;
      save();
    } else if (session.isConvo) {
      if (!store.convos) store.convos = {};
      var c = store.convos[session.convo.id] || { best: 0 };
      if (score > c.best) c.best = score;
      store.convos[session.convo.id] = c;
      save();
    } else {
      record(session.lesson.id, score);
    }
    go({ name: "result" }, { replace: true });
  }

  function advance() {
    var atEnd = session.i >= session.tasks.length - 1;

    if (atEnd && !session.retried) {
      session.retried = true;
      var seen = {}, repeats = [];
      session.missed.forEach(function (m) {
        if (seen[m.ar] || repeats.length >= RETRY_MAX || !m.lesson) return;
        seen[m.ar] = true;
        var again = quizRound(m.lesson, m);
        if (again) { again.points = 0; again.isRetry = true; repeats.push(again); }
      });
      if (repeats.length) session.tasks = session.tasks.concat(repeats);
    }

    if (session.i >= session.tasks.length - 1) { finish(); return; }
    session.i++;
    session.state = "asking";
    render();
    window.scrollTo(0, 0);
  }

  /* ============================================================
     RENDER + EVENTS
     ============================================================ */

  function screenHTML() {
    if (view.name === "home") return homeHTML();
    if (view.name === "lesson") return lessonHTML(view.lesson);
    if (view.name === "learn") return learnHTML();
    if (view.name === "play") return playHTML();
    if (view.name === "result") return resultHTML();
    if (view.name === "phrasebook") return phrasebookHTML();
    if (view.name === "talk") return talkHTML();
    return "";
  }

  function render() {
    app.innerHTML = navHTML() + screenHTML();
    markPlaying();
    afterRender();
  }

  function afterRender() {
    if (view.name === "talk") {
      var tf = app.querySelector('[data-act="talk-typing"]');
      if (tf && talk.draft && !ears.busy && typeof tf.focus === "function") {
        tf.focus();
        if (typeof tf.setSelectionRange === "function") tf.setSelectionRange(tf.value.length, tf.value.length);
      }
      return;
    }
    if (view.name === "phrasebook") {
      var search = app.querySelector('[data-act="search"]');
      if (search && pbQuery && typeof search.focus === "function") {
        search.focus();
        if (typeof search.setSelectionRange === "function") {
          search.setSelectionRange(search.value.length, search.value.length);
        }
      }
      return;
    }
    if (view.name !== "play" || !session) return;
    var t = session.tasks[session.i];
    if (session.state === "checked") return;

    if (t.type === "write") {
      var field = app.querySelector('[data-act="typing"]');
      if (field && typeof field.focus === "function") {
        field.focus();
        if (typeof field.setSelectionRange === "function") {
          field.setSelectionRange(field.value.length, field.value.length);
        }
      }
      return;
    }

    if (t.type === "listen" && !t.played) { t.played = true; speak(t.phrase.ar); }
  }

  function stopSpeech() {
    if (speech.supported) window.speechSynthesis.cancel();
    speech.playing = null;
  }

  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-go],[data-act]");
    if (!el || el.disabled) return;

    var act = el.getAttribute("data-act");
    if (act === "say") { speak(el.getAttribute("data-say")); return; }

    var dest = el.getAttribute("data-go");
    if (dest) {
      navOpen = false;
      stopSpeech();
      if (dest === "home") { session = null; go({ name: "home" }); return; }
      if (dest === "phrasebook") { pbQuery = ""; go({ name: "phrasebook" }); return; }
      if (dest === "talk") { talk = newTalk(); go({ name: "talk" }); return; }
      if (dest === "lesson") { go({ name: "lesson", lesson: lessonById(el.getAttribute("data-id")) }); return; }
      if (dest === "learn") {
        learn = { lesson: lessonById(el.getAttribute("data-id")), i: 0, shown: false };
        go({ name: "learn" });
        return;
      }
      if (dest === "play") {
        session = buildSession(lessonById(el.getAttribute("data-id")));
        go({ name: "play" });
        return;
      }
      if (dest === "review") {
        var rs = buildReview();
        if (rs) { session = rs; go({ name: "play" }); }
        return;
      }
      if (dest === "convo") {
        var c = convoById(el.getAttribute("data-id"));
        if (c && convoOpen(c)) { session = buildConvo(c); go({ name: "play" }); }
        return;
      }
      if (dest === "reset") {
        if (window.confirm("Erase every score and lock the lessons again?")) {
          store = { lessons: {}, games: store.games };
          save();
          render();
        }
        return;
      }
      return;
    }

    if (act === "nav-open") { navOpen = true; render(); return; }
    if (act === "nav-close") { navOpen = false; render(); return; }
    if (act === "nav-today") { navOpen = false; stopSpeech(); startToday(); return; }
    if (act === "nav-course" || act === "nav-convos") {
      navOpen = false;
      session = null;
      go({ name: "home" });
      return;
    }
    if (act === "drill") {
      navOpen = false;
      var d = buildDrill(el.getAttribute("data-id"));
      if (d) { session = d; go({ name: "play" }); }
      else render();
      return;
    }
    if (act === "back") {
      var up = parentHash(view);
      stopSpeech();
      setHash(up);
      applyHash(up);
      return;
    }
    if (act === "known") {
      var ar = el.getAttribute("data-id");
      var lid = el.getAttribute("data-lesson");
      var lsn = lid ? lessonById(lid) : (learn ? learn.lesson : null);
      if (!lsn) return;
      if (knownRec(lsn.id, ar)) clearKnown(lsn.id, ar);
      else setKnown(lsn.id, ar);
      render();
      return;
    }
    if (act === "hide") {
      var har = el.getAttribute("data-id");
      if (!learn) return;
      toggleHidden(learn.lesson.id, har);
      render();
      return;
    }
    if (act === "unhide-all") {
      if (window.confirm("Show every hidden phrase again?")) { unhideAll(); render(); }
      return;
    }
    if (act === "unknow-all") {
      if (window.confirm("Bring every phrase you set aside back into rotation?")) {
        forgetAllKnown();
        render();
      }
      return;
    }
    if (act === "today") { stopSpeech(); startToday(); return; }
    if (act === "restore") { restoreBackup(); return; }
    if (act === "backup" || act === "search" || act === "typing") return;
    if (act === "game") {
      var key = el.getAttribute("data-key");
      var g = games();
      var on = GAMES.filter(function (x) { return g[x.key]; });
      if (g[key] && on.length === 1) return;
      g[key] = !g[key];
      store.games = g;
      save();
      render();
      return;
    }
    if (act === "learn-reveal") { learn.shown = true; render(); return; }
    if (act === "learn-prev" || act === "learn-fwd") {
      var step = act === "learn-fwd" ? 1 : -1;
      var to = learn.i + step;
      if (to < 0 || to >= learn.lesson.phrases.length) return;
      stopSpeech();
      learn.i = to;
      learn.shown = false;
      go({ name: "learn" });
      return;
    }
    if (act === "learn-next") {
      stopSpeech();
      if (learn.i + 1 >= learn.lesson.phrases.length) {
        session = buildSession(learn.lesson);
        go({ name: "play" });
      } else {
        learn.i++;
        learn.shown = false;
        go({ name: "learn" });
      }
      return;
    }
    if (act === "answer") { answer(el.getAttribute("data-value")); return; }
    if (act === "scope") {
      var sid = Number(el.getAttribute("data-id"));
      var cur = talkScope().slice();
      var at = cur.indexOf(sid);
      if (at === -1) cur.push(sid);
      else if (cur.length > 1) cur.splice(at, 1);   // never leave it with nothing to say
      setTalkScope(cur);
      talk = newTalk();
      talk.pickOpen = true;
      render();
      return;
    }
    if (act === "scope-all" || act === "scope-passed") {
      var all = LESSONS.map(function (l) { return l.id; });
      var passed = finishedLessons().map(function (l) { return l.id; });
      var next = act === "scope-all" ? all : (passed.length ? passed : [LESSONS[0].id]);
      setTalkScope(next);
      talk = newTalk();
      talk.pickOpen = true;
      render();
      return;
    }
    if (act === "mic-stop") { stopListening(); return; }
    if (act === "mic-again") {
      ears.blocked = null;
      ears.reason = null;
      render();
      return;
    }
    if (act === "mic-grant") {
      askForMic(function (ok, why) {
        if (ok) { ears.blocked = null; ears.reason = null; }
        else { ears.blocked = "denied"; ears.reason = why || "denied"; }
        render();
      });
      return;
    }
    if (act === "talk-reset") { talk = newTalk(); render(); return; }
    if (act === "talk-typing") return;
    if (act === "talk-send") {
      var draft = talk.draft.trim();
      if (!draft) return;
      talk.heard = draft;
      talk.options = bestMatches(draft, 3);
      // One clear reading goes straight through; anything less asks you.
      if (talk.options.length && talk.options[0].score >= TALK_MATCH &&
          (talk.options.length === 1 || talk.options[0].score - talk.options[1].score > 0.15)) {
        talkSay(talk.options[0].p.ar);
      }
      render();
      return;
    }
    if (act === "talk-none") {
      talk.options = [];
      talk.heard = null;
      talk.draft = "";
      render();
      return;
    }
    if (act === "talk-pick") {
      talkSay(el.getAttribute("data-id"));
      render();
      return;
    }
    if (act === "talk-mic") {
      if (!canHear() || ears.busy) return;
      talk.heard = null;
      talk.options = [];
      listenOnce(function (list) {
        var said = (list && list[0]) || "";
        talk.heard = said;
        talk.options = bestMatches(said, 3);
        if (talk.options.length && talk.options[0].score >= TALK_MATCH) {
          talkSay(talk.options[0].p.ar);
        }
        render();
      }, function () { render(); }, function () { render(); });
      return;
    }
    if (act === "mic") {
      if (view.name === "talk") return;
      var tm = session && session.tasks[session.i];
      if (!tm || session.state === "checked" || ears.busy) return;
      tm.heard = null;
      listenOnce(function (list) {
        var expect = tm.type === "convoturn" ? SCRIPT[tm.answer] : SCRIPT[tm.phrase.ar];
        tm.heard = bestHeard(list, expect || "");
        // On a conversation turn, a clear match answers for you.
        if (tm.type === "convoturn" && tm.heard.score >= HEARD_OK) {
          render();
          answer(tm.answer);
          return;
        }
        render();
      }, function () { render(); }, function () { render(); });
      return;
    }
    if (act === "say-confirm") {
      var tc = session.tasks[session.i];
      if (session.state === "checked") return;
      // You confirmed it, so it counts, and the strength system will
      // catch it later if you were being kind to yourself.
      settle(tc, true, tc.phrase);
      return;
    }
    if (act === "convo-confirm") {
      if (session.state === "checked") return;
      answer(el.getAttribute("data-id"));
      return;
    }
    if (act === "say-reveal") {
      var ts = session.tasks[session.i];
      ts.shown = true;
      render();
      return;
    }
    if (act === "say-grade") {
      var tg = session.tasks[session.i];
      if (session.state === "checked") return;
      settle(tg, el.getAttribute("data-value") === "got", tg.phrase);
      return;
    }
    if (act === "check-write") { checkWrite(); return; }
    if (act === "pick") {
      var tp = session.tasks[session.i];
      var pid = Number(el.getAttribute("data-id"));
      if (tp.picked.indexOf(pid) === -1 && tp.picked.length < tp.target.length) tp.picked.push(pid);
      render();
      return;
    }
    if (act === "unpick") {
      var tu = session.tasks[session.i];
      var uid = Number(el.getAttribute("data-id"));
      tu.picked = tu.picked.filter(function (x) { return x !== uid; });
      render();
      return;
    }
    if (act === "check-build") { checkBuild(); return; }
    if (act === "match") { matchTap(el.getAttribute("data-side"), Number(el.getAttribute("data-i"))); return; }
    if (act === "next") { stopSpeech(); advance(); return; }
  });

  app.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var what = el.getAttribute("data-act");
    if (what === "typing") {
      if (session && session.state === "asking") session.tasks[session.i].typed = el.value;
      return;
    }
    if (what === "talk-typing") {
      talk.draft = el.value;
      var send = app.querySelector('[data-act="talk-send"]');
      if (send) send.disabled = !el.value.trim();
      return;
    }
    if (what === "search") { pbQuery = el.value; render(); }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

    var inField = ev.target && ev.target.getAttribute &&
      ev.target.getAttribute("data-act") === "typing";
    if (inField) {
      if (ev.key === "Enter") { ev.preventDefault(); checkWrite(); }
      return;
    }

    if (view.name === "play" && session) {
      if (session.state === "checked" && (ev.key === "Enter" || ev.key === " ")) {
        ev.preventDefault();
        var nextBtn = app.querySelector('[data-act="next"]');
        if (nextBtn) nextBtn.click();
        return;
      }
      if (session.state === "asking" && /^[1-4]$/.test(ev.key)) {
        var opts = app.querySelectorAll('[data-act="answer"]');
        var chosen = opts[Number(ev.key) - 1];
        if (chosen) { ev.preventDefault(); chosen.click(); }
      }
      return;
    }

    if (view.name === "learn") {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        var stepBtn = app.querySelector('[data-act="learn-' + (ev.key === "ArrowLeft" ? "prev" : "fwd") + '"]');
        if (stepBtn && !stepBtn.disabled) { ev.preventDefault(); stepBtn.click(); }
        return;
      }
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        var lb = app.querySelector('[data-act="learn-reveal"],[data-act="learn-next"]');
        if (lb) lb.click();
      }
    }
  });

  if (speech.supported) {
    findArabicVoice();
    window.speechSynthesis.onvoiceschanged = function () {
      if (findArabicVoice()) render();
    };
  }

  if (typeof window.addEventListener === "function") {
    window.addEventListener("hashchange", function () {
      if (applyingRoute) return;
      var here = window.location.hash;
      if (here === hashFor(view)) return;
      stopSpeech();
      applyHash(here);
      window.scrollTo(0, 0);
    });
  }

  applyHash(typeof window.location !== "undefined" ? window.location.hash : "");
})();
</script>

</body>
</html>
