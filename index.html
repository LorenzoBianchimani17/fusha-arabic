  // its Arabic or its English.
  function dedupePhrases(list) {
    var seenAr = {}, seenEn = {}, out = [];
    list.forEach(function (p) {
      if (seenAr[p.ar] || seenEn[p.en]) return;
      seenAr[p.ar] = true;
      seenEn[p.en] = true;
      out.push(p);
    });
    return out;
  }

  // A phrase you keep missing is worth six draws; one you have mastered
  // is worth one. Core phrases that are not solid yet count triple on
  // top of that, so the backbone gets fixed before anything else.
  function weightOf(item) {
    var w = item.s === null ? 6 : (MAX_STRENGTH + 1 - item.s);
    if (item.core && (item.s === null || item.s < MASTERED)) w *= 3;
    return w;
  }

  function drawWeighted(items, n) {
    var bag = [];
    items.forEach(function (it) {
      var w = weightOf(it);
      for (var i = 0; i < w; i++) bag.push(it);
    });
    var out = [], used = {}, guard = 0;
    while (out.length < n && guard++ < 800) {
      var pick = bag[Math.floor(Math.random() * bag.length)];
      if (!pick) break;
      var key = pick.lesson.id + "|" + pick.ar;
      if (used[key]) continue;
      used[key] = true;
      out.push(pick);
    }
    return out;
  }

  // Core phrases prefer Write when it is switched on: recognising the
  // backbone among four options is not the same as producing it.
  function typeFor(item, types) {
    var usable = types.filter(function (t) { return canMake(item, t); });
    if (!usable.length) return [];

    var bag = [];
    var lean = earBehind();
    usable.forEach(function (t) {
      var w = TYPE_WEIGHT[t] || 1;
      // The correction is the whole point of measuring it.
      if (lean && (t === "listen" || t === "dictate")) w *= 2;
      for (var i = 0; i < w; i++) bag.push(t);
    });
    var order = [], seen = {};
    shuffle(bag).forEach(function (t) { if (!seen[t]) { seen[t] = true; order.push(t); } });

    // A core phrase has to come out of you, not just be recognised, so
    // it leads with a producing game. Alternating the two matters: Say
    // you mark yourself and are kind about it, Write is marked for you.
    if (item.core && !isPassive((item.phrase || item).ar)) {
      var produce = ["say", "write"].filter(function (t) { return usable.indexOf(t) !== -1; });
      if (produce.length) {
        // With a microphone, saying it out loud is the real thing and
        // typing it is the stand-in. Without one, Say can only mark
        // itself, so the two take turns as they always did.
        var lead = canHear() && produce.indexOf("say") !== -1 ? "say" : shuffle(produce)[0];
        order = [lead].concat(order.filter(function (t) { return t !== lead; }));
      }
    }
    return order;
  }

  function chosenLessons() {
    var want = store.chosen || [];
    var open = finishedLessons();
    var live = want.filter(function (id) {
      return open.some(function (l) { return l.id === id; });
    });
    return live;
  }

  function buildReview(fields) {
    var pool = finishedLessons();
    if (!pool.length) return null;

    var only = (fields && fields.only) || null;
    if (only && only.length) {
      pool = pool.filter(function (l) { return only.indexOf(l.id) !== -1; });
      if (!pool.length) return null;
    }

    var all = studied();
    if (only && only.length) {
      all = all.filter(function (it) { return only.indexOf(it.lesson.id) !== -1; });
      if (!all.length) return null;
    }
    var asking = askingGames();
    var types = asking.length ? asking : ["quiz"];

    var usable = all.filter(function (item) {
      return types.some(function (t) { return canMake(item, t); });
    });
    if (!usable.length) { types = ["quiz"]; usable = all; }

    function roundFor(item) {
      var options = typeFor(item, types);
      for (var i = 0; i < options.length; i++) {
        var r = makeRound(item.lesson, item, options[i]);
        if (r) return r;
      }
      return null;
    }

    var picked = [];

    // Overdue spot checks go in first, by hand. Leaving them to the
    // weighted draw made them a one-in-a-hundred event, which would
    // have turned "set aside" into "gone for good".
    var due = usable.filter(function (it) { return it.known && it.dueCheck; });
    shuffle(due).slice(0, CHECKS_PER_SESSION).forEach(function (item) {
      var r = roundFor(item);
      if (r) { r.isCheck = true; picked.push(r); }
    });

    // What you got wrong on an earlier day comes first, marked as such.
    // Left to the weighted draw it could be weeks before it came back,
    // which is exactly the wrong interval for something you just failed.
    var missed = usable.filter(function (it) {
      return !it.known && missedEarlier(it.lesson.id, it.ar);
    });
    shuffle(missed).slice(0, MISSES_FIRST).forEach(function (item) {
      var r = roundFor(item);
      if (r) { r.isMiss = true; picked.push(r); }
    });

    // The rest of the session ignores anything you have set aside.
    var open = usable.filter(function (it) { return !it.known; });
    if (!open.length) open = usable;

    // Only dialogue lines can become a Reply round, and they are a small
    // slice of the material, so left to chance the most conversational
    // game shows up least. Give it a floor.
    if (types.indexOf("dialog") !== -1) {
      var talkers = open.filter(function (it) { return canMake(it, "dialog"); });
      // While the backbone is still shaky one is enough: a Reply round is
      // never a core phrase, so seeding more of them pushes the core out
      // of its own session. Once the core is solid, conversation leads.
      var want = isCoreSolid() ? REPLIES_PER_SESSION : 1;
      drawWeighted(talkers, want).forEach(function (item) {
        var r = makeRound(item.lesson, item, "dialog");
        if (r) picked.push(r);
      });
    }

    var guard = 0;
    while (picked.length < reviewRounds() && guard++ < 40) {
      var batch = drawWeighted(open, reviewRounds() - picked.length);
      var made = 0;
      batch.forEach(function (item) {
        var r = roundFor(item);
        if (r) { picked.push(r); made++; }
      });
      if (!made) break;
    }

    // The match grid deliberately mixes topics; each phrase remembers
    // which lesson it came from so a miss can be re-asked properly.
    function mixedMatch() {
      var grid = all.filter(function (it) { return !it.known; });
      if (grid.length < MATCH_PAIRS) grid = all;
      var draw = drawWeighted(grid, MATCH_PAIRS * 3).map(function (it) {
        return { ar: it.ar, en: it.en, _lesson: it.lesson, _phrase: it.phrase };
      });
      return matchRound({ phrases: [], pool: dedupePhrases(draw).slice(0, MATCH_PAIRS) });
    }

    // The spot checks and yesterday's misses were seeded by hand and are
    // meant to lead: interleaving them with everything else buried them
    // in the middle of the session.
    // Coming back from a break, what matters is the backbone and the
    // things that have drifted furthest, in that order. Two of each, so
    // the way back in is short and recognisable rather than a wall of
    // everything that came due while you were gone.
    if (fields && fields.isBack) {
      var back = [], taken = {};
      function takeBack(list, n) {
        for (var i = 0; i < list.length && n > 0; i++) {
          var it = list[i];
          if (taken[it.lesson.id + "|" + it.ar]) continue;
          var r = roundFor(it);
          if (!r) continue;
          r.isBack = true;
          taken[it.lesson.id + "|" + it.ar] = true;
          back.push(r);
          n--;
        }
      }
      takeBack(shuffle(open.filter(function (it) { return it.core; })), 2);
      takeBack(shuffle(open.filter(function (it) {
        return isFading(it.lesson.id, it.ar);
      })).sort(function (a, b) {
        return strengthOf(a.lesson.id, a.ar) - strengthOf(b.lesson.id, b.ar);
      }), 2);
      picked = back.concat(picked);
    }

    var leads = picked.filter(function (r) { return r.isCheck || r.isMiss || r.isBack; });
    var rest = picked.filter(function (r) { return !r.isCheck && !r.isMiss && !r.isBack; });

    var tasks = [];
    var grids = (fields && fields.isBack) ? 0 : matchCount(asking);
    for (var i = 0; i < grids; i++) {
      var grid = mixedMatch();
      if (grid) tasks.push(grid);
    }
    if (asking.length) {
      tasks = tasks.concat(leads,
        interleave(rest, Math.max(0, reviewRounds() - leads.length)));
    }
    if (!tasks.length) {
      var only = mixedMatch();
      tasks = only ? [only] : [];
    }
    if (!tasks.length) return null;

    var f = fields || {};
    return newSession({
      isReview: true,
      only: only && only.length ? only : null,
      isToday: !!f.isToday,
      isBack: !!f.isBack,
      todayNext: f.todayNext || null,
      reviewPool: pool.length,
      tasks: tasks
    });
  }

  // A single game on its own, over everything you have passed. For when
  // you want twelve rounds of one thing rather than a mixed session.
  // Everything you can already open, not only what you have passed:
  // there is no reason to bar practice on a lesson you are working on.
  var SWEEP = null, SWEEP_TICK = "", TICK = 0;

  var WRITES = 0;

  function bumpTick() { TICK++; }

  // What every cached sweep of the course depends on. The tick moves on
  // each render and each save; the counts catch anything that changes
  // the store without going through either.
  function cacheKey() {
    return TICK + "|" + variety() + "|" +
      Object.keys(store.lessons || {}).length + "|" +
      Object.keys(store.passive || {}).length + "|" +
      Object.keys(store.hidden || {}).length;
  }

  function reachable() {
    var key = cacheKey();
    if (SWEEP && SWEEP_TICK === key) return SWEEP;
    SWEEP_TICK = key;
    SWEEP = reachableNow();
    return SWEEP;
  }

  function reachableNow() {
    var out = [];
    var mine = mineLesson();
    LESSONS.filter(unlocked).concat(mine ? [mine] : []).forEach(function (l) {
      phrasesOf(l).forEach(function (item) {
        if (isHidden(l.id, item.ar)) return;
        item.s = strengthOf(l.id, item.ar);
        item.fading = isFading(l.id, item.ar);
        var rec = knownRec(l.id, item.ar);
        item.known = !!rec;
        item.dueCheck = isDueCheck(rec);
        out.push(item);
      });
    });
    return out;
  }

  function canDrill(type) {
    return playable(type) && reachable().some(function (it) { return canMake(it, type); });
  }

  // The menu asks the same question of the same pool seven times over,
  // once per game, on every single render.
  var DRILLS = null, DRILLS_TICK = "";

  function drillable() {
    var key = cacheKey();
    if (DRILLS && DRILLS_TICK === key) return DRILLS;
    DRILLS_TICK = key;
    DRILLS = {};
    GAMES.forEach(function (g) { DRILLS[g.key] = canDrill(g.key); });
    return DRILLS;
  }

  function buildDrill(type) {
    var pool = LESSONS.filter(unlocked);
    if (!pool.length) return null;
    if (!playable(type)) return null;

    if (type === "match") {
      var all = reachable().filter(function (it) { return !it.known; });
      if (all.length < MATCH_PAIRS) all = reachable();
      if (!all.length) return null;
      var grids = [];
      for (var g = 0; g < 3; g++) {
        var draw = drawWeighted(all, MATCH_PAIRS * 3).map(function (it) {
          return { ar: it.ar, en: it.en, _lesson: it.lesson, _phrase: it.phrase };
        });
        grids.push(matchRound({ phrases: [], pool: dedupePhrases(draw).slice(0, MATCH_PAIRS) }));
      }
      return newSession({ isReview: true, isDrill: type, reviewPool: pool.length, tasks: grids });
    }

    var usable = reachable().filter(function (it) { return !it.known && canMake(it, type); });
    if (!usable.length) usable = reachable().filter(function (it) { return canMake(it, type); });
    if (!usable.length) return null;

    var picked = [], guard = 0;
    while (picked.length < reviewRounds() && guard++ < 40) {
      var batch = drawWeighted(usable, reviewRounds() - picked.length);
      var made = 0;
      batch.forEach(function (item) {
        var r = makeRound(item.lesson, item, type);
        if (r) { picked.push(r); made++; }
      });
      if (!made) break;
    }
    if (!picked.length) return null;
    return newSession({ isReview: true, isDrill: type, reviewPool: pool.length, tasks: picked });
  }

  // Thirty seconds in a lift is the session this app actually gets, and
  // a ten-round review with a score at the end does not fit in it. One
  // question, full screen, no counter, no score. It still counts for
  // memory: the arithmetic does not care that you only did one.
  function buildOne() {
    if (!finishedLessons().length) return null;
    var asking = askingGames();
    var types = asking.length ? asking : ["quiz"];
    var pool = studied().filter(function (it) {
      return !it.known && types.some(function (t) { return canMake(it, t); });
    });
    if (!pool.length) return null;
    var draw = drawWeighted(pool, 6);
    for (var i = 0; i < draw.length; i++) {
      var options = typeFor(draw[i], types);
      for (var j = 0; j < options.length; j++) {
        var r = makeRound(draw[i].lesson, draw[i], options[j]);
        if (r) return newSession({ isOne: true, tasks: [r] });
      }
    }
    return null;
  }

  // Every number in this app measures the process: how many rounds, how
  // weighted, how long ago. None of them measures the result. This one
  // does, and to be worth anything it has to be unhelpful: no options
  // where you could be typing, no second go, no explanation until it is
  // over, and nothing it does counts toward memory either way.
  var EXAM_LENGTH = 15;
  var EXAM_MIN = 20;

  function examPool() {
    return studied().filter(function (it) { return !it.known; });
  }

  function canExam() { return examPool().length >= EXAM_MIN; }

  function buildExam() {
    var pool = examPool();
    if (pool.length < EXAM_MIN) return null;
    // A fair sample, deliberately not weighted toward what you get
    // wrong: that weighting is what makes every other number here a
    // measure of the drilling rather than of you.
    var picked = shuffle(pool).slice(0, EXAM_LENGTH);
    var tasks = [];
    picked.forEach(function (item) {
      var p = item.phrase || item;
      var r = canMake(item, "write")
        ? writeRound(item.lesson, p)
        : quizRound(item.lesson, p);
      if (!r) return;
      // Support fades as a phrase gets stronger, which is right in a
      // lesson and wrong here: the same instrument has to be the same
      // width every time or the number means nothing. Four options,
      // always, for anything that cannot be typed.
      if (r.type === "quiz") {
        var field = r.toEnglish ? "en" : "ar";
        var wrong = distractors(visiblePhrases(item.lesson), p[field], field, 3, p.ar);
        if (wrong.length) {
          r.options = shuffle(wrong.concat([p]).map(function (x) { return x[field]; }));
        }
      }
      r.isTest = true;
      r.isLeech = false;
      tasks.push(r);
    });
    if (tasks.length < 5) return null;
    return newSession({ isTest: true, tasks: tasks });
  }

  function examHistory() { return store.exams || []; }

  function lastExam() {
    var h = examHistory();
    return h.length ? h[h.length - 1] : null;
  }

  // "Get me ready for the taxi." The mixed review is weighted across
  // everything; this is the opposite instrument: only what one thing
  // needs, and the phrases around it from the same lessons.
  function itemFor(ar) {
    var lid = lessonTeaching(ar);
    var l = lid ? lessonById(lid) : null;
    if (!l) return null;
    var found = null;
    phrasesOf(l).forEach(function (it) {
      if (!found && it.ar === ar) found = it;
    });
    if (found) {
      found.s = strengthOf(l.id, ar);
      found.known = !!knownRec(l.id, ar);
    }
    return found;
  }

  function canOpen(entry) {
    return entry.needs.every(function (ar) {
      var lid = lessonTeaching(ar);
      var l = lid ? lessonById(lid) : null;
      return !!l && unlocked(l);
    });
  }

  function canById(id) {
    for (var i = 0; i < CAN.length; i++) if (CAN[i].id === id) return CAN[i];
    return null;
  }

  function buildAimed(entry) {
    if (!entry || !canOpen(entry)) return null;
    var asking = askingGames();
    var types = asking.length ? asking : ["quiz"];

    function roundFrom(item) {
      var options = typeFor(item, types);
      for (var i = 0; i < options.length; i++) {
        var r = makeRound(item.lesson, item, options[i]);
        if (r) return r;
      }
      return null;
    }

    var tasks = [], used = {}, lessons = {};
    entry.needs.forEach(function (ar) {
      var it = itemFor(ar);
      if (!it) return;
      lessons[it.lesson.id] = it.lesson;
      var r = roundFrom(it);
      if (r) { tasks.push(r); used[ar] = true; }
    });
    if (!tasks.length) return null;

    // The phrases it needs are the point; the rest of the session is the
    // material around them, because nobody orders a coffee in isolation.
    var want = Math.max(tasks.length, Math.min(reviewRounds(), 10));
    var extra = [];
    Object.keys(lessons).forEach(function (id) {
      var l = lessons[id];
      phrasesOf(l).forEach(function (it) {
        if (used[it.ar] || isHidden(l.id, it.ar) || knownRec(l.id, it.ar)) return;
        it.s = strengthOf(l.id, it.ar);
        extra.push(it);
      });
    });
    drawWeighted(extra, Math.max(0, want - tasks.length)).forEach(function (it) {
      if (tasks.length >= want || used[it.ar]) return;
      var r = roundFrom(it);
      if (r) { tasks.push(r); used[it.ar] = true; }
    });

    return newSession({ isReview: true, aimed: entry, tasks: tasks });
  }

  // Straight from the score screen, on exactly what you just got wrong,
  // while you still remember getting it wrong.
  function buildFixup(missed) {
    var seen = {}, items = [];
    missed.forEach(function (m) {
      if (!m.lesson || seen[m.ar]) return;
      seen[m.ar] = true;
      items.push({ ar: m.ar, en: m.en, lesson: m.lesson, phrase: { ar: m.ar, en: m.en }, s: 0 });
    });
    if (!items.length) return null;

    var asking = askingGames();
    var types = asking.length ? asking : ["quiz"];
    var tasks = [];
    items.forEach(function (item) {
      var options = typeFor(item, types);
      for (var i = 0; i < options.length; i++) {
        var r = makeRound(item.lesson, item, options[i]);
        if (r) { tasks.push(r); return; }
      }
    });
    if (!tasks.length) return null;
    return newSession({ isReview: true, isFixup: true, reviewPool: 0, tasks: tasks });
  }

  /* ---------- what to do today ---------- */

  function nextLesson() {
    for (var i = 0; i < LESSONS.length; i++) {
      var r = recordOf(LESSONS[i].id);
      if (!(r && r.done) && unlocked(LESSONS[i])) return LESSONS[i];
    }
    return null;
  }

  // One decision, made for you. The core comes first, then anything
  // else slipping, then the next lesson. New lessons on top of a shaky
  // backbone do not stick.
  function todayPlan() {
    var next = nextLesson();
    if (!finishedLessons().length) return { kind: "first", next: next };
    var core = coreCounts();
    if (core.reached && core.solid < core.reached) {
      return { kind: "core", left: core.reached - core.solid, next: next };
    }
    var counts = progressCounts();
    if (counts.weak) return { kind: "revise", weak: counts.weak, next: next };
    if (next) return { kind: "lesson", next: next };
    return { kind: "polish", next: null };
  }

  function lastSeenLine() {
    var d = daysSince(store.lastDay);
    if (d === null) return "";
    if (d === 0) return "";
    if (d === 1) return "Yesterday was your last go. ";
    if (d < 7) return "It has been " + d + " days. ";
    if (d < 30) return "It has been a couple of weeks. ";
    return "It has been a while. ";
  }

  // A week away and half the course has come due. Landing in a normal
  // session while that is true is how people quietly give up.
  var AWAY_DAYS = 7;

  function backAfterBreak() {
    var d = daysSince(store.lastDay);
    return d !== null && d >= AWAY_DAYS;
  }

  function slippedWhileAway() {
    var n = 0;
    finishedLessons().forEach(function (l) {
      visiblePhrases(l).forEach(function (p) {
        if (isFading(l.id, p.ar)) n++;
      });
    });
    return n;
  }

  function todayCopy(plan) {
    if (backAfterBreak()) {
      var slipped = slippedWhileAway();
      var d = daysSince(store.lastDay);
      return {
        line: "You have been away " + (d < 14 ? d + " days" : d < 60 ? "a few weeks" : "a while") + ". " +
          (slipped
            ? slipped + " phrase" + (slipped === 1 ? " has" : "s have") + " slipped a step, which is all a break costs. " +
              "This one puts the important ones in front of you first."
            : "Nothing has fallen far. Start where you left off."),
        cta: "Ease back in"
      };
    }
    if (plan.kind === "first") {
      return { line: "Start with lesson " + lessonNo(plan.next) + ", " + plan.next.title.toLowerCase() + ".", cta: "Begin" };
    }
    if (plan.kind === "core") {
      return {
        line: lastSeenLine() + plan.left + " core phrase" + (plan.left === 1 ? "" : "s") + " still to lock in" +
          (plan.next ? ", then lesson " + lessonNo(plan.next) : "") + ".",
        cta: "Start"
      };
    }
    if (plan.kind === "revise") {
      return {
        line: lastSeenLine() + "Core is solid. " + plan.weak + " other phrase" + (plan.weak === 1 ? "" : "s") + " to revisit" +
          (plan.next ? ", then lesson " + lessonNo(plan.next) : "") + ".",
        cta: "Start"
      };
    }
    if (plan.kind === "lesson") {
      return { line: "Nothing needs revising. Lesson " + lessonNo(plan.next) + ", " + plan.next.title.toLowerCase() + ", is next.", cta: "Start" };
    }
    return { line: "Every lesson passed and nothing slipping. Keep it warm with a mixed round.", cta: "Practise" };
  }

  var CIRCUIT = [
    { go: "twins", label: "Now: pick which one you will say", why: "the course just gave you a second way to say the same thing" },
    { go: "moment", label: "Now: three situations", why: "no English to translate" },
    { go: "asked", label: "Now: five questions by ear", why: "just what they are asking" },
    { go: "make", label: "Now: make a few sentences", why: "none of them taught as a phrase" },
    { go: "numbers", label: "Now: a few numbers by ear", why: "the ones that cost money" }
  ];

  // "Next lesson" is the only thing the score screen has ever suggested,
  // and it is not always the right one. If a lesson you passed is coming
  // apart, say so and offer it by name.
  function weakestLesson(skip) {
    var worst = null, worstN = 0;
    finishedLessons().forEach(function (l) {
      if (l.isMine || (skip && l.id === skip.id)) return;
      var n = 0;
      visiblePhrases(l).forEach(function (p) {
        if (knownRec(l.id, p.ar)) return;
        var st = strengthOf(l.id, p.ar);
        if (st === null) return;
        if (st <= 1 || isFading(l.id, p.ar)) n++;
      });
      if (n > worstN) { worstN = n; worst = l; }
    });
    return worstN >= 3 ? { lesson: worst, n: worstN } : null;
  }

  function circuitNext() {
    var open = CIRCUIT.filter(function (c) {
      if (c.go === "twins") return twinsToDecide().length > 0;
      if (c.go === "moment") return openMoments().length > 0;
      if (c.go === "asked") return askPool().length > 0;
      if (c.go === "numbers") return true;
      return combos().length > 0;
    });
    if (!open.length) return null;
    if (open[0].go === "twins") return open[0];
    return open[runCount() % open.length];
  }

  function startToday() {
    var plan = todayPlan();
    if (backAfterBreak()) {
      var back = buildReview({ isToday: true, isBack: true, todayNext: plan.next });
      if (back) { session = back; go({ name: "play" }); return; }
    }
    if (plan.kind === "first" || plan.kind === "lesson") {
      go({ name: "lesson", lesson: plan.next });
      return;
    }
    var s = buildReview({ isToday: true, todayNext: plan.next });
    if (!s) { go({ name: "lesson", lesson: plan.next || LESSONS[0] }); return; }
    session = s;
    go({ name: "play" });
  }

  /* ============================================================
     FREE TALK - an interlocutor rather than an exercise. It never
     invents a word: every reply is a line the course teaches, and
     it knows what follows what because the lesson dialogues are
     already ask-and-answer pairs and the conversations are already
     ordered. When it has not understood, it says so in Arabic.
     ============================================================ */

  var TALK = null, TALK_KEY = null;

  // Which lessons the partner is allowed to know. Choosing them is the
  // point: you can see exactly how far it can go, so a wall you hit is
  // a wall you put there, not a mystery.
  function talkScope() {
    var stored = store.talkScope;
    if (stored && stored.length) {
      var valid = stored.filter(function (id) { return !!lessonById(id); });
      if (valid.length) return valid;
    }
    var passed = finishedLessons().map(function (l) { return l.id; });
    return passed.length ? passed : [LESSONS[0].id];
  }

  function setTalkScope(ids) {
    store.talkScope = ids.slice().sort(function (a, b) { return a - b; });
    save();
    TALK_KEY = null;
  }

  function talkIndex() {
    var ids = talkScope();
    var key = ids.join(",");
    if (TALK && TALK_KEY === key) return TALK;

    var chosen = LESSONS.filter(function (l) { return ids.indexOf(l.id) !== -1; });
    var all = [], seen = {}, replyTo = {}, nextAfter = {}, openers = [];
    var known = {};

    function add(ar, en, lesson) {
      if (!ar || seen[ar]) return;
      seen[ar] = true;
      all.push({ ar: ar, en: en || englishFor(ar), lesson: lesson });
    }

    chosen.forEach(function (l) {
      l.phrases.forEach(function (p) { known[p.ar] = l; });
      (l.dialogue || []).forEach(function (d) { known[d.ask] = l; known[d.reply] = l; });
    });

    chosen.forEach(function (l) {
      l.phrases.forEach(function (p) { add(p.ar, p.en, l); });
      (l.dialogue || []).forEach(function (d) {
        add(d.ask, d.askEn, l);
        add(d.reply, d.en, l);
        // You say the opener, it gives you the answer.
        if (!replyTo[d.ask]) replyTo[d.ask] = { ar: d.reply, en: d.en, lesson: l };
      });
    });

    // A conversation only contributes the turns whose lines are all
    // inside the chosen lessons, so it can never answer with a word
    // you have not put in play.
    CONVOS.forEach(function (c) {
      c.turns.forEach(function (t, i) {
        if (!known[t.say] || !known[t.reply]) return;
        add(t.say, t.sayEn, known[t.say]);
        add(t.reply, t.replyEn, known[t.reply]);
        if (!replyTo[t.say]) replyTo[t.say] = { ar: t.reply, en: t.replyEn, lesson: known[t.reply] };
        var nxt = c.turns[i + 1];
        if (nxt && known[nxt.say] && !nextAfter[t.reply]) {
          nextAfter[t.reply] = { ar: nxt.say, en: nxt.sayEn, lesson: known[nxt.say] };
        }
      });
      if (c.turns[0] && known[c.turns[0].say]) openers.push({ ar: c.turns[0].say, en: c.turns[0].sayEn });
    });

    // With a narrow scope there may be no scripted opener at all; any
    // line that has an answer will do to get things going.
    if (!openers.length) {
      Object.keys(replyTo).slice(0, 12).forEach(function (ar) {
        openers.push({ ar: ar, en: englishFor(ar) });
      });
    }
    if (!openers.length && all.length) openers.push({ ar: all[0].ar, en: all[0].en });

    TALK = { all: all, replyTo: replyTo, nextAfter: nextAfter, openers: openers, lessons: chosen };
    TALK_KEY = key;
    return TALK;
  }

  // Score what you said against a phrase, on whichever alphabet you
  // gave us: the recogniser returns Arabic, the keyboard gives Latin.
  function overlap(target, input) {
    var want = normalise(target).split(" ").filter(Boolean);
    var got = normalise(input).split(" ").filter(Boolean);
    if (!want.length || !got.length) return 0;
    var pool = got.slice(), hit = 0;
    want.forEach(function (w) {
      var i = pool.indexOf(w);
      if (i !== -1) { hit++; pool.splice(i, 1); }
    });
    return hit / Math.max(want.length, got.length);
  }

  // Someone learning Levantine says it in Levantine. Both forms of the
  // phrase count, spoken or typed, or free talk would only understand
  // the fus-ha it is teaching you to leave behind.
  function matchScore(input, phrase) {
    var shown = disp(phrase.ar);
    if (/[\u0621-\u064A]/.test(input)) {
      var a = heardScore(input, SCRIPT[phrase.ar] || "");
      var b = heardScore(input, spk(phrase.ar) || "");
      return b > a ? b : a;
    }
    var x = overlap(phrase.ar, input);
    if (shown === phrase.ar) return x;
    var y = overlap(shown, input);
    return y > x ? y : x;
  }

  function bestMatches(input, n) {
    if (!String(input || "").trim()) return [];
    var idx = talkIndex();
    var scored = idx.all.map(function (p) { return { p: p, score: matchScore(input, p) }; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.filter(function (x) { return x.score > 0.34; }).slice(0, n || 3);
  }

  var TALK_MATCH = 0.6;

  // What it says back. Never a word you have not been taught.
  function replyFor(ar) {
    var idx = talkIndex();
    if (idx.replyTo[ar]) return { line: idx.replyTo[ar], why: "answer" };
    if (idx.nextAfter[ar]) return { line: idx.nextAfter[ar], why: "carry on" };
    return null;
  }

  // In order: say it again, what do you mean, and only then I do not
  // understand, which is the one that ends the thread. All three are in
  // lesson 27, so being repaired at is itself practice.
  var REPAIRS = [
    { ar: "Marra ùkhra, min fàdlik", en: "Once more, please",
      note: "It did not catch that. Say it again, or pick one below." },
    { ar: "Màdha yaʿni?", en: "What does that mean?",
      note: "Still lost. Try one of the lines below: those it will understand." },
    { ar: "Là àfham", en: "I do not understand",
      note: "That one is beyond it. It is starting something else." }
  ];

  var talk = null;

  // What answers the line now on the table, drawn from the lessons in
  // play, so a suggestion is never a word you have not been given.
  function suggestionsAfter(ar) {
    var idx = talkIndex();
    var out = [];
    var direct = idx.replyTo[ar];
    if (direct) out.push({ ar: direct.ar, en: direct.en });
    // Anything else that is known to follow this line elsewhere.
    idx.all.forEach(function (p) {
      if (out.length >= 3) return;
      if (p.ar === ar) return;
      if (out.some(function (x) { return x.ar === p.ar; })) return;
      if (idx.nextAfter[p.ar] && idx.nextAfter[p.ar].ar === ar) out.push({ ar: p.ar, en: p.en });
    });
    if (!out.length) {
      shuffle(Object.keys(idx.replyTo)).slice(0, 2).forEach(function (k) {
        out.push({ ar: k, en: englishFor(k) });
      });
    }
    return out.slice(0, 3);
  }

  function newTalk() {
    var was = talk && talk.pickOpen;
    var idx = talkIndex();
    var open = idx.openers.length ? shuffle(idx.openers)[0] : { ar: "Marhàban", en: "Hello" };
    return {
      turns: [{ who: "them", ar: open.ar, en: open.en }],
      draft: "",
      heard: null,
      options: [],
      suggest: was === undefined ? suggestionsAfter(open.ar) : suggestionsAfter(open.ar),
      stuck: 0,
      pickOpen: !!was
    };
  }

  function talkSay(ar) {
    var idx = talkIndex();
    var known = null;
    idx.all.forEach(function (p) { if (p.ar === ar) known = p; });
    talk.turns.push({ who: "you", ar: ar, en: known ? known.en : englishFor(ar) });

    var r = replyFor(ar);
    if (r) {
      talk.stuck = 0;
      talk.topic = null;
      talk.turns.push({ who: "them", ar: r.line.ar, en: r.line.en, why: r.why });
    } else {
      // Not understanding is a real moment in a real conversation, and
      // the course now teaches its way out of it. So the partner does
      // what a person does: asks for it again, then asks what you meant,
      // and only then gives up and changes the subject.
      talk.stuck++;
      // whatever was on the table before you spoke stays on the table
      if (!talk.topic) {
        for (var b = talk.turns.length - 2; b >= 0; b--) {
          if (talk.turns[b].who === "them") { talk.topic = talk.turns[b].ar; break; }
        }
      }
      var fix = REPAIRS[Math.min(talk.stuck, REPAIRS.length) - 1];
      talk.turns.push({ who: "them", ar: fix.ar, en: fix.en, repair: fix.note });
      if (talk.stuck >= REPAIRS.length) {
        var open = shuffle(talkIndex().openers)[0];
        if (open) talk.turns.push({ who: "them", ar: open.ar, en: open.en });
        talk.topic = null;
        talk.stuck = 0;
      }
    }
    // Whatever happened, show what you could have said here. A wall you
    // are shown a way over teaches something; a wall alone does not.
    talk.suggest = suggestionsAfter(talk.topic || talk.turns[talk.turns.length - 1].ar);
    talk.draft = "";
    talk.heard = null;
    talk.options = [];
    if (canSpeak()) {
      var last = talk.turns[talk.turns.length - 1];
      speak(last.ar);
    }
  }

  /* ---------- conversations ---------- */

  function convoOpen(c) {
    return (c.needs || []).every(function (id) {
      var r = recordOf(id);
      return !!(r && r.done);
    });
  }

  function convoById(id) {
    if (id === "daily") return dailyConvo();
    for (var i = 0; i < CONVOS.length; i++) if (CONVOS[i].id === id) return CONVOS[i];
    return null;
  }

  // The nineteen written conversations never change, and after a
  // fortnight that is what is wrong with them. This one is stitched
  // from exchanges you have actually met, four of them, a different
  // four every day. It is not a story and does not pretend to be one.
  var DAILY_TURNS = 4;
  var dailyMade = null;

  function seededRandom(seed) {
    var x = (seed * 2654435761 + 1013904223) % 4294967296;
    return function () {
      x = (x * 1664525 + 1013904223) % 4294967296;
      return x / 4294967296;
    };
  }

  function dailyPool() {
    var seen = {}, out = [];
    finishedLessons().forEach(function (l) {
      (l.dialogue || []).forEach(function (d) {
        if (seen[d.reply] || isHidden(l.id, d.reply)) return;
        seen[d.reply] = true;
        out.push({ lesson: l, ex: d });
      });
    });
    return out;
  }

  function dailyConvo() {
    if (dailyMade && dailyMade.day === today() && dailyMade.who === people.current) {
      return dailyMade.convo;
    }
    var pool = dailyPool();
    if (pool.length < 3) return null;

    var rnd = seededRandom(today() + 1);
    var order = pool.slice();
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var picked = order.slice(0, Math.min(DAILY_TURNS, order.length));
    // Course order, so a greeting opens it and whatever you learned
    // last comes at the end. That much shape is honest; a plot is not.
    picked.sort(function (a, b) { return LESSONS.indexOf(a.lesson) - LESSONS.indexOf(b.lesson); });

    var convo = {
      id: "daily",
      title: "Today's conversation",
      setting: "Four exchanges you have already met, one after another. Not a story: a run at replying without stopping.",
      needs: [],
      isDaily: true,
      turns: picked.map(function (p) {
        return { say: p.ex.ask, sayEn: p.ex.askEn, reply: p.ex.reply, replyEn: p.ex.en };
      })
    };
    dailyMade = { day: today(), who: people.current, convo: convo };
    return convo;
  }

  function dailyDone() { return store.daily === today(); }

  /* ---------- the diary ---------- */

  var DIARY_KEEP = 60;
  var UNSEEN_AFTER = 21;

  function sessionKind() {
    return session.isTest ? "test"
      : session.isFixup ? "fixup"
      : session.isOne ? "one"
      : session.isBack ? "back"
      : session.isToday ? "today"
      : session.isDrill ? "drill"
      : session.isConvo ? (session.convo && session.convo.isDaily ? "daily" : "convo")
      : session.isReview ? "review"
      : "lesson";
  }

  function sessionDelta() {
    var before = session.before || {};
    var d = { up: 0, down: 0, fresh: 0, solid: 0 };
    Object.keys(before).forEach(function (k) {
      var cut = k.indexOf("|");
      var lid = k.slice(0, cut), ar = k.slice(cut + 1);
      var was = before[k];
      var now = strengthOf(lid, ar);
      if (now === null) return;
      if (was === null) { d.fresh++; if (now >= 4) d.solid++; return; }
      if (now > was) d.up++;
      if (now < was) d.down++;
      if (was < 4 && now >= 4) d.solid++;
    });
    return d;
  }

  function diary() { return store.diary || []; }

  function noteDiary(score) {
    var d = sessionDelta();
    if (session.startedAt) d.secs = Math.round((Date.now() - session.startedAt) / 1000);
    d.day = today();
    d.kind = sessionKind();
    d.score = score;
    d.n = session.tasks.length;
    if (session.lesson) d.lesson = session.lesson.id;
    store.diary = diary().concat([d]).slice(-DIARY_KEEP);
  }

  // A week of it, added up. Not a streak: a streak measures attendance,
  // and attendance is not the thing that was in doubt.
  function weekSummary() {
    var since = today() - 6;
    var week = diary().filter(function (d) { return d.day >= since; });
    var out = { sessions: week.length, up: 0, down: 0, fresh: 0, solid: 0, days: {}, tests: [] };
    week.forEach(function (d) {
      out.up += d.up || 0;
      out.down += d.down || 0;
      out.fresh += d.fresh || 0;
      out.solid += d.solid || 0;
      out.days[d.day] = true;
      if (d.kind === "test") out.tests.push(d);
    });
    out.onDays = Object.keys(out.days).length;
    return out;
  }

  // The third question the diary has to answer, and the only one the
  // app could always have answered: what have you simply not seen?
  function unseen(limit) {
    var out = [];
    finishedLessons().forEach(function (l) {
      visiblePhrases(l).forEach(function (p) {
        if (knownRec(l.id, p.ar)) return;
        var rec = rawStrength(l.id, p.ar);
        var since = rec ? daysSince(rec.day) : null;
        if (rec && (since === null || since < UNSEEN_AFTER)) return;
        out.push({ lesson: l, ar: p.ar, en: p.en, since: rec ? since : null });
      });
    });
    out.sort(function (a, b) {
      if ((a.since === null) !== (b.since === null)) return a.since === null ? -1 : 1;
      return (b.since || 0) - (a.since || 0);
    });
    return limit ? out.slice(0, limit) : out;
  }

  /* ---------- what you can do ---------- */

  var CAN_SOLID = 3;

  // The course order is fixed and should be: it builds. What is not
  // fixed is what the app puts in front of you next, and that depends
  // on why you are here.
  var WANTS = [
    { key: "travel", label: "I am going there", why: "the street, the taxi, the bill, the chemist" },
    { key: "someone", label: "Someone I want to talk to", why: "the questions after hello, and what keeps a conversation going" },
    { key: "work", label: "Work", why: "arranging, asking permission, being understood plainly" }
  ];

  function wantKey() {
    var w = store.want;
    for (var i = 0; i < WANTS.length; i++) if (WANTS[i].key === w) return w;
    return null;
  }

  function wantInfo() {
    var k = wantKey();
    for (var i = 0; i < WANTS.length; i++) if (WANTS[i].key === k) return WANTS[i];
    return null;
  }

  function forWant(entry) {
    var k = wantKey();
    if (!k || !entry.want) return !!k ? false : false;
    return entry.want.indexOf(k) !== -1;
  }

  // The next thing worth doing for the reason you gave: the closest
  // capability you have not got yet.
  function nextForWant() {
    if (!wantKey()) return null;
    var mine = canStates().filter(function (c) {
      return c.level !== "yes" && forWant(c.entry) && canOpen(c.entry);
    });
    if (!mine.length) return null;
    mine.sort(function (a, b) { return (b.have / b.n) - (a.have / a.n); });
    return mine[0];
  }

  // A capability asks for a job to be covered, not for one particular
  // phrase. Where the app has told you to keep one of two and park the
  // other, the one you kept counts.
  function bestFor(ar) {
    var best = { st: null, met: false };
    var look = [ar];
    TWINS.forEach(function (t) {
      if (t.members.indexOf(ar) === -1) return;
      t.members.forEach(function (m) { if (look.indexOf(m) === -1) look.push(m); });
    });
    look.forEach(function (one) {
      var lid = lessonTeaching(one);
      if (!lid) return;
      var st = knownRec(lid, one) ? MAX_STRENGTH : strengthOf(lid, one);
      if (st === null) return;
      best.met = true;
      if (best.st === null || st > best.st) best.st = st;
    });
    return best;
  }

  function canState(entry) {
    var have = 0, met = 0, open = 0;
    entry.needs.forEach(function (ar) {
      var lid = lessonTeaching(ar);
      var l = lid ? lessonById(lid) : null;
      var r = l ? recordOf(l.id) : null;
      if (r && r.done) open++;
      var b = bestFor(ar);
      if (b.met) {
        met++;
        if (b.st !== null && b.st >= CAN_SOLID) have++;
      }
    });
    var n = entry.needs.length;
    return {
      entry: entry,
      have: have,
      met: met,
      open: open,
      n: n,
      level: have === n ? "yes" : (open === n && have >= 1) || have >= n - 1 ? "nearly" : "no"
    };
  }

  function canStates() { return CAN.map(canState); }

  function canAt(level) {
    return canStates().filter(function (c) { return c.level === level; });
  }

  // The sentence the whole screen exists to produce.
  function canSentence() {
    var yes = canAt("yes");
    if (!yes.length) return "Nothing yet that you could carry through on your own.";
    var list = yes.slice(0, 3).map(function (c) { return c.entry.can; });
    var rest = yes.length - list.length;
    return "You can " + list.join(", ").replace(/,([^,]*)$/, " and$1") +
      (rest > 0 ? ", and " + rest + " more" : "") + ".";
  }

  function cannotSentence() {
    var no = canAt("no");
    if (!no.length) return "";
    var list = no.slice(0, 2).map(function (c) { return c.entry.can; });
    return "You cannot yet " + list.join(", or ") + ".";
  }

  // The whole exchange at natural speed, then questions about it. The
  // other games test one phrase at a time; following a conversation you
  // cannot pause is a different skill, and the one you actually need.
  function buildFollow(convo) {
    var lines = [];
    convo.turns.forEach(function (t) {
      lines.push({ who: "them", ar: t.say, en: t.sayEn });
      lines.push({ who: "you", ar: t.reply, en: t.replyEn });
    });

    // Ask about lines from the exchange, with wrong answers taken from
    // the other conversations so they are plausible but not in this one.
    var elsewhere = [];
    CONVOS.forEach(function (c) {
      if (c === convo) return;
      c.turns.forEach(function (t) { elsewhere.push(t.sayEn, t.replyEn); });
    });
    var mine = lines.map(function (l) { return l.en; });

    var asked = shuffle(lines).slice(0, Math.min(3, lines.length));
    var tasks = asked.map(function (line, i) {
      var wrong = [];
      shuffle(elsewhere).forEach(function (e) {
        if (wrong.length >= 3 || mine.indexOf(e) !== -1 || wrong.indexOf(e) !== -1) return;
        wrong.push(e);
      });
      return {
        type: "follow",
        points: 1,
        convo: convo,
        lines: lines,
        played: false,
        first: i === 0,
        answer: line.en,
        options: shuffle(wrong.concat([line.en]))
      };
    });

    return newSession({ isConvo: true, isFollow: true, convo: convo, tasks: tasks });
  }

  function convoTurns(convo) {
    var out = convo.turns.slice();
    // The branch supplies the last turn. Until you choose, it is the
    // first way it can go.
    var last = out[out.length - 1];
    if (last && last.alts) out.push(last.alts[0].next);
    return out;
  }

  function buildConvo(convo) {
    var elsewhere = [];
    CONVOS.forEach(function (c) {
      c.turns.forEach(function (t) {
        elsewhere.push(t.reply);
        (t.alts || []).forEach(function (a) { elsewhere.push(a.reply); });
      });
    });

    var tasks = convoTurns(convo).map(function (turn, idx) {
      var near = convo.turns.map(function (t) { return t.reply; });
      var wrong = [];
      shuffle(near).concat(shuffle(elsewhere)).forEach(function (r) {
        if (wrong.length >= 2 || r === turn.reply || wrong.indexOf(r) !== -1) return;
        // never offer another phrase that answers the same thing
        if (sameJob(r, turn.reply)) return;
        if (turn.alts && turn.alts.some(function (a) { return a.reply === r; })) return;
        wrong.push(r);
      });
      // Support fades everywhere else once a phrase is solid, and a
      // conversation is exactly where picking from three is least like
      // the thing you are training for.
      var lid = lessonTeaching(turn.reply);
      var st = lid ? strengthOf(lid, turn.reply) : null;
      var produce = st !== null && st >= MASTERED;
      // A turn with alts has more than one right answer, and each one
      // leads somewhere else. Producing it from memory would hide the
      // choice, so this one always shows what the choices are.
      var answers = turn.alts ? turn.alts.map(function (a) { return a.reply; }) : null;
      var options = answers
        ? shuffle(answers.concat(wrong.slice(0, 1)))
        : shuffle(wrong.concat([turn.reply]));
      return {
        produce: answers ? false : produce,
        typed: "",
        type: "convoturn",
        points: 1,
        srcLesson: lessonById(lessonTeaching(turn.reply)),
        convo: convo,
        turn: turn,
        idx: idx,
        alts: turn.alts || null,
        answers: answers,
        answer: turn.reply,
        options: options
      };
    });

    return newSession({ isConvo: true, convo: convo, tasks: tasks });
  }

  var restoreNote = null;

  function backupCode() {
    var key = WRITES + "|" + people.current;
    if (BACKUP !== null && BACKUP_KEY === key) return BACKUP;
    BACKUP_KEY = key;
    BACKUP = backupCodeNow();

  function backupCodeNow() {
    var json = JSON.stringify(store);
    try {
      if (typeof window.btoa === "function") {
        return "fusha1:" + window.btoa(unescape(encodeURIComponent(json)));
      }
    } catch (e) { /* fall through to plain text */ }
    return json;
  }

  function readBackup(text) {
    var raw = String(text || "").trim();
    if (!raw) return null;
    if (raw.indexOf("fusha1:") === 0) {
      try { raw = decodeURIComponent(escape(window.atob(raw.slice(7)))); }
      catch (e) { return null; }
    }
    try {
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || typeof parsed.lessons !== "object") return null;
      return parsed;
    } catch (e) { return null; }
  }

  function applyRestore(text) {
    var parsed = readBackup(text);
    if (!parsed) {
      restoreNote = { tone: "bad", text: "That does not look like a backup code. Nothing was changed." };
      render();
      return;
    }
    if (!window.confirm("Replace everything on this profile with the backup?")) {
      restoreNote = { tone: "bad", text: "Left as it was." };
      render();
      return;
    }
    store = parsed;
    if (!store.lessons) store.lessons = {};
    save();
    var n = Object.keys(store.lessons).filter(function (k) { return store.lessons[k].done; }).length;
    restoreNote = { tone: "ok", text: "Restored. " + n + " lesson" + (n === 1 ? "" : "s") + " marked as passed." };
    render();
  }

  // A code you have to select and copy by hand is a backup nobody
  // takes. This hands you a file instead, and reads one back.
  function canFile() {
    return typeof document.createElement === "function" &&
      typeof window.Blob === "function" &&
      typeof URL !== "undefined" && !!URL.createObjectURL;
  }

  function fileName() {
    var who = currentPerson() ? currentPerson().name.replace(/[^A-Za-z0-9]+/g, "-").toLowerCase() : "";
    return "fusha-" + (who || "progress") + ".txt";

  function saveByLink(text) {
    if (!canFile()) {
      restoreNote = { tone: "bad", text: "This browser will not let the page hand you a file. The code above still works." };
      render();
      return;
    }
    try {
      var blob = new window.Blob([text], { type: "text/plain" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName();
      if (document.body && document.body.appendChild) document.body.appendChild(a);
      a.click();
      if (document.body && document.body.removeChild) document.body.removeChild(a);
      if (typeof window.setTimeout === "function") {
        window.setTimeout(function () {
          try { URL.revokeObjectURL(url); } catch (e) { /* already gone */ }
        }, 2000);
      }
      // A page cannot see whether the file arrived, and inside some
      // viewers it never does. Saying "saved" would be a guess.
      restoreNote = { tone: "ok", text: "Asked for the file. If nothing arrived, this viewer blocks downloads from the page, and the code above still works." };
    } catch (e) {
      restoreNote = { tone: "bad", text: "The download was refused here. The code above still works." };
    }
    render();
  }

  function saveToFile() {
    var text = backupCode();
    // Inside the artifact viewer the page cannot hand you a file on its
    // own, and there is a proper door for it that asks you first.
    var host = typeof window.claude !== "undefined" ? window.claude : null;
    if (host && typeof host.use === "function") {
      try {
        host.use("downloads").then(function (d) {

  function readFile(file) {
    if (!file) return;

    var fr = new window.FileReader();

    fr.onerror = function () {
      restoreNote = { tone: "bad", text: "That file would not open. Nothing was changed." };
      render();
    };
    try { fr.readAsText(file); }
    catch (e) {
      restoreNote = { tone: "bad", text: "That file would not open. Nothing was changed." };
      render();
    }
  }

  // Pressing Start and finding out afterwards is fine once. A line
  // saying what is in there lets you decide whether now is the moment.
  function sessionPeek() {
    var pool = finishedLessons();
    if (!pool.length) return "";
    var open = studied().filter(function (it) { return !it.known; });
    if (!open.length) return "";
    var core = 0, missed = 0, fresh = 0, fading = 0;
    open.forEach(function (it) {
      if (it.core) core++;
      if (missedEarlier(it.lesson.id, it.ar)) missed++;
      if (it.s === null) fresh++;
      else if (it.fading) fading++;
    });
    // What can honestly be said in advance: the length, what is seeded
    // by hand at the front, and how big the bag behind it is.
    var lead = Math.min(missed, MISSES_FIRST);
    var checks = studied().filter(function (it) { return it.known && it.dueCheck; }).length;
    var bits = [reviewRounds() + " rounds from " + open.length + " phrases"];
    if (lead) bits.push(lead + " you missed recently lead");
    if (checks) bits.push(Math.min(checks, CHECKS_PER_SESSION) + " due a check");
    if (backAfterBreak()) bits.push("core and the most faded first");
    else if (core) bits.push("core comes up most");
    if (earBehind()) bits.push("leaning on listening");
    return '<p class="today-peek">' + esc(bits.join(" · ")) + "</p>";
  }

      }).join("") + "</span>" +
      "</div>" +
      '<button class="btn today-go" data-act="today">' + esc(copy.cta) + "</button>" +
      "</div>" + sessionPeek();
  }

  function coreHTML() {
    var c = coreCounts();
    if (!c.reached) return "";
    var pct = Math.round(c.solid / c.reached * 100);
    var done = c.solid >= c.reached;
    var note = done
      ? "Solid. Everything you have reached is holding."
      : "The phrases that carry a conversation on their own. These come up first.";
    return '<div class="core">' +
      '<div class="core-body">' +
      '<div class="core-top"><span class="core-label">Core</span>' +
      '<span class="core-count">' + c.solid + " / " + c.reached + "</span></div>" +
      '<div class="core-bar' + (done ? " is-done" : "") + '"><i style="width:' + pct + '%"></i></div>' +
      '<span class="core-note">' + esc(note) + "</span>" +
      "</div></div>";
  }

  function varietyHTML(compact) {
    var cur = variety();
    var info = varietyInfo();
    var cov = varietyCoverage();
    var chips = VARIETIES.map(function (v) {
      var on = v.key === cur;
      return '<button class="pill pill--md chip vchip' + (on ? " is-on" : "") + '" data-act="variety" data-id="' + v.key +
        '" aria-pressed="' + (on ? "true" : "false") + '" title="' + esc(v.where) + '">' +
        '<span class="tick" aria-hidden="true"></span>' + esc(v.label) + "</button>";
    }).join("");

    return '<div class="picker variety-pick">' +
      '<div class="picker-head"><span>Which Arabic</span>' +
      '<span class="picker-note">' + esc(compact ? "" : "pick before you study") + "</span></div>" +
      '<div class="chips">' + chips + "</div>" +
      '<p class="variety-where">' + esc(info.where) + "</p>" +
      (cov
        ? '<p class="variety-where">' + cov.have + " of " + cov.total + " phrases are said differently in " +
          esc(info.label) + ", including " + cov.coreHave + " of the " + cov.coreTotal + " core ones. " +
          (cov.open
            ? cov.same + " have been checked and come out the same; the other " + cov.open +
              " have not been looked at yet, and you get fus&#183;ha for those."
            : "Every one of the other " + cov.same +
              " has been checked and comes out word for word the same, so nothing here is fus&#183;ha by accident.") +
          " Your progress follows you across all four.</p>"
        : "") +
      "</div>";
  }

  function pickerHTML(note) {
    var g = games();
    var on = GAMES.filter(function (x) { return !x.drillOnly && g[x.key]; }).length;
    return '<div class="picker">' +
      '<div class="picker-head"><span>Games</span><span class="picker-note">' + esc(note) + "</span></div>" +
      (playable("listen") ? "" :
        '<div class="picker-warn">Listen needs an Arabic voice on this device. See <b>About the audio</b> below.</div>') +
      '<div class="chips">' + GAMES.filter(function (x) { return !x.drillOnly; }).map(function (x) {
        var isOn = g[x.key];
        var lastOne = isOn && on === 1;
        return '<button class="pill pill--md chip' + (isOn ? " is-on" : "") + '" data-act="game" data-key="' + x.key +
          '" aria-pressed="' + (isOn ? "true" : "false") +
          '" title="' + esc(lastOne ? "Keep at least one game switched on" : x.hint) + '">' +
          '<span class="tick" aria-hidden="true"></span>' + esc(x.label) + "</button>";
      }).join("") + "</div></div>";
  }

  function reviewHTML() {
    var pool = finishedLessons();
    var rv = store.review || { best: 0, runs: 0 };
    var head = '<span class="review-body">' +
      '<span class="eyebrow">Mixed review</span>' +
      '<span class="review-title">Everything you have passed</span>';

    if (!pool.length) {
      return '<div class="review is-off">' + head +
        '<span class="review-meta">Pass your first lesson to open this.</span>' +
        "</span></div>";
    }

    var counts = progressCounts();
    var core = coreCounts();
    var meta;
    if (core.reached && core.solid < core.reached) {
      meta = "Draws from all " + pool.length + " finished lesson" + (pool.length === 1 ? "" : "s") +
        ", core phrases first.";
    } else if (counts.weak) {
      meta = counts.weak === 1
        ? "1 phrase needs work, and it comes up most."
        : counts.weak + " phrases need work, and they come up most.";
    } else {
      meta = pool.length + " lesson" + (pool.length === 1 ? "" : "s") +
        " in the pool, weighted toward what you get wrong.";
    }

    return '<button class="review is-lead" data-go="review">' + head +
      '<span class="review-meta">' + esc(meta) + "</span></span>" +
      (rv.runs
        ? '<span class="pill pill--tag review-score">' + rv.best + "%</span>"
        : '<span class="lesson-lock" aria-hidden="true">&rarr;</span>') +
      "</button>";
  }

  // Four ways in that are neither the lesson nor the review. As cards
  // they turned the home screen back into a pile; as a row of four they
  // are one tap away and take four lines.
  function sideHTML(dest, id, title, meta) {
    return '<button class="side" data-go="' + dest + '"' +
      (id ? ' data-id="' + id + '"' : "") + ">" +
      '<span class="side-t">' + esc(title) + "</span>" +
      '<span class="side-m">' + esc(meta) + "</span></button>";
  }

  // Opening the app and being handed a menu is a small tax on every
  // session. If you were here yesterday and not yet today, the first
  // thing can be a question instead.
  function coldOpen() {
    if (!store.coldOpen) return "";
    if (!finishedLessons().length) return "";
    var d = daysSince(store.lastDay);
    if (d === 0 || d === null) return "";
    var one = buildOne();
    if (!one) return "";
    return '<div class="cold-open">' +
      '<span class="eyebrow">Before anything else</span>' +
      '<p class="cold-line">One question, now, and then the rest of the screen.</p>' +
      '<div class="btn-row"><button class="btn btn-wide" data-go="one">Ask me</button></div>' +
      "</div>";
  }

  function sidesHTML() {
    if (!finishedLessons().length) return "";
    var out = "";
    var c = dailyConvo();
    if (c) {
      out += sideHTML("convo", "daily", "Today's conversation",
        dailyDone() ? "Done. Tomorrow, four others" : c.turns.length + " replies you know, straight through");
    }
    out += sideHTML("one", null, "One phrase", "A single question, no score");
    if (canExam()) {
      var last = lastExam();
      out += sideHTML("test", null, "The test",
        last ? "Last time " + last.score + "%, and no help" : EXAM_LENGTH + " at random, with no help");
    }
    if (finishedLessons().length > 1) {
      var picked = chosenLessons();
      out += sideHTML("choose", null, "Choose your lessons",
        picked.length ? picked.length + " picked, and only those" : "Draw from the ones you name");
    }
    var sits = openMoments().length;
    if (sits) {
      out += sideHTML("moment", null, "What would you say?",
        sits + " situations, no English to translate");
    }
    var madeN = combos().length;
    if (madeN) {
      out += sideHTML("make", null, "Make a sentence",
        madeN + " none of them taught as a phrase");
    }
    var undecided = twinsToDecide().length;
    if (undecided) {
      out += sideHTML("twins", null, "One job, several phrases",
        undecided + " to decide: keep one, recognise the rest");
    }
    out += sideHTML("can", null, "What you can do",
      canAt("yes").length + " of " + CAN.length + " things, not phrases");
    var w = weekSummary();
    out += sideHTML("diary", null, "What changed",
      w.sessions
        ? "This week: " + (w.solid ? w.solid + " solid" : "none solid") +
          (w.down ? ", " + w.down + " slipped" : "")
        : "A line after every session");
    return '<div class="sides">' + out + "</div>";
  }

  // One line, in the only place it can be read honestly: right after
  // the session that produced it.
  function deltaLine(d) {
    if (!d) return "";
    var bits = [];
    if (d.solid) bits.push(d.solid + " went solid");
    if (d.up && d.up > d.solid) bits.push((d.up - d.solid) + " climbed a step");
    if (d.fresh) bits.push(d.fresh + " met for the first time");
    if (d.down) bits.push(d.down + " slipped back");
    if (!bits.length) return "Nothing moved: everything in it was already where it was.";
    return bits.join(", ").replace(/,([^,]*)$/, " and$1") + ".";
  }

  function diaryRow(d) {
    var when = daysSince(d.day);
    var label = when === 0 ? "Today" : when === 1 ? "Yesterday" : when + " days ago";
    var what = d.kind === "test" ? "the test"
      : d.kind === "lesson" ? "lesson " + (lessonById(d.lesson) ? lessonNo(lessonById(d.lesson)) : "?")
      : d.kind === "daily" ? "today's conversation"
      : d.kind === "back" ? "coming back"
      : d.kind === "one" ? "one phrase"
      : d.kind === "today" ? "today"
      : d.kind === "fixup" ? "a patch-up"
      : d.kind === "drill" ? "one game"
      : d.kind === "convo" ? "a conversation"
      : "mixed review";
    return '<div class="diary-row">' +
      '<span class="diary-when">' + esc(label) + "</span>" +
      '<span class="diary-body"><span class="diary-what">' + esc(what) +
      (typeof d.score === "number" ? ", " + d.score + "%" : "") + "</span>" +
      '<span class="diary-delta">' + esc(deltaLine(d)) + "</span></span></div>";
  }

  // A session lists what you missed and then loses it. The one list you
  // actually want is the one that spans sessions.
  function stuckList(limit) {
    var out = [];
    finishedLessons().forEach(function (l) {
      visiblePhrases(l).forEach(function (p) {
        if (knownRec(l.id, p.ar)) return;
        var n = missCount(l.id, p.ar);
        if (!n) return;
        out.push({ lesson: l, ar: p.ar, en: p.en, misses: n, s: strengthOf(l.id, p.ar) });
      });
    });
    out.sort(function (a, b) { return b.misses - a.misses; });
    return limit ? out.slice(0, limit) : out;
  }

  function diaryHTML() {
    var log = diary().slice().reverse();
    var w = weekSummary();
    var cold = unseen(10);
    return topbarHTML("What changed") +
      (log.length
        ? '<p class="pb-lead">' + w.sessions + " session" + (w.sessions === 1 ? "" : "s") +
          " on " + w.onDays + " day" + (w.onDays === 1 ? "" : "s") + " this week. " +
          (w.solid ? w.solid + " went solid" : "Nothing went solid") +
          (w.down ? ", " + w.down + " slipped" : "") +
          (w.fresh ? ", " + w.fresh + " met for the first time" : "") + ".</p>"
        : '<p class="pb-lead">Nothing yet. Finish a session and it will start keeping count.</p>') +
      (modePct("ear") !== null && modePct("eye") !== null
        ? '<div class="can-group"><h2 class="can-head">Your ear and your eye</h2>' +
          '<p class="can-note">' + modePct("eye") + "% right when the phrase was on the page, " +
          modePct("ear") + "% when it was only said to you" +
          (earBehind()
            ? ". That is the gap that decides whether you can hold a conversation, so listening and" +
              " dictation are coming up twice as often until it closes."
            : earGap() !== null && earGap() <= -GAP_AT
              ? ". Your ear is ahead of your eye, which is unusual and worth nothing but a mention."
              : ". Close enough that neither one is holding the other back.") + "</p>" +
          '<div class="mode-bars">' +
          '<div class="mode-bar"><span>On the page</span><i style="width:' + modePct("eye") + '%"></i></div>' +
          '<div class="mode-bar is-ear"><span>By ear</span><i style="width:' + modePct("ear") + '%"></i></div>' +
          "</div></div>"
        : "") +
      (w.tests.length
        ? '<p class="can-lead">The test, this week: ' +
          w.tests.map(function (t) { return t.score + "%"; }).join(", then ") + '.</p>'
        : "") +
      (log.length ? '<div class="can-group"><h2 class="can-head">Session by session' +
        '<span class="fold-count">' + log.length + "</span></h2>" +
        log.map(diaryRow).join("") + "</div>" : "") +
      (stuckList().length
        ? '<div class="can-group"><h2 class="can-head">What you keep getting wrong' +
          '<span class="fold-count">' + stuckList().length + "</span></h2>" +
          '<p class="can-note">Ordered by how many times each one has gone. This is the list a session ' +
          "shows you at the end and then forgets.</p>" +
          stuckList(12).map(function (u) {
            return '<div class="diary-row"><span class="diary-when">' + u.misses + "&#215;</span>" +
              '<span class="diary-body"><span class="ar">' + esc(disp(u.ar)) + "</span>" +
              '<span class="diary-delta">' + esc(u.en) + "</span></span>" +
              standingHTML(u.ar) + sayBtn(u.ar, true) + "</div>";
          }).join("") +
          '<div class="btn-row" style="margin-top:12px">' +
          '<button class="btn btn-wide" data-act="stuck-play">Do these now</button></div></div>'
        : "") +
      (cold.length
        ? '<div class="can-group"><h2 class="can-head">Not seen in a while' +
          '<span class="fold-count">' + unseen().length + "</span></h2>" +
          '<p class="can-note">Either never asked, or last asked more than ' + UNSEEN_AFTER +
          " days ago. They are in the draw like everything else; this is only so you know they exist.</p>" +
          cold.map(function (u) {
            return '<div class="diary-row"><span class="diary-when">' +
              (u.since === null ? "never" : u.since + "d") + "</span>" +
              '<span class="diary-body"><span class="ar">' + esc(disp(u.ar)) + "</span>" +
              '<span class="diary-delta">' + esc(u.en) + "</span></span>" +
              sayBtn(u.ar, true) + "</div>";
          }).join("") + "</div>"
        : "") +
      '<div class="btn-row"><button class="btn btn-ghost" data-go="review">Mixed review</button>' +
      '<button class="btn" data-go="home">Back</button></div>';
  }

  // Big enough to read at arm's length, with the English under it and
  // the speaker on the right. No search, no lessons, no scores.
  function nowHTML() {
    return topbarHTML("Right now") +
      '<p class="pb-lead">The lines you need while someone is standing in front of you. ' +
      "Nothing to search and nothing to unlock: tap one to hear it.</p>" +
      NOW.map(function (group) {
        return '<div class="now-group"><h2 class="can-head">' + esc(group.title) + "</h2>" +
          group.lines.map(function (ar) {
            return '<div class="now-row">' +
              '<span class="now-body"><span class="ar now-ar">' + esc(disp(ar)) + "</span>" +
              '<span class="now-en">' + esc(englishFor(ar) || "") + "</span></span>" +
              sayBtn(ar) + "</div>";
          }).join("") + "</div>";
      }).join("") +
      '<div class="btn-row"><button class="btn btn-ghost" data-go="phrasebook">The whole phrasebook</button>' +
      '<button class="btn" data-go="home">Back</button></div>';
  }

  /* ---------- the sounds, and telling them apart ---------- */

  var sounds = null;

  function newSounds(prev) {
    var i = Math.floor(Math.random() * MINIMAL.length);
    if (prev && MINIMAL.length > 1) {
      while (i === prev.i) i = Math.floor(Math.random() * MINIMAL.length);
    }
    return {
      i: i,
      said: Math.random() < 0.5 ? "a" : "b",
      checked: false,
      right: false,
      chose: null,
      n: prev ? prev.n : 0,
      ok: prev ? prev.ok : 0
    };
  }

  function soundsSay() {
    if (!sounds) return;
    var p = MINIMAL[sounds.i];
    var w = p[sounds.said];
    speak(w.tr, false, w.ar);
  }

  function soundsAnswer(which) {
    if (!sounds || sounds.checked) return;
    sounds.chose = which;
    sounds.checked = true;
    sounds.right = which === sounds.said;
    sounds.n += 1;
    if (sounds.right) sounds.ok += 1;
    render();
  }

  function pairWord(w, taught) {
    return '<span class="pair-word"><span class="ar">' + esc(w.ar) + "</span>" +
      '<span class="pair-tr">' + esc(w.tr) + "</span>" +
      '<span class="pair-en">' + esc(w.en) + (taught ? " &#183; in the course" : "") + "</span></span>";
  }

  function sayScript(w) {
    return '<button class="say say-sm" data-act="say" data-say="' + esc(w.tr) +
      '" data-script="' + esc(w.ar) + '"' + (canSpeak() ? "" : " disabled") +
      ' aria-label="Hear ' + esc(w.tr) + '">' + SPEAKER_SVG + "</button>";
  }

  function soundsDrillHTML() {
    if (!canSpeak()) {
      return '<p class="can-note">The drill needs an Arabic voice on this device. ' +
        "The pairs above are still worth reading.</p>";
    }
    var p = MINIMAL[sounds.i];
    var said = p[sounds.said];
    return '<div class="card sounds-card">' +
      '<div class="eyebrow">Which did you hear?</div>' +
      '<div class="listen-stage">' +
      '<button class="say say-lg" data-act="say" data-say="' + esc(said.tr) +
      '" data-script="' + esc(said.ar) + '" aria-label="Play it again">' + SPEAKER_SVG + "</button></div>" +
      '<div class="sounds-pick">' + ["a", "b"].map(function (k) {
        var w = p[k];
        var cls = "sounds-opt";
        if (sounds.checked) {
          if (k === sounds.said) cls += " is-right";
          else if (k === sounds.chose) cls += " is-wrong";
        }
        return '<button class="' + cls + '" data-act="sounds-pick" data-id="' + k + '"' +
          (sounds.checked ? " disabled" : "") + ">" +
          '<span class="sounds-en">' + esc(w.en) + "</span>" +
          '<span class="ar">' + esc(w.ar) + "</span></button>";
      }).join("") + "</div>" +
      (sounds.checked
        ? '<p class="sounds-verdict ' + (sounds.right ? "ok" : "no") + '">' +
          (sounds.right ? "Yes, that was " : "No, that was ") + esc(said.en.toLowerCase()) +
          ". " + esc(p.note) + "</p>" +
          '<div class="btn-row">' +
          '<button class="btn btn-ghost" data-act="sounds-again">Hear both</button>' +
          '<button class="btn" data-act="sounds-next">Another</button></div>'
        : '<p class="can-note">Nothing is scored beyond this screen. If the two sound identical, ' +
          "that is the whole problem; if they sound identical on this device, try another voice " +
          "under About the audio.</p>") +
      '<p class="sounds-score">' + sounds.ok + " of " + sounds.n + " so far</p>" +
      "</div>";
  }

  function soundsHTML() {
    return topbarHTML("The sounds you cannot hear yet") +
      '<p class="pb-lead">Six of these consonants do not exist in Italian, and the trouble is not saying ' +
      "them: it is that two different words arrive at your ear as one. Every pair below is one letter or " +
      "one vowel length apart, and half the words are already in the course.</p>" +
      (sounds ? soundsDrillHTML() : '<div class="btn-row"><button class="btn btn-wide" data-act="sounds-start">' +
        (canSpeak() ? "Start the drill" : "The drill needs a voice") + "</button></div>") +
      MINIMAL.map(function (p) {
        return '<div class="pair-row"><div class="pair-head">' + esc(p.sound) + "</div>" +
          '<div class="pair-two">' +
          '<div class="pair-side">' + pairWord(p.a, !!SCRIPT[p.a.tr]) + sayScript(p.a) + "</div>" +
          '<div class="pair-side">' + pairWord(p.b, !!SCRIPT[p.b.tr]) + sayScript(p.b) + "</div>" +
          "</div>" +
          '<p class="pair-note">' + esc(p.note) + "</p></div>";
      }).join("") +
      '<p class="can-lead">The spelling in this course cannot show the difference in some of these pairs - ' +
      "har&#224;m and har&#224;m are written the same way - which is the honest limit of writing Arabic in " +
      "Latin letters. The Arabic script above each word is where the difference actually lives.</p>" +
      '<div class="btn-row"><button class="btn" data-go="home">Back</button></div>';
  }

  // The mixed review draws on everything you have passed, which is right
  // most of the time and wrong when you are going somewhere on Tuesday
  // and want the four lessons that matter for it.
  function chooseHTML() {
    var open = finishedLessons();
    if (!open.length) {
      return topbarHTML("Choose your lessons") +
        '<p class="pb-lead">Pass a lesson first: there is nothing to choose between yet.</p>' +
        '<div class="btn-row"><button class="btn" data-go="home">Back to the lessons</button></div>';
    }
    var picked = chosenLessons();
    var n = 0;
    open.forEach(function (l) {
      visiblePhrases(l).forEach(function (p) {
        if (!picked.length || picked.indexOf(l.id) !== -1) n++;
      });
    });
    return topbarHTML("Choose your lessons") +
      '<p class="pb-lead">Tick the lessons you want to practise and the session draws from those alone. ' +
      "Tick none and it draws from everything, which is what the mixed review does.</p>" +
      '<div class="scope-row">' +
      '<button class="pill pill--md chip" data-act="chose-all">All of them</button>' +
      '<button class="pill pill--md chip" data-act="chose-none">None</button></div>' +
      '<div class="scope-grid">' + open.map(function (l) {
        var on = picked.indexOf(l.id) !== -1;
        return '<button class="scope-cell' + (on ? " is-on" : "") + '" data-act="chose" data-id="' + l.id +
          '" title="' + esc(l.title) + '" aria-pressed="' + (on ? "true" : "false") + '">' +
          lessonNo(l) + "</button>";
      }).join("") + "</div>" +
      '<p class="scope-list">' + esc(picked.length
        ? open.filter(function (l) { return picked.indexOf(l.id) !== -1; })
            .map(function (l) { return l.title; }).join(" · ")
        : "Everything you have passed") + "</p>" +
      '<p class="can-lead">' + n + " phrase" + (n === 1 ? "" : "s") + " in the draw." +
      (picked.length ? " Nothing else will come up until you change this." : "") + "</p>" +
      '<div class="btn-row">' +
      '<button class="btn btn-wide" data-act="chose-play">Play these</button></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" data-go="home">Back</button></div>';
  }

  // If they say this, you say that. Fifteen of them, and they are worth
  // more than any fifteen other phrases in the course.
  function ritualHTML() {
    return topbarHTML("If they say this, you say that") +
      '<p class="pb-lead">Half of what is said to you has one right answer. Not having it is more awkward ' +
      "than not saying anything at all, and there are only fifteen to learn.</p>" +
      RITUAL.map(function (r) {
        return '<div class="ritual"><div class="ritual-side"><span class="ritual-tag">they say</span>' +
          '<span class="ar">' + esc(disp(r.say)) + "</span>" + sayBtn(r.say, true) +
          '<span class="ritual-en">' + esc(englishFor(r.say) || "") + "</span></div>" +
          '<div class="ritual-side is-you"><span class="ritual-tag">you say</span>' +
          '<span class="ar">' + esc(disp(r.back)) + "</span>" + sayBtn(r.back, true) +
          '<span class="ritual-en">' + esc(englishFor(r.back) || "") + "</span></div></div>";
      }).join("") +
      '<div class="btn-row"><button class="btn" data-go="home">Back</button></div>';
  }

  var recall = null;

  function recallOpen() {
    return RECALL.filter(function (r) {
      var l = lessonById(r.from);
      var rec = l ? recordOf(l.id) : null;
      return !!(rec && rec.done);
    });
  }

  function newRecall(prev) {
    var pool = recallOpen();
    if (!pool.length) return null;
    var r = shuffle(pool)[0];
    if (prev && pool.length > 1) {
      var g = 0;
      while (g++ < 8 && r.en === prev.r.en) r = shuffle(pool)[0];
    }
    return { r: r, typed: "", checked: false, got: [], missed: [] };
  }

  function recallCheck() {
    if (!recall || recall.checked) return;
    var field = app.querySelector('[data-act="recall-typing"]');
    if (field) recall.typed = field.value;
    var lines = String(recall.typed || "").split(/[\n,;]+/).map(function (x) { return x.trim(); })
      .filter(Boolean);
    var got = [], missed = [];
    recall.r.has.forEach(function (ar) {
      var hit = lines.some(function (line) {
        var v = judgeTyped(line, ar);
        return !!(v && v.right);
      });
      if (hit) got.push(ar); else missed.push(ar);
    });
    recall.got = got;
    recall.missed = missed;
    recall.checked = true;
    // Producing a phrase from nothing but a situation is the hardest way
    // to prove you have it, so it counts like any other right answer.
    got.forEach(function (ar) {
      var lid = lessonTeaching(ar);
      if (lid) bumpStrength(lid, ar, true);
    });
    save();
    render();
  }

  // "52 of 80" is one number for thirty lessons. This is the same
  // information with the shape left in: one strip per lesson, four
  // bands, so a glance says which lesson has gone soft.
  function strengthStrip(l) {
    var solid = 0, warm = 0, cold = 0, unmet = 0;
    var list = visiblePhrases(l);
    list.forEach(function (p) {
      if (knownRec(l.id, p.ar)) { solid++; return; }
      var st = strengthOf(l.id, p.ar);
      if (st === null) unmet++;
      else if (st >= MASTERED) solid++;
      else if (st >= 2) warm++;
      else cold++;
    });
    if (!list.length) return "";
    function seg(n, cls) {
      return n ? '<i class="' + cls + '" style="flex:' + n + '"></i>' : "";
    }
    return '<span class="strip" aria-hidden="true">' +
      seg(solid, "is-solid") + seg(warm, "is-warm") + seg(cold, "is-cold") + seg(unmet, "is-unmet") +
      "</span>";
  }

  // Every phrase you have taken out of rotation, and why, in one place.
  function wordsIndex() {
    var out = { known: [], hidden: [], passive: [] };
    var seen = {};
    function once(l, ar) {
      var k = l.id + "|" + ar;
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    }
    LESSONS.forEach(function (l) {
      l.phrases.forEach(function (p) {
        if (!once(l, p.ar)) return;
        if (isHidden(l.id, p.ar)) { out.hidden.push({ ar: p.ar, en: p.en, lesson: l }); return; }
        if (isPassive(p.ar)) out.passive.push({ ar: p.ar, en: p.en, lesson: l });
        var rec = knownRec(l.id, p.ar);
        if (rec) {
          out.known.push({
            ar: p.ar, en: p.en, lesson: l,
            due: Math.max(0, RECHECK_AFTER - knownAge(rec))
          });
        }
      });
      (l.dialogue || []).forEach(function (d) {
        if (!once(l, d.reply)) return;
        if (isHidden(l.id, d.reply)) { out.hidden.push({ ar: d.reply, en: d.en, lesson: l }); return; }
        if (isPassive(d.reply)) out.passive.push({ ar: d.reply, en: d.en, lesson: l });
        var r2 = knownRec(l.id, d.reply);
        if (r2) {
          out.known.push({
            ar: d.reply, en: d.en, lesson: l,
            due: Math.max(0, RECHECK_AFTER - knownAge(r2))
          });
        }
      });
    });
    return out;
  }

      '<button class="pill pill--md word-undo" data-act="' + act + '" data-id="' + esc(it.ar) +
      '" data-lesson="' + it.lesson.id + '">' + esc(label) + "</button></div>";
  }
